<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProConta · Facturas (maqueta)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#14213A;--navy2:#22314F;--navy3:#1B2A47;--ink:#16213A;--mut:#646A78;--mut2:#7A8090;--txt2:#3B4252;
  --or:#F4A259;--or2:#D9622B;--or3:#B4481F;
  --bg:#F1EEE7;--bg2:#FBFAF7;--card:#FFFFFF;--ln:#ECE8DE;--ln2:#F3F0E9;--ln3:#E1DDD2;--inb:#E4E1D8;--inbg:#FAF9F6;
  --blue:#1D5C8C;--blueb:#E3ECF6;--green:#1E6B45;--greenb:#E2F0E8;--red:#B42318;--redb:#FDF1EF;
  --amb:#8A4410;--ambb:#FFEBD6;--pur:#5B3F86;--purb:#ECE6F3;
  --act:#FFF3E6;--selb:#E8F0F9;--selb2:#F2E9DF;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:13px;color:var(--ink);background:#CFCBC2;display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.tn{font-variant-numeric:tabular-nums}
.mut{color:var(--mut)}
.grow{flex:1 1 auto}
.ic{flex-shrink:0;display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--or);outline-offset:1px}

/* ───── Barra de demostración (fuera del producto) ───── */
#demo{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:7px 14px;background:#232427;color:#E6E6E6;font-size:12px;border-bottom:3px dashed #FFD54A}
#demo .dtag{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:11px;letter-spacing:.08em;background:#FFD54A;color:#232427;padding:2px 7px;border-radius:4px}
#demo .dnote{color:#A9A9A9;font-size:11.5px}
#demo label{display:inline-flex;align-items:center;gap:6px;color:#BDBDBD}
#demo select{height:26px;border-radius:6px;border:1px solid #4A4B50;background:#2F3034;color:#F0F0F0;padding:0 6px;font-size:12px}
#demo .dseg{display:inline-flex;border:1px solid #4A4B50;border-radius:7px;overflow:hidden}
#demo .dseg button{height:26px;border:0;background:#2F3034;color:#D0D0D0;padding:0 10px;cursor:pointer;font-size:12px}
#demo .dseg button[aria-pressed="true"]{background:#FFD54A;color:#232427;font-weight:600}
#demo .dbtn{height:26px;border-radius:6px;border:1px solid #4A4B50;background:#2F3034;color:#F0F0F0;padding:0 10px;cursor:pointer}
#demo :focus-visible{outline:2px solid #FFD54A}

/* ───── Ventana ───── */
#stage{flex:1 1 auto;min-height:0;display:flex;justify-content:center;overflow:auto}
#win{position:relative;height:100%;min-height:600px;width:100%;background:var(--bg);display:flex;flex-direction:column;box-shadow:0 0 0 1px rgba(0,0,0,.12),0 10px 40px rgba(0,0,0,.18);overflow:hidden;flex:none}
.titlebar{height:40px;flex:none;background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:0 0 0 14px}
.brand{display:flex;align-items:center;gap:8px;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:15px;letter-spacing:.01em}
.brand i{width:20px;height:20px;border-radius:6px;background:var(--or);display:inline-block;position:relative}
.brand i:after{content:"";position:absolute;inset:6px 5px 5px 6px;border-radius:2px;background:var(--navy)}
.ctxpill{height:26px;display:inline-flex;align-items:center;gap:6px;padding:0 10px;border-radius:7px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);font-size:12px;color:#DCE3F0}
.ctxpill b{color:#fff;font-weight:600}
.tb-op{font-size:12px;color:#AEB8CC}
.tb-op b{color:#fff;font-weight:500}
.winbtns{display:flex;height:100%}
.winbtns span{width:46px;display:flex;align-items:center;justify-content:center;color:#AEB8CC}
.ctabs{height:36px;flex:none;background:var(--navy3);display:flex;align-items:flex-end;gap:2px;padding:0 8px}
.ctab{height:30px;border:0;border-radius:8px 8px 0 0;background:transparent;color:#AEB8CC;padding:0 14px;display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-size:12.5px;white-space:nowrap}
.ctab:hover{background:rgba(255,255,255,.06);color:#fff}
.ctab[aria-selected="true"]{background:var(--bg);color:var(--navy);font-weight:600}
.wbody{flex:1 1 auto;min-height:0;display:flex}
.rail{width:56px;flex:none;background:var(--navy);display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:8px}
.rail span{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#8E9AB3}
.rail span.on{background:var(--or);color:var(--navy)}
main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;min-height:0}
.statusbar{height:24px;flex:none;background:#fff;border-top:1px solid var(--ln);display:flex;align-items:center;gap:14px;padding:0 12px;font-size:11.5px;color:var(--mut)}
.statusbar .dotg{width:7px;height:7px;border-radius:50%;background:#2E8A5C;display:inline-block;margin-right:5px}

/* ───── Barra del módulo (pantalla completa) ───── */
.modbar{height:48px;flex:none;background:#fff;border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:10px;padding:0 14px}
.modbar h1{margin:0;font-family:'Bricolage Grotesque',sans-serif;font-size:18px;font-weight:600}
.modbar .ctxi{font-size:12px;color:var(--mut);white-space:nowrap}
.vsep{width:1px;height:22px;background:var(--ln3);flex:none}
.gtools{display:flex;gap:6px;align-items:center}
.clichip{height:28px;display:inline-flex;align-items:center;gap:6px;padding:0 4px 0 10px;border-radius:999px;background:var(--navy);color:#fff;font-size:12px;white-space:nowrap}
.clichip button{border:0;background:rgba(255,255,255,.14);color:#fff;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}

/* ───── Ficha de tercero (contexto embebido) ───── */
.fhead{flex:none;background:#fff;display:flex;align-items:center;gap:12px;padding:10px 20px 8px}
.av{width:38px;height:38px;border-radius:10px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;flex:none}
.av.F{border-radius:50%;background:var(--blueb);color:var(--blue)}
.av.E{background:var(--purb);color:var(--pur)}
.fhead h1{margin:0;font-family:'Bricolage Grotesque',sans-serif;font-size:19px;font-weight:600;line-height:1.2}
.fhead .fsub{font-size:12px;color:var(--mut)}
.rbadge{height:22px;padding:0 8px;border-radius:6px;font-size:11.5px;font-weight:600;background:var(--greenb);color:var(--green);display:inline-flex;align-items:center;gap:5px}
.ftabs{flex:none;background:#fff;display:flex;gap:18px;padding:0 20px;border-bottom:1px solid var(--ln);overflow-x:auto}
.ftab{height:38px;border:0;border-bottom:2px solid transparent;background:none;padding:0 1px;font-size:13px;color:#555B69;cursor:pointer;font-weight:500;white-space:nowrap}
.ftab:hover{color:var(--navy)}
.ftab[aria-selected="true"]{color:var(--navy);border-bottom-color:var(--or);font-weight:600}
.vstrip{flex:none;display:flex;align-items:center;gap:10px;padding:8px 14px 0}
.lockchip{height:28px;display:inline-flex;align-items:center;gap:6px;padding:0 10px;border-radius:8px;background:#fff;border:1px solid var(--ln3);font-size:12.5px;font-weight:600;color:var(--navy)}
.lockchip .ic{color:var(--mut)}

/* ───── Controles ───── */
.btn{height:30px;padding:0 11px;border-radius:8px;border:1px solid var(--ln3);background:#fff;font-size:12.5px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;color:var(--ink)}
.btn:hover{background:#FAF9F6;border-color:#CFC9BA}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.pri:hover{background:var(--navy2)}
.btn.cta{background:var(--or);border-color:var(--or);color:var(--navy);font-weight:600}
.btn.cta:hover{background:#F7B475}
.btn.ghost{border-color:transparent;background:transparent;color:var(--blue)}
.btn.ghost:hover{background:var(--ln2)}
.btn.danger{color:#A12B1B;border-color:#EBC7C0}
.btn.sm{height:26px;padding:0 9px;font-size:12px;border-radius:7px}
.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.btn[aria-disabled="true"]:hover{background:#fff;border-color:var(--ln3)}
.btn.pri[aria-disabled="true"]:hover{background:var(--navy)}
.icb{width:28px;height:28px;border-radius:7px;border:0;background:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:var(--mut);flex:none;padding:0}
.icb:hover{background:var(--ln2);color:var(--navy)}
.lnk{border:0;background:none;padding:0;color:var(--blue);cursor:pointer;text-decoration:underline;text-underline-offset:2px;font-size:inherit}
.lnk:hover{color:var(--or3)}
.in{height:28px;border:1px solid var(--inb);border-radius:7px;background:var(--inbg);padding:0 8px;font-size:12.5px;color:var(--ink);min-width:0}
.in:hover{border-color:#D6D1C4}
.in:focus{outline:none;background:#fff;border-color:var(--navy);box-shadow:0 0 0 3px rgba(244,162,89,.35)}
select.in{padding-right:4px;cursor:pointer}
.in.on{background:#FFF6EC;border-color:#EDBB95;color:var(--or3);font-weight:500}
textarea.in{height:auto;padding:6px 8px;resize:vertical}
.sbox{height:28px;display:inline-flex;align-items:center;gap:6px;padding:0 8px;border:1px solid var(--inb);border-radius:7px;background:var(--inbg);color:var(--mut);flex:none}
.sbox:focus-within{background:#fff;border-color:var(--navy);box-shadow:0 0 0 3px rgba(244,162,89,.35)}
.sbox input{border:0;outline:none;background:transparent;min-width:0;flex:1;font-size:12.5px;color:var(--ink)}
.seg{display:inline-flex;gap:2px;padding:2px;border-radius:8px;background:var(--bg);flex:none}
.seg button{height:24px;border:0;border-radius:6px;background:none;font-size:12px;font-weight:500;color:#555B69;cursor:pointer;padding:0 9px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.seg button:hover{color:var(--navy)}
.seg button[aria-pressed="true"],.seg button[aria-checked="true"]{background:#fff;color:var(--navy);box-shadow:0 1px 2px rgba(20,33,58,.12)}
.seg button[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.seg .ct{font-size:10.5px;color:var(--mut2)}
.flbl{font-size:11.5px;color:var(--mut);white-space:nowrap}

/* ───── Área de trabajo compartida ───── */
.ws{flex:1 1 auto;min-height:0;display:flex;position:relative;padding:10px;gap:10px}
.lists{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:10px;min-height:0;overflow-y:auto}
.panel{background:#fff;border:1px solid var(--ln);border-radius:12px;display:flex;flex-direction:column;min-height:0;flex:none}
.pemit{flex:1 1 auto;min-height:260px}
.ph,.fbar,.bulk,.tfoot{flex:none}
.ph{display:flex;align-items:center;gap:8px;padding:7px 10px 7px 8px;min-height:42px;flex-wrap:wrap}
.ph h2{margin:0;font-size:14px;font-weight:600;white-space:nowrap}
.ph .cnt{font-size:12px;color:var(--mut);white-space:nowrap}
.ph .acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pemit .ph{padding-left:12px}
.pprog.collapsed .pbody{display:none}
.pprog .ph .icb .ic{transition:transform .15s}
.pprog.collapsed .ph .icb .ic{transform:rotate(-90deg)}
.psum{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pbody{display:flex;flex-direction:column;min-height:0}
.fbar{display:flex;align-items:center;gap:6px 8px;padding:0 12px 8px;flex-wrap:wrap}
.tw{overflow:auto;border-top:1px solid var(--ln);min-height:0;position:relative}
.pprog .tw{max-height:clamp(120px,24vh,220px)}
.pprog .tw.hasx{max-height:clamp(220px,50vh,460px)}
.tbl tr.r{scroll-margin-top:30px}
.pemit .tw{flex:1 1 auto}

.progchip{height:26px;display:inline-flex;align-items:center;gap:6px;padding:0 3px 0 9px;border-radius:7px;background:#FFF3E6;border:1px solid #F2C9A3;color:#8A4410;font-size:12px;max-width:520px;min-width:0}
.progchip .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.progchip .clr{height:20px;border:0;border-radius:5px;background:#fff;color:var(--or3);display:inline-flex;align-items:center;gap:4px;padding:0 7px;cursor:pointer;font-size:11.5px;font-weight:600;white-space:nowrap;border:1px solid #F2C9A3}
.progchip .clr:hover{background:#FFE8D2}

.bulk{display:flex;align-items:center;gap:6px 10px;padding:6px 12px;border-top:1px solid var(--ln);background:var(--bg2);flex-wrap:wrap;font-size:12px}
.bulk .bl{color:var(--mut);white-space:nowrap}
.bulk .hint{color:var(--mut);font-size:11.5px}
.bulk .hint.warn{color:var(--amb)}

/* tabla */
.tbl{border-collapse:separate;border-spacing:0;width:100%;table-layout:fixed}
.tbl th{position:sticky;top:0;z-index:2;background:var(--bg2);text-align:left;font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);height:28px;padding:0 8px;border-bottom:1px solid var(--ln);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl th.r,.tbl td.r{text-align:right}
.tbl td{height:30px;padding:0 8px;border-bottom:1px solid var(--ln2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px;background:#fff}
.tbl tr.r{cursor:pointer}
.tbl tr.r:hover td{background:#FBFAF6}
.tbl tr.r:focus{outline:none}
.tbl tr.r:focus-visible td{box-shadow:inset 0 2px 0 var(--or),inset 0 -2px 0 var(--or)}
.tbl tr.r:focus-visible td:first-child{box-shadow:inset 2px 2px 0 var(--or),inset 0 -2px 0 var(--or)}
.tbl tr.r:focus-visible td:last-child{box-shadow:inset -2px 2px 0 var(--or),inset 0 -2px 0 var(--or)}
.tbl tr.sel td{background:var(--selb)}
.tbl tr.sel:hover td{background:#DFEAF6}
.tbl tr.flt td{background:#FFF8EF}
.tbl tr.act td{background:var(--act)}
.tbl tr.act.sel td{background:#F4ECE6}
.tbl tr.act td:first-child{box-shadow:inset 4px 0 0 var(--or2)}
.tbl tr.act:focus-visible td:first-child{box-shadow:inset 4px 0 0 var(--or2),inset 0 2px 0 var(--or),inset 0 -2px 0 var(--or)}
.tbl td.cb,.tbl th.cb{padding:0;text-align:center}
.tbl input[type=checkbox]{width:15px;height:15px;accent-color:var(--navy);cursor:pointer;margin:0;vertical-align:middle}
.tbl .b{font-weight:600}
.sortb{border:0;background:none;padding:0;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:3px}
.sortb:hover{color:var(--navy)}
.sortb .ar{font-size:10px;color:var(--or2)}
.num{font-family:'IBM Plex Mono',monospace;font-size:12px}
.num b{font-weight:600;color:var(--navy)}
.drf{font-family:'IBM Plex Mono',monospace;font-size:12px;color:#57523F;font-style:italic}
.tR{font-size:9.5px;font-weight:700;color:var(--pur);background:var(--purb);border-radius:3px;padding:0 4px;margin-left:4px;font-family:'IBM Plex Sans',sans-serif;vertical-align:1px}
.ocode{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--mut);margin-right:6px}
.ocode.man{font-family:'IBM Plex Sans',sans-serif;font-style:italic;color:var(--mut2)}
.pcode{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--mut);margin-right:7px}
.fic{display:inline-flex;vertical-align:-2px;color:var(--or2);margin-right:4px}
.prev{color:#555B69}
.prev:before{content:"≈ ";color:var(--mut2)}
.tfoot{display:flex;align-items:center;gap:6px 16px;flex-wrap:wrap;padding:6px 12px;border-top:1px solid var(--ln);font-size:11.5px;color:var(--mut);background:var(--bg2);border-radius:0 0 12px 12px}
.tfoot b{color:var(--ink);font-weight:600}
.lg{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.lg i{width:14px;height:12px;border-radius:2px;display:inline-block}
.lg .la{background:var(--act);box-shadow:inset 3px 0 0 var(--or2)}
.lg .ls{background:var(--selb);border:1px solid #C7D8EC}
.lg .lf{background:#FFF8EF;border:1px solid #F2C9A3}

/* estado factura (relleno) vs VeriFactu (contorno) */
.pill{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:500;white-space:nowrap}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor}
.st-BOR{background:#ECE9E0;color:#57523F;box-shadow:inset 0 0 0 1px #B9B29C;border:0}
.st-BOR i{background:transparent;border:1.5px solid currentColor;width:7px;height:7px}
.st-EMI{background:#E4E7EE;color:var(--navy)}
.st-RCT{background:var(--purb);color:var(--pur)}
.ps-A{background:var(--greenb);color:var(--green)}
.ps-P{background:var(--ambb);color:var(--amb)}
.ps-F{background:#ECE9E0;color:#6A6553}
.vf{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:4px;border:1px solid;font-size:11px;font-weight:500;background:#fff;white-space:nowrap}
.vf-ACE{color:var(--green);border-color:#A9D2BB}
.vf-ACW{color:#7A5A00;border-color:#E2CF8F;background:#FFFBEA}
.vf-REC{color:#A12B1B;border-color:#EBC7C0;background:#FDF6F5}
.vf-ERR{color:var(--or3);border-color:#F2C9A3;background:#FFF8F0}
.vf-PEN,.vf-ENV{color:var(--blue);border-color:#A9C5E2}
.vf-NA{color:var(--mut2);border-color:var(--ln3);border-style:dashed}
.spin{animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.simtag{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.06em;color:var(--pur);background:var(--purb);padding:1px 6px;border-radius:4px;text-transform:uppercase;vertical-align:1px}
.prop{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.05em;color:var(--amb);border:1px dashed var(--or2);background:#FFF6EC;padding:0 5px;border-radius:4px;text-transform:uppercase;vertical-align:1px;white-space:nowrap}

/* estados de lista */
.state{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:22px 16px;text-align:center;color:var(--mut);font-size:12.5px;line-height:1.45}
.state b{color:var(--ink);font-size:13px}
.state .ic{color:var(--mut2)}
.state.err .ic{color:var(--red)}
.state .btns{display:flex;gap:6px;margin-top:4px}
.state.big{flex:1;background:#fff;border:1px solid var(--ln);border-radius:12px}
.sk{display:block;height:10px;border-radius:5px;background:linear-gradient(90deg,#EFECE5,#F7F5F0,#EFECE5);background-size:200% 100%;animation:shim 1.2s infinite}
@keyframes shim{to{background-position:-200% 0}}

/* ───── Detalle ───── */
.detail{width:452px;flex:none;background:#fff;border:1px solid var(--ln);border-radius:12px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.detail[hidden]{display:none}
#win.nd .detail{position:absolute;right:10px;top:10px;bottom:10px;z-index:20;box-shadow:-12px 0 36px rgba(20,33,58,.22)}
.dh{padding:10px 12px 10px 14px;border-bottom:1px solid var(--ln);display:flex;flex-direction:column;gap:7px}
.dtop{display:flex;align-items:center;gap:8px}
.dkind{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
.dtitle{font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:600;color:var(--navy)}
.dsub{font-size:12.5px;color:var(--txt2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dstat{display:flex;gap:16px;flex-wrap:wrap}
.dstat>div{display:flex;flex-direction:column;gap:3px}
.dl{font-size:10.5px;color:var(--mut);font-weight:500}
.dacts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dtabs{display:flex;gap:16px;padding:0 14px;border-bottom:1px solid var(--ln);flex:none}
.dtab{height:34px;border:0;border-bottom:2px solid transparent;background:none;padding:0 1px;font-size:12.5px;color:#555B69;cursor:pointer;font-weight:500;white-space:nowrap}

  const iva=r2(ivas.reduce((s,x)=>s+x.cuota,0));const retv=r2(base*(ret||0)/100);
  return {base,ivas,iva,ret:retv,total:r2(base+iva-retv)};
}
function sched(p){
  const out=[],n=PER[p.per].n;let d=new Date(p.inicio);let lim=TODAY;
  if(p.fin&&p.fin<lim)lim=p.fin; if(p.pausa&&p.pausa<lim)lim=p.pausa;
  while(d<=lim){if(d.getFullYear()===SOC.ej)out.push(new Date(d));d=addM(d,n);}return out;
}

  if(p.estado!=='A')return null;const n=PER[p.per].n;let d=new Date(p.inicio);const from=p.lastGen&&p.lastGen>TODAY?p.lastGen:TODAY;
  while(d<=from)d=addM(d,n); if(p.fin&&d>p.fin)return null; return d;
}
function perLabel(p,d){

}

function invActs(v,menu){
  const L=[];const p=v.prog?progById(v.prog):null;
  if(v.est==='BOR'){
    L.push(['Ver borrador','doc','doc']);
    L.push(['Editar borrador','edit','d-edit',!canEdit()?NOPERM:null]);
    L.push(['Emitir…','send','d-emit',!canEdit()?NOPERM:null,'pri']);
    L.push(['Eliminar borrador','trash','d-del',!canEdit()?NOPERM:null,'danger']);
  }else{
    L.push(['Ver documento','doc','doc']);
    L.push(['Preparar correo…','mail','mail',!canEdit()?NOPERM:!v.dest.mail?'El cliente no tiene email marcado para el envío de facturas. Añádelo en la pestaña Contacto de su ficha.':null]);
    L.push([p?'Programación '+progCode(p):'Programación de origen','repeat','goprog',p?null:'Emitida manualmente: no procede de ninguna programación.']);
    if(v.tipo==='R1')L.push(['Ver factura rectificada','undo','goinv-orig']);
    else if(v.rectBy)L.push(['Ver rectificativa','undo','goinv-rect']);
    else L.push(['Rectificar…','undo','rect',!canEdit()?NOPERM:['PEN','ENV','ERR'].includes(v.vf)?'Espera a que VeriFactu acepte el registro antes de rectificar.':v.vf==='REC'?'El registro fue rechazado: corresponde subsanarlo, no rectificarlo (propuesta).':null]);
  }

function fakeQR(seed){let s=seed*9301+49297;const r=()=>(s=(s*9301+49297)%233280)/233280;let cells='';const N=21;
  const fin=(x,y)=>(x<7&&y<7)||(x>13&&y<7)||(x<7&&y>13);
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){let on;if(fin(x,y)){const cx=x>13?x-14:x,cy=y>13?y-14:y;on=cx===0||cx===6||cy===0||cy===6||(cx>1&&cx<5&&cy>1&&cy<5);}else on=r()>.52;if(on)cells+=`<rect x="${x}" y="${y}" width="1" height="1"/>`;}
  return `<svg width="84" height="84" viewBox="-1 -1 23 23" style="flex:none;background:#fff;border:1px solid var(--ln3);border-radius:4px" aria-label="Código QR simulado"><g fill="#14213A">${cells}</g></svg>`;}

const numES=s=>{s=String(s??'').trim();if(!s)return NaN;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');s=s.replace('−','-');return /^-?\d+(\.\d+)?$/.test(s)?parseFloat(s):NaN;};
const fmtN=(v,dec)=>{const neg=v<0;v=Math.abs(v);let [i,d]=v.toFixed(dec).split('.');i=i.replace(/\B(?=(\d{3})+(?!\d))/g,'.');return (neg?'-':'')+i+(dec?','+d:'');};
const fmtQ=q=>Number.isInteger(q)?String(q):fmtN(q,2);
const recOf=key=>{const [t,id]=key.split(':');return t==='p'?progById(+id):invById(+id);};
const recTitle=key=>{const [t]=key.split(':');const r=recOf(key);return t==='p'?progCode(r)+' · '+r.desc:invNum(r);};
function lockWhy(key){
  const [t]=key.split(':');const r=recOf(key);
  if(t==='p'&&r.estado==='F')return 'Programación finalizada: sus líneas no se modifican.';
  if(t==='e'&&r.est!=='BOR')return r.tipo==='R1'?'Rectificativa emitida: sus líneas no se modifican.':'Factura emitida: sus líneas no se modifican. Para corregirla, emite una rectificativa.';
  if(!canEdit())return NOPERM;
  return null;
}
const lineEq=(l,x)=>l.c.trim()===x.c&&numES(l.q)===x.q&&numES(l.p)===x.p&&+l.iva===x.iva&&(numES(l.d)||0)===(x.d||0)&&(l.n||'').trim()===(x.n||'');
function editChanges(){
  const E=V.edit;if(!E)return 0;const r=recOf(E.key);const o=r.lines;let n=0;
  const kept=new Set();
  E.lines.forEach(l=>{if(l._o==null){n++;return;}kept.add(l._o);if(!lineEq(l,o[l._o]))n++;});
  o.forEach((_,i)=>{if(!kept.has(i))n++;});
  if((numES(E.rp)||0)!==(r.rp||0))n++;
  return n;
}
function draftLines(){return V.edit.lines.map(l=>({c:l.c,q:numES(l.q)||0,p:numES(l.p)||0,iva:+l.iva,d:numES(l.d)||0,n:l.n}));}
function startEdit(key){

    const r=recOf(key);
    V.edit={key,rp:fmtQ(r.rp||0),lines:r.lines.map((l,i)=>({c:l.c,q:fmtQ(l.q),p:fmtN(l.p,2),iva:l.iva,d:l.d?fmtN(l.d,2):'',n:l.n||'',ex:l.ex,_o:i})),err:{}};
    V.exp.add(key);if(key[0]==='p')V.progCollapsed=false;
    refresh();syncControls();

  };
  if(V.edit&&V.edit.key===key){$(`tr.xrow[data-x="${key}"] input`)?.focus();return;}
  guardEdit(go);
}
function validateEdit(){
  const E=V.edit;E.err={};
  if(!E.lines.length){toast('La factura debe tener al menos una línea.','info');return false;}
  E.lines.forEach((l,i)=>{
    if(!l.c.trim())E.err[i+'c']='Indica la descripción';
    const q=numES(l.q);if(isNaN(q)||q===0)E.err[i+'q']='Cantidad no válida';
    const p=numES(l.p);if(isNaN(p))E.err[i+'p']='Precio no válido';
    if(String(l.d).trim()){const d=numES(l.d);if(isNaN(d)||d<-100||d>100)E.err[i+'d']='Descuento entre −100 y 100 %';}
    if(E.key[0]==='p'&&q<0)E.err[i+'q']='En una programación la cantidad debe ser positiva';
  });
  if(String(E.rp).trim()){const rp=numES(E.rp);if(isNaN(rp)||rp<0||rp>100)E.err['rprp']='Retención entre 0 y 100 %';}
  const k=Object.keys(E.err);
  if(k.length){refresh();toast(`Hay ${k.length} dato${k.length>1?'s':''} por corregir en las líneas.`,'info');
    setTimeout(()=>{const f=$(`tr.xrow[data-x="${E.key}"] [aria-invalid="true"]`);f&&f.focus();},0);return false;}
  return true;
}
function saveEdit(){

function discardEdit(){const k=V.edit&&V.edit.key;V.edit=null;refresh();if(k)setTimeout(()=>focusRow(k),0);}

const XCOLS='<colgroup><col style="width:30px"><col><col style="width:100px"><col style="width:64px"><col style="width:110px"><col style="width:78px"><col style="width:70px"><col style="width:110px"><col style="width:114px"><col style="width:230px"><col style="width:34px"></colgroup>';

  const rpCell=E?`<span class="xrp">Retención <input class="in xin r${er?' err':''}" data-xi="rp" data-f="rp" value="${esc(rpv)}" aria-label="Porcentaje de retención" ${er?`aria-invalid="true" title="${esc(er)}"`:''} style="width:58px"> %</span>`:`Retención ${fmtQ(rp)} %`;
  return `<tfoot><tr class="xt-tot"><td></td><td>Total</td><td></td><td class="r tn" data-t="q">${v.q}</td><td class="r tn" data-t="neto">${v.neto}</td><td></td><td></td><td></td><td class="r tn" data-t="bruto">${v.bruto}</td><td></td><td></td></tr>
   ${E||rp?`<tr class="xret"><td></td><td>${rpCell}</td><td></td><td></td><td></td><td></td><td></td><td></td><td class="r tn" data-t="ret">${v.hasRet?v.ret:'—'}</td><td class="mut" style="font-size:11px">${E?'Sobre el importe neto; 0 = sin retención':'Sobre el importe neto'}</td><td></td></tr>`:''}
   <tr class="xliq" ${v.hasRet?'':'hidden'}><td></td><td>Total a cobrar</td><td></td><td></td><td></td><td></td><td></td><td></td><td class="r tn" data-t="liq">${v.liq}</td><td></td><td></td></tr></tfoot>`;
}
function xrowHTML(t,r,cols){
  const key=t+':'+r.id,E=V.edit&&V.edit.key===key?V.edit:null,why=lockWhy(key);
  const title=t==='p'?progCode(r):invNum(r);
  const head=`<div class="xph"><b>Líneas</b><span class="mut">${(E?E.lines:r.lines).length} · ${esc(title)}</span><span class="grow"></span>
    ${E?'<span class="xedtag">'+ic('edit',12)+'Editando</span>':why?`<span class="xlock" title="${esc(why)}">${ic('lock',12)}${esc(why)}</span>`:btn('Editar líneas',{act:'x-edit',icon:'edit',data:`data-k="${key}"`,title:'Modificar, añadir o eliminar líneas'})}</div>`;

    const inp=(i,f,v,cls,lab,ph='')=>{const er=E.err[i+f];return `<input class="in xin ${cls}${er?' err':''}" data-xi="${i}" data-f="${f}" value="${esc(v)}" placeholder="${ph}" aria-label="${lab} de la línea ${i+1}" ${er?`aria-invalid="true" title="${esc(er)}"`:''}>`;};
    rows=E.lines.map((l,i)=>{const q=numES(l.q),p=numES(l.p),ok=!isNaN(q)&&!isNaN(p);const nw=l._o==null;
      return `<tr class="${nw?'xnew':''}"><td class="mut tn">${i+1}</td><td>${inp(i,'c',l.c,'','Descripción')}</td><td>${inp(i,'p',l.p,'r','Precio neto')}</td><td>${inp(i,'q',l.q,'r','Cantidad')}</td>
      <td class="r tn" data-in="${i}">${ok?money(q*p):'—'}</td><td>${ivaSel(i,l.iva)}</td><td>${inp(i,'d',l.d,'r','Descuento','—')}</td>
      <td class="r tn mut" data-pb="${i}">${isNaN(p)?'—':money(bruto(p,+l.iva))}</td><td class="r tn" data-ib="${i}">${ok?money(r2(q*p*(1+l.iva/100))):'—'}</td>
      <td>${inp(i,'n',l.n,'','Notas')}</td><td><button type="button" class="icb xdel" data-act="x-del" data-i="${i}" title="Eliminar la línea ${i+1}" aria-label="Eliminar la línea ${i+1}">${ic('trash',14)}</button></td></tr>`;}).join('');
  }else{
    rows=r.lines.map((l,i)=>`<tr><td class="mut tn">${i+1}</td><td title="${esc(l.c)}">${esc(l.c)}${l.ex?`<span class="mut" style="font-size:11px"> · ${esc(l.ex)}</span>`:''}${t==='p'&&i===0?'<span class="mut" style="font-size:11px" title="Al generar, se añade el periodo facturado"> + periodo</span>':''}</td>
      <td class="r tn">${money(l.p)}</td><td class="r tn">${fmtQ(l.q).replace('-','−')}</td><td class="r tn">${money(l.q*l.p)}</td><td class="r tn">${l.iva?l.iva+' %':'Exento'}</td><td class="r tn">${l.d?fmtN(l.d,2).replace('-','−')+' %':''}</td>
      <td class="r tn mut">${money(bruto(l.p,l.iva))}</td><td class="r tn">${money(r2(l.q*l.p*(1+l.iva/100)))}</td><td class="mut" title="${esc(l.n||'')}">${esc(l.n||'')}</td><td></td></tr>`).join('');
  }
  const lines=E?draftLines():r.lines;
  const n=E?editChanges():0;
  return `<tr class="xrow" data-x="${key}"><td colspan="${cols}"><div class="xp${E?' ed':''}" role="region" aria-label="Líneas de ${esc(title)}">${head}
    <div class="xtw"><table class="xt">${XCOLS}${XHEAD}<tbody>${rows}</tbody>${xFoot(lines,E?numES(E.rp)||0:(r.rp||0),E)}</table></div>
    ${E?`<div class="xpf">${btn('Añadir línea',{act:'x-add',icon:'plus'})}</div>
    <div class="xbar"><button type="button" class="btn sm pri" data-act="x-save" title="Guardar (Ctrl+G)">Guardar</button><button type="button" class="btn sm" data-act="x-discard">Descartar</button>
      <span class="xcnt">${n?`<i class="ddot"></i>${n} cambio${n>1?'s':''} sin guardar`:'Sin cambios'}</span>
      <span class="mut">${t==='p'?'Se aplicarán a las próximas emisiones; las facturas ya generadas no cambian.':'Ctrl+G guarda · Tab recorre los campos'}</span></div>`:''}
  </div></td></tr>`;
}
function updXLive(){
  const E=V.edit;if(!E)return;const x=$(`tr.xrow[data-x="${E.key}"]`);if(!x)return;
  E.lines.forEach((l,i)=>{const q=numES(l.q),p=numES(l.p),ok=!isNaN(q)&&!isNaN(p);
    const s=(a,v)=>{const c=$(`[${a}="${i}"]`,x);if(c)c.textContent=v;};
    s('data-in',ok?money(q*p):'—');s('data-pb',isNaN(p)?'—':money(bruto(p,+l.iva)));s('data-ib',ok?money(r2(q*p*(1+l.iva/100))):'—');});
  const v=xTotalsVals(draftLines(),numES(E.rp)||0);
  ['q','neto','bruto','liq'].forEach(k=>{const c=$(`[data-t="${k}"]`,x);if(c)c.textContent=v[k];});
  const rc=$('[data-t="ret"]',x);if(rc)rc.textContent=v.hasRet?v.ret:'—';
  $('tr.xliq',x).hidden=!v.hasRet;
  const n=editChanges();$('.xcnt',x).innerHTML=n?`<i class="ddot"></i>${n} cambio${n>1?'s':''} sin guardar`:'Sin cambios';
  const row=$(`tr[data-row="${E.key}"]`);row&&row.classList.toggle('dirty',n>0);
}

/* ════════════ Generación de programadas seleccionadas ════════════ */
function dueDates(p,hasta){
  if(p.estado!=='A')return [];const out=[];const n=PER[p.per].n;let d=nextDate(p);
  while(d&&d<=hasta&&(!p.fin||d<=p.fin)){out.push(d);d=addM(d,n);}return out;
}
function genDialog(ids,all){
  const progs=ids.map(progById);
  const nxs=progs.map(nextDate).filter(Boolean).sort((a,b)=>a-b);
  const table=h=>{let tot=0;const rows=progs.map(p=>{const ds=dueDates(p,h);tot+=ds.length;
      const why=p.estado==='P'?'Pausada: no se genera':p.estado==='F'?'Finalizada':!ds.length?`Nada hasta esa fecha${nextDate(p)?' (próxima '+fd(nextDate(p))+')':''}`:'';
      return `<tr><td><span class="mono">${progCode(p)}</span> ${esc(p.desc)}</td><td>${esc(cliById(p.cli).n)}</td><td>${ds.length?ds.map(fd).join(', '):`<span class="mut">${why}</span>`}</td><td class="r tn">${ds.length?money(calc(p.lines,p.rp).total*ds.length):''}</td></tr>`;}).join('');
    return {tot,html:`<table class="mini"><thead><tr><th>Programación</th><th>Cliente</th><th>Periodos a generar</th><th class="r">Total</th></tr></thead><tbody>${rows}</tbody></table>
      ${!tot?`<div class="note">${ic('info',14)}<span>No hay periodos pendientes hasta esa fecha.${nxs[0]?` <button type="button" class="lnk" id="gUse">Generar hasta ${fd(nxs[0])} (próxima emisión)</button>`:''}</span></div>`:''}`};};
  const upd=ov=>{const h=new Date($('#gHasta',ov).value+'T00:00');const t=table(h);$('#gTbl',ov).innerHTML=t.html;
    const b=$('.dlgf [data-m="0"]',ov);b.textContent=`Generar ${t.tot} borrador${t.tot===1?'':'es'}`;
    if(t.tot){b.removeAttribute('aria-disabled');b.title='';}else{b.setAttribute('aria-disabled','true');b.title='No hay periodos que generar hasta esa fecha.';}
    $('#gUse',ov)?.addEventListener('click',()=>{$('#gHasta',ov).value=iso(nxs[0]);upd(ov);});};
  modal({title:all?'Generar facturas programadas · todas':`Generar ${ids.length} programaci${ids.length>1?'ones':'ón'} seleccionada${ids.length>1?'s':''}`,sim:true,wide:true,
   body:`<div class="note">${ic('info',14)}<span>Ámbito: <b>${all?'todas las programaciones activas de Ribera Gestión':ids.length+' marcada'+(ids.length>1?'s':'')+' en el listado'}</b>. Las pausadas y finalizadas se omiten.</span></div>
    <div class="frow"><div class="fld"><label for="gHasta">Generar los periodos con fecha hasta</label><input id="gHasta" type="date" class="in" style="width:140px" value="${iso(TODAY)}"></div></div>
    <div id="gTbl"></div>
    <div class="proplist"><div><span><span class="prop">Propuesta</span> Se crean como <b>borradores</b> con la fecha de cada periodo, para revisarlos y emitirlos después (individualmente o en lote).</span></div></div>`,
   actions:[{t:'Generar',cls:'pri',fn:ov=>{
     const h=new Date($('#gHasta',ov).value+'T00:00');let made=[];
     progs.forEach(p=>{dueDates(p,h).forEach(d=>{const dn=Math.max(0,...INV.map(x=>x.draftNo||0))+1;
       const v=mkInv({fecha:d,cli:p.cli,prog:p.id,serie:null,est:'BOR',vf:'NA',draftNo:dn,rp:p.rp,notas:p.notas,fp:p.fp,mailP:p.mail,lines:p.lines.map((l,k)=>({...l,c:k===0?l.c+' · '+perLabel(p,d):l.c}))});
       Object.assign(v,calc(v.lines,v.rp));INV.push(v);made.push(v);p.lastGen=d;});});
     V.psel.clear();
     if(progs.length===1)V.progSel=progs[0].id;
     refresh();syncControls();
     toast(`Generados ${made.length} borradores (${made.map(v=>'B-'+pad(v.draftNo,4)).join(', ')}). Revisa y emite desde las emitidas.`);}}],
   onOpen:ov=>{$('#gHasta',ov).addEventListener('change',()=>upd(ov));upd(ov);}});
}

/* ════════════ Avisos, diálogos y menú ════════════ */
function toast(msg,kind='sim'){
  const t=document.createElement('div');t.className='toast'+(kind==='info'?' info':'');
  t.innerHTML=(kind==='sim'?'<span class="simtag">Simulado</span>':kind==='info'?ic('info',14):ic('check',14))+`<span>${msg}</span>`;
  $('#toasts').appendChild(t);setTimeout(()=>t.remove(),kind==='info'?4200:5200);
}
let modalReturn=null;
function modal({title,body,actions=[],sim=false,wide=false,onOpen,cancel='Cancelar'}){
  closeModal(true);modalReturn=document.activeElement;
  const ov=document.createElement('div');ov.className='ov';ov.id='ov';
  ov.innerHTML=`<div class="dlg${wide?' wide':''}" role="dialog" aria-modal="true" aria-labelledby="dlgT"><div class="dlgh"><h3 id="dlgT">${title}</h3>${sim?'<span class="simtag">Operación simulada</span>':''}<span class="grow"></span><button type="button" class="icb" data-m="x" aria-label="Cerrar (Esc)">${ic('x',16)}</button></div>
   <div class="dlgb">${body}</div><div class="dlgf">${actions.map((a,i)=>`<button type="button" class="btn ${a.cls||''}" data-m="${i}" ${a.why?`aria-disabled="true" title="${esc(a.why)}"`:''}>${a.t}</button>`).join('')}<span class="grow"></span><button type="button" class="btn" data-m="x">${cancel}</button></div></div>`;
  $('#win').appendChild(ov);
  ov.addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(!b)return;if(b.getAttribute('aria-disabled')==='true'){toast(b.title,'info');return;}
    if(b.dataset.m==='x'){closeModal();return;}const a=actions[+b.dataset.m];if(a.fn&&a.fn(ov)===false)return;closeModal();});
  ov.addEventListener('keydown',e=>{if(e.key==='Tab'){const f=$$('button,input,select,textarea',ov).filter(x=>!x.disabled);const i=f.indexOf(document.activeElement);
    if(e.shiftKey&&i<=0){e.preventDefault();f[f.length-1].focus();}else if(!e.shiftKey&&i===f.length-1){e.preventDefault();f[0].focus();}}});
  if(onOpen)onOpen(ov);
  (ov.querySelector('input,textarea,select')||ov.querySelector('.dlgf .btn'))?.focus();
}
function closeModal(silent){const o=$('#ov');if(o){o.remove();if(!silent&&modalReturn&&document.contains(modalReturn))modalReturn.focus();}}
function closeMenu(){const m=$('#ctxmenu');if(m){m.remove();return true;}return false;}
function openMenu(v,x,y,returnTo){
  closeMenu();const m=document.createElement('div');m.className='menu';m.id='ctxmenu';m.setAttribute('role','menu');m.setAttribute('aria-label','Acciones de '+invNum(v));
  const items=[['Consultar detalle','eye','m-open'],...invActs(v)];
  m.innerHTML=items.map(([t,i,a,why])=>`<button type="button" role="menuitem" data-act="${a}" data-mid="${v.id}" ${why?`aria-disabled="true" data-why="${esc(why)}" title="${esc(why)}"`:''}>${ic(i,14)}${t.replace('…','…')}</button>`).join('')+
   `<hr><button type="button" role="menuitem" data-act="m-sel" data-mid="${v.id}">${ic('check',14)}${V.selected.has(v.id)?'Quitar de la selección':'Añadir a la selección'}</button>`;
  const w=$('#win'),r=w.getBoundingClientRect();w.appendChild(m);
  const mw=m.offsetWidth,mh=m.offsetHeight;m.style.left=Math.min(x-r.left,r.width-mw-8)+'px';m.style.top=Math.min(y-r.top,r.height-mh-8)+'px';
  m._ret=returnTo;m.querySelector('button').focus();
}

function goProg(pid){
  const p=progById(pid);if(!p)return;

  if(xp){if(e.key==='Escape'){e.preventDefault();focusRow(xp.dataset.x);}return;}
  const menu=e.target.closest('#ctxmenu');
  if(menu){const b=$$('button',menu);const i=b.indexOf(document.activeElement);if(e.key==='ArrowDown'){e.preventDefault();b[(i+1)%b.length].focus();}if(e.key==='ArrowUp'){e.preventDefault();b[(i-1+b.length)%b.length].focus();}return;}
  if(e.altKey&&(e.key==='p'||e.key==='P')&&$('#pProg')){e.preventDefault();V.progCollapsed=!V.progCollapsed;syncControls();renderProg();return;}
  if(e.ctrlKey&&(e.key==='f'||e.key==='F')&&$('#q')){e.preventDefault();$('#q').focus();$('#q').select();return;}
  const row=e.target.closest&&e.target.closest('tr[data-row]');
  if(!row)return;
  const [t,id]=row.dataset.row.split(':');const rows=$$('tr[data-row]',row.closest('tbody'));const i=rows.indexOf(row);
  let j=null;
  if(e.key==='ArrowDown')j=Math.min(i+1,rows.length-1);else if(e.key==='ArrowUp')j=Math.max(i-1,0);
  else if(e.key==='Home')j=0;else if(e.key==='End')j=rows.length-1;else if(e.key==='PageDown')j=Math.min(i+10,rows.length-1);else if(e.key==='PageUp')j=Math.max(i-10,0);
  if(j!==null){e.preventDefault();const k=rows[j].dataset.row;const [t2,id2]=k.split(':');
    if(t2==='e')V.curE=+id2;else V.curP=+id2;
    if(V.detailOpen&&V.active&&V.active.t===t2){V.active={t:t2,id:+id2};renderDetail();}
    rows.forEach(r=>{r.classList.toggle('act',V.detailOpen&&V.active&&r.dataset.row===V.active.t+':'+V.active.id);});
    focusRow(k);
    if(t2==='p')renderProgActsOnly();
    return;}
  if(e.key==='Enter'){e.preventDefault();setActive(t,+id,true);focusRow(row.dataset.row);return;}
  if(e.key==='ArrowRight'||e.key==='+'){e.preventDefault();toggleExp(row.dataset.row,true);return;}
  if(e.key==='ArrowLeft'||e.key==='-'){e.preventDefault();toggleExp(row.dataset.row,false);return;}
  if(t==='p'&&(e.key==='f'||e.key==='F')&&!e.ctrlKey){e.preventDefault();toggleProgFilter(+id);focusRow(row.dataset.row);return;}
  if(e.key===' '){e.preventDefault();if(t==='p'){V.psel.has(+id)?V.psel.delete(+id):V.psel.add(+id);V.curP=+id;renderProg();focusRow(row.dataset.row);}
    else{V.selected.has(+id)?V.selected.delete(+id):(V.selected.add(+id),V.scope='sel');V.curE=+id;renderEmit();focusRow(row.dataset.row);}return;}
  if(t==='e'&&e.ctrlKey&&(e.key==='a'||e.key==='A')){e.preventDefault();emitList().forEach(v=>V.selected.add(v.id));V.scope='sel';renderEmit();focusRow(row.dataset.row);return;}
  if(t==='e'&&(e.key==='ContextMenu'||(e.shiftKey&&e.key==='F10'))){e.preventDefault();const r=row.getBoundingClientRect();openMenu(invById(+id),r.left+160,r.bottom,row);}
});
function renderProgActsOnly(){const k=$('tr[data-row][tabindex="0"]',$('#progTW'));renderProg();if(k)focusRow(k.dataset.row);}
new ResizeObserver(()=>fitWidth()).observe($('#win'));
window.addEventListener('resize',fitWidth);

  if(q.get('contexto')==='terceros')S.ctx='tercero';
  if(q.get('datos'))S.data=q.get('datos');
  renderDemo();renderShell();})();

</script>
