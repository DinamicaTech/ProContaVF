<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seguimiento de lotes de correo · ProConta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#14213A; --navy2:#1E2E4D; --navy3:#2B3D60; --orange:#F4A259; --orange-d:#C8562A; --orange-bg:#FFF3E6;
  --bg:#F1EEE7; --card:#FFFFFF; --soft:#FBFAF7; --line:#E6E1D5; --line2:#ECE8DE; --hover:#F6F3EC;
  --text:#16213A; --muted:#646A78; --muted2:#7A8090;
  --blue:#1D5C8C; --blue-bg:#E3ECF6; --green:#1E6B45; --green-bg:#E2F0E8;
  --red:#B42318; --red-bg:#FCEBE9; --amber:#9A4A12; --amber-bg:#FFF1E2;
  --violet:#5B3F86; --violet-bg:#ECE6F3; --pend:#4A5163; --pend-bg:#EEF0F4; --grey:#6E7482; --grey-bg:#EFEDE8;
  --sel:#FFF6EC; --active:#E3ECF6;
  --row:26px; --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  --focus:0 0 0 2px #fff,0 0 0 4px var(--orange-d);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:13px/1.4 'IBM Plex Sans','Segoe UI',system-ui,sans-serif;color:var(--text);background:#DCD7CC;display:flex;flex-direction:column;overflow:hidden}
button,input,select{font:inherit;color:inherit}
:focus{outline:none}
:focus-visible{box-shadow:var(--focus);border-radius:3px}
.mono{font-family:var(--mono);font-size:12px}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- barra de controles de la maqueta ---------- */
#demo{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:6px 14px;background:repeating-linear-gradient(135deg,#2a2f3a 0 10px,#2f3541 10px 20px);color:#E8E6E1;font-size:12px;border-bottom:2px dashed var(--orange)}
#demo .tag{background:var(--orange);color:var(--navy);font-weight:600;padding:1px 7px;border-radius:3px;letter-spacing:.02em}
#demo label{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
#demo select,#demo button{background:#3B4252;border:1px solid #586074;border-radius:3px;color:#fff;padding:2px 8px;height:24px;cursor:pointer}
#demo button:hover{background:#4A5266}
#demo button[aria-pressed=true]{background:var(--orange);color:var(--navy);border-color:var(--orange)}
#demo .grp{display:inline-flex;align-items:center;gap:6px}
#demo .sep{width:1px;height:18px;background:#586074}
#demo input[type=checkbox]{accent-color:var(--orange)}

/* ---------- marco (simula el área de trabajo del contenedor) ---------- */
#frame{flex:1;min-height:0;display:flex;justify-content:center;padding:10px;overflow:hidden}
#app{flex:1;min-width:0;max-width:none;display:flex;flex-direction:column;background:var(--bg);border-radius:6px;overflow:hidden;box-shadow:0 1px 3px rgba(20,33,58,.25)}
#frame.w1280 #app{max-width:1280px} #frame.w1440 #app{max-width:1440px} #frame.w1024 #app{max-width:1024px}
.ctx{flex:none;height:22px;display:flex;align-items:center;gap:8px;padding:0 12px;font-size:11px;color:var(--muted);background:#E9E5DB;border-bottom:1px solid var(--line)}
.ctx b{color:var(--text);font-weight:500}

/* ---------- cabecera del lote ---------- */
#hdr{flex:none;background:var(--navy);color:#fff;padding:8px 14px 9px;display:flex;gap:16px;align-items:flex-start}
#hdr .ttl{min-width:0;flex:1}
#hdr h1{margin:0;font:600 17px/1.25 'Bricolage Grotesque','IBM Plex Sans',sans-serif;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#hdr .meta{display:flex;flex-wrap:wrap;gap:2px 16px;margin-top:3px;font-size:12px;color:#C3CADA}
#hdr .meta b{color:#fff;font-weight:500}
#hdr .keep{margin-top:4px;font-size:11.5px;color:#AEB8CC;display:flex;align-items:center;gap:6px}
.lotstate{font:600 11.5px/1 'IBM Plex Sans','Segoe UI',system-ui,sans-serif;padding:4px 8px;border-radius:10px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.lotstate.run{background:#2B4C74;color:#DCEBFA}
.lotstate.done{background:#2E4A3C;color:#DDF1E5}
.lotstate.warn{background:#5A3A1C;color:#FFE3C4}
.lotstate.prep{background:#3A4152;color:#E2E5EC}
.lotstate.pause{background:#4B3D63;color:#ECE3FA}
#hdr .hact{display:flex;gap:6px;align-items:center;flex:none;padding-top:2px}
.hbtn{height:28px;padding:0 10px;border-radius:4px;border:1px solid #3D5079;background:var(--navy2);color:#fff;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.hbtn:hover:not(:disabled){background:var(--navy3)}
.hbtn:disabled{opacity:.5;cursor:default}
.hbtn.proposal{border-style:dashed;border-color:#8A97B5}
.ptag{font-size:10px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;background:#3B4A6C;color:#D7DEEE;padding:1px 5px;border-radius:3px}

/* menú */
.menu{position:absolute;z-index:40;background:#fff;color:var(--text);border:1px solid var(--line);border-radius:5px;box-shadow:0 6px 24px rgba(20,33,58,.22);padding:4px;min-width:340px}
.menu .mh{font-size:11px;color:var(--muted);padding:6px 10px 4px;text-transform:uppercase;letter-spacing:.04em}
.menu button{display:flex;width:100%;text-align:left;align-items:flex-start;gap:8px;padding:6px 10px;border:0;background:none;border-radius:3px;cursor:pointer}
.menu button:hover:not(:disabled),.menu button:focus-visible{background:var(--hover)}
.menu button:disabled{color:var(--muted2);cursor:default}
.menu button small{display:block;color:var(--muted);font-size:11.5px}
.menu hr{border:0;border-top:1px solid var(--line2);margin:4px 0}
.menu .cnt{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--muted)}

/* ---------- resumen ---------- */
#sum{flex:none;background:var(--card);border-bottom:1px solid var(--line);padding:8px 14px 8px;display:flex;flex-direction:column;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px 0 7px;border:1px solid var(--line);border-radius:13px;background:var(--soft);cursor:pointer;white-space:nowrap}
.chip:hover{border-color:#CFC8B8}
.chip .n{font-family:var(--mono);font-weight:500;font-size:12.5px}
.chip[aria-pressed=true]{border-color:var(--navy);background:#fff;box-shadow:inset 0 0 0 1px var(--navy)}
.chip.total{cursor:default;background:#fff}
.chip .sw{width:10px;height:10px;border-radius:2px;flex:none}
.chip[disabled]{opacity:.55;cursor:default}
.progress{display:flex;align-items:center;gap:12px}
.bar{flex:1;min-width:160px;max-width:720px;height:10px;border-radius:5px;background:var(--line2);display:flex;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.04)}
.bar span{height:100%;transition:width .4s}
.pcap{font-size:12px;color:var(--muted)}
.pcap b{color:var(--text);font-weight:600}
.pcap .warn{color:var(--amber);font-weight:600}
.dsn{font-size:12px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.dsn .chip{height:22px}

/* colores de estado */
.s-pendiente{--c:var(--pend);--cb:var(--pend-bg)}
.s-proceso{--c:var(--violet);--cb:var(--violet-bg)}
.s-aceptado{--c:var(--blue);--cb:var(--blue-bg)}
.s-fallido{--c:var(--red);--cb:var(--red-bg)}
.s-incierto{--c:var(--amber);--cb:var(--amber-bg)}
.s-cancelado{--c:var(--grey);--cb:var(--grey-bg)}
.s-entregado{--c:var(--green);--cb:var(--green-bg)}
.s-rebotado{--c:var(--red);--cb:var(--red-bg)}
.sw.fill{background:var(--c)}
.seg-proceso{background:repeating-linear-gradient(45deg,#7D64A6 0 4px,#9C86C2 4px 8px)}
.seg-incierto{background:repeating-linear-gradient(45deg,#B8661F 0 3px,#E0A060 3px 6px)}
.ico{width:14px;height:14px;flex:none;display:inline-block;vertical-align:-2px}

/* ---------- barra de herramientas de la tabla ---------- */
#tools{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:7px 14px;background:var(--card);border-bottom:1px solid var(--line)}
.search{position:relative;display:inline-flex;align-items:center}
.search input{width:300px;height:28px;border:1px solid #CFC8B8;border-radius:4px;padding:0 26px 0 28px;background:#fff}
.search svg{position:absolute;left:8px;color:var(--muted)}
.search .x{position:absolute;right:3px;border:0;background:none;width:22px;height:22px;cursor:pointer;color:var(--muted);border-radius:3px}
.btn{height:28px;padding:0 10px;border:1px solid #CFC8B8;border-radius:4px;background:#fff;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--hover)}
.btn:disabled{color:#A3A7B0;cursor:default;background:#FAF9F6}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover:not(:disabled){background:var(--navy3)}
.btn.primary:disabled{background:#8D96A8;border-color:#8D96A8;color:#EEF0F4}
.btn.warnb{border-color:#E4B48A;background:var(--orange-bg)}
.btn.danger{border-color:#E3B3AE}
.btn .k{font-family:var(--mono);font-size:11px;background:var(--line2);padding:0 5px;border-radius:3px;color:var(--text)}
.btn:disabled .k{color:#A3A7B0}
.counts{font-size:12px;color:var(--muted);white-space:nowrap}
.counts b{color:var(--text);font-weight:600}
.spacer{flex:1}
.selbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.scope{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;margin-right:2px}
.vsep{width:1px;height:20px;background:var(--line)}

/* avisos en línea */
.notice{flex:none;display:flex;align-items:center;gap:10px;padding:5px 14px;font-size:12.5px;border-bottom:1px solid var(--line)}
.notice.info{background:#EEF4FA;color:#1A3F60}
.notice.sel{background:var(--sel);color:#6B3510}
.notice button.link{border:0;background:none;color:var(--blue);text-decoration:underline;cursor:pointer;padding:0 2px;font-weight:500}
.notice.sel button.link{color:#8A4410}

/* ---------- área principal ---------- */
#main{flex:1;min-height:0;display:flex;position:relative}
#tablewrap{flex:1;min-width:0;overflow:auto;background:var(--card);position:relative}
#tablewrap:focus-visible{box-shadow:inset 0 0 0 2px var(--orange-d);border-radius:0}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:1420px;table-layout:fixed}
thead th{position:sticky;top:0;z-index:2;background:#F4F1EA;border-bottom:1px solid #D9D3C5;height:30px;font-weight:600;font-size:12px;text-align:left;padding:0 8px;white-space:nowrap;color:#3A4152}
thead th button.sort{border:0;background:none;font-weight:600;cursor:pointer;padding:3px 2px;display:inline-flex;align-items:center;gap:3px;color:inherit}
thead th button.sort:hover{color:var(--blue)}
thead th .ar{font-size:10px;color:var(--orange-d);width:8px}
tbody td{height:var(--row);padding:0 8px;border-bottom:1px solid var(--line2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
tbody tr{cursor:default;user-select:none}
tbody tr:hover td{background:var(--hover)}
tbody tr.sel td{background:var(--sel)}
tbody tr.active td{background:var(--active)}
tbody tr.active td:first-child{box-shadow:inset 3px 0 0 var(--blue)}
tbody tr.active.sel td{background:#E9E6EC}
#tablewrap:focus tr.active td{box-shadow:inset 0 1px 0 var(--blue),inset 0 -1px 0 var(--blue)}
#tablewrap:focus tr.active td:first-child{box-shadow:inset 3px 0 0 var(--blue),inset 0 1px 0 var(--blue),inset 0 -1px 0 var(--blue)}
tbody tr.stale td{color:#9196A2}
tbody tr.stale td.c-res::after{content:'· ya no coincide con el filtro';margin-left:6px;font-size:11px;color:var(--amber)}
tbody tr.flash td{animation:flash 1.2s ease-out}
@keyframes flash{0%{background:#FFE7C7}100%{}}
td.c-chk,th.c-chk{width:34px;padding:0 0 0 10px;text-align:left}
input[type=checkbox]{width:14px;height:14px;accent-color:var(--navy);margin:0;vertical-align:-2px;cursor:pointer}
th.c-n{width:50px} th.c-est{width:198px} th.c-dest{width:232px} th.c-asu{width:auto} th.c-org{width:132px}
th.c-adj{width:46px} th.c-int{width:48px} th.c-ult{width:118px} th.c-res{width:290px}
td.c-n{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
td.c-adj,td.c-int,th.c-adj,th.c-int{text-align:right}
td.c-adj,td.c-int{font-family:var(--mono);font-size:12px}
td.c-ult{font-family:var(--mono);font-size:11.5px}
.st{display:inline-flex;align-items:center;gap:5px;padding:1px 7px 1px 5px;border-radius:3px;background:var(--cb);color:var(--c);font-weight:500;font-size:12px;line-height:18px;max-width:100%}
.st .ico{width:13px;height:13px}
.op{font-size:11px;color:var(--violet);margin-left:4px}
.dest{display:flex;align-items:center;gap:5px;min-width:0}
.dest .em{overflow:hidden;text-overflow:ellipsis}
.more{flex:none;font-size:11px;font-family:var(--mono);background:var(--line2);border:1px solid var(--line);border-radius:8px;padding:0 5px;line-height:15px;cursor:help}
.org{color:var(--blue)}
.res-err{color:var(--red)} .res-unc{color:var(--amber)}
.res-dsn{margin-left:6px}
.spin{animation:spin 1.6s linear infinite;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{padding:48px 24px;text-align:center;color:var(--muted)}
.empty h3{color:var(--text);font:600 15px 'Bricolage Grotesque',sans-serif;margin:8px 0 4px}

/* ---------- detalle ---------- */
#detail{flex:none;width:450px;border-left:1px solid var(--line);background:var(--soft);display:flex;flex-direction:column;min-height:0}
#detail[hidden]{display:none}
.dhead{flex:none;padding:8px 12px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.dhead h2{margin:0;font:600 14px 'Bricolage Grotesque',sans-serif;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{width:28px;height:28px;border:1px solid transparent;border-radius:4px;background:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.ibtn:hover:not(:disabled){background:var(--hover);border-color:var(--line)}
.ibtn:disabled{opacity:.35;cursor:default}
.dbody{flex:1;overflow:auto;padding:10px 12px 18px}
.dsec{background:#fff;border:1px solid var(--line);border-radius:5px;margin-bottom:10px}
.dsec>h3{margin:0;padding:7px 10px;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:8px}
.dsec>h3 .r{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:400}
.dsec .in{padding:8px 10px}
dl.kv{display:grid;grid-template-columns:92px 1fr;gap:4px 10px;margin:0}
dl.kv dt{color:var(--muted)} dl.kv dd{margin:0;min-width:0;word-break:break-word}
.addr{display:inline-block;background:var(--soft);border:1px solid var(--line2);border-radius:3px;padding:0 5px;margin:0 3px 3px 0;font-size:12px}
.body{white-space:pre-wrap;background:var(--soft);border:1px solid var(--line2);border-radius:4px;padding:8px 10px;font-size:12.5px;max-height:220px;overflow:auto}
.histnote{font-size:11.5px;color:var(--muted);margin-top:6px;display:flex;gap:6px}
.callout{border-radius:5px;padding:9px 11px;margin-bottom:10px;border:1px solid}
.callout.err{background:var(--red-bg);border-color:#EDC2BD}
.callout.unc{background:var(--amber-bg);border-color:#EBC9A5}
.callout.ok{background:var(--blue-bg);border-color:#BFD2E6}
.callout.neu{background:#fff;border-color:var(--line)}
.callout h4{margin:0 0 3px;font-size:13px;display:flex;align-items:center;gap:6px}
.callout p{margin:3px 0}
.callout .what{font-size:12.5px}
details.tech{margin-top:6px}
details.tech summary{cursor:pointer;font-size:12px;color:var(--blue)}
details.tech pre{font-family:var(--mono);font-size:11px;background:#1B2335;color:#DDE3EE;border-radius:4px;padding:8px;white-space:pre-wrap;word-break:break-all;margin:6px 0 4px;max-height:200px;overflow:auto}
.dacts{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
.att{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line2)}
.att:last-child{border-bottom:0}
.att .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att .sz{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.att.na .nm{color:var(--red);text-decoration:line-through}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:118px 1fr;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line2);font-size:12.5px}
.tl li:last-child{border-bottom:0}
.tl .t{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.tl .att-n{font-weight:600}
.tl .sub{color:var(--muted);font-size:11.5px}
.link{color:var(--blue);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}

/* ---------- diálogos ---------- */
.backdrop{position:fixed;inset:0;background:rgba(20,33,58,.38);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
.dlg{background:#fff;border-radius:6px;box-shadow:0 12px 40px rgba(0,0,0,.3);width:560px;max-width:100%;max-height:calc(100vh - 32px);display:flex;flex-direction:column}
.dlg.wide{width:760px}
.dlg header{padding:12px 16px 8px;border-bottom:1px solid var(--line2)}
.dlg header h2{margin:0;font:600 16px 'Bricolage Grotesque',sans-serif}
.dlg header p{margin:3px 0 0;color:var(--muted);font-size:12.5px}
.dlg .content{padding:12px 16px;overflow:auto}
.dlg footer{padding:10px 16px;border-top:1px solid var(--line2);display:flex;gap:8px;align-items:center}
.dlg footer .note{font-size:11.5px;color:var(--muted);margin-left:auto;text-align:right}
.box{border:1px solid var(--line);border-radius:5px;padding:8px 10px;margin-bottom:8px}
.box.ok{border-color:#BFD2E6;background:#F5F9FD}
.box.ex{background:var(--soft)}
.box.wn{border-color:#EBC9A5;background:var(--amber-bg)}
.box h4{margin:0 0 4px;font-size:13px;display:flex;align-items:center;gap:6px}
.box h4 .n{font-family:var(--mono)}
.box ul{margin:2px 0 0;padding-left:18px}
.box li{margin:2px 0}
.ids{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.ack{display:flex;gap:8px;align-items:flex-start;margin-top:8px;padding:8px;border-radius:4px;background:#FFF8EF;border:1px solid #F0D5B5}
.preview{background:#E7E3DA;padding:16px;display:flex;justify-content:center}
.page{background:#fff;width:420px;min-height:520px;box-shadow:0 2px 8px rgba(0,0,0,.18);padding:28px 30px;font-size:11px}
.page h5{font:600 16px 'Bricolage Grotesque',sans-serif;margin:0 0 2px;color:var(--navy)}
.page table{min-width:0;width:100%;margin-top:14px;table-layout:auto}
.page td,.page th{border-bottom:1px solid #eee;padding:4px;font-size:11px;position:static;background:none;height:auto}
.wm{color:#aaa;font-size:10px;text-transform:uppercase;letter-spacing:.1em;text-align:center;margin-top:30px}

/* ---------- tooltips y toasts ---------- */
#tip{position:fixed;z-index:90;max-width:360px;background:#1B2335;color:#F0F2F6;font-size:12px;line-height:1.4;padding:6px 9px;border-radius:4px;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.25);white-space:pre-line}
#tip[hidden]{display:none}
#toasts{position:fixed;right:16px;bottom:16px;z-index:80;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.toast{background:var(--navy);color:#fff;padding:8px 12px;border-radius:5px;box-shadow:0 4px 14px rgba(0,0,0,.25);font-size:12.5px;max-width:420px;border-left:4px solid var(--orange)}

/* ---------- tamaños ---------- */
@media (max-width:1250px){
  #detail{position:absolute;right:0;top:0;bottom:0;z-index:20;box-shadow:-6px 0 20px rgba(20,33,58,.18)}
  .search input{width:240px}
}
#frame.w1024 #detail,#frame.w1280 #detail{position:absolute;right:0;top:0;bottom:0;z-index:20;box-shadow:-6px 0 20px rgba(20,33,58,.18)}
@media (max-width:760px){
  #detail{width:100%}
  #hdr{flex-direction:column;gap:6px}

/* =========================================================
   Cálculos
   ========================================================= */
function counts(){
  const c = {total:S.msgs.length}; ORDER.forEach(e=>c[e]=0);
  S.msgs.forEach(m=>c[m.estado]++);
  c.entregado = S.msgs.filter(m=>m.entrega?.e==='entregado').length;
  c.rebotado = S.msgs.filter(m=>m.entrega?.e==='rebotado').length;
  c.sinaviso = S.msgs.filter(m=>m.estado==='aceptado' && !m.entrega).length;
  return c;
}
function lotStatus(c){
  if (S.lot.estado==='prep') return {cls:'prep', t:'En preparación', tip:'El módulo de origen todavía está generando los mensajes.'};
  const open = c.pendiente + c.proceso;
  if (open>0 && S.paused) return {cls:'pause', t: c.proceso? 'Pausando…':'Pausado', tip:'Propuesta: el motor no toma mensajes nuevos. Los que estaban en proceso terminan.'};
  if (open>0) return {cls:'run', t:'En curso', tip:'El motor está procesando el lote.'};
  if (c.fallido + c.incierto>0) return {cls:'warn', t:'Finalizado con incidencias', tip:'No quedan mensajes por procesar, pero hay fallidos o inciertos que revisar.'};
  return {cls:'done', t:'Finalizado', tip:'Todos los mensajes tienen resultado. «Aceptado» no garantiza la entrega.'};
}
function hay(m){
  return [m.n, m.asunto, m.origen.ref, m.origen.tipo, ...m.para.flatMap(p=>[p.nombre,p.email]), ...m.cc.flatMap(p=>[p.nombre,p.email]), ...m.cco.flatMap(p=>[p.nombre,p.email])].join(' ').toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g,'');
}
function matches(m){
  if (S.estados.size && !S.estados.has(m.estado)) return false;
  if (S.q){ const h = hay(m); const toks = S.q.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').split(/\s+/).filter(Boolean); if (!toks.every(t=>h.includes(t))) return false; }
  return true;
}
const lastT = m => m.intentos.length ? m.intentos[m.intentos.length-1].fin : (m.cur||null);
const SORTERS = {
  n:m=>m.n, estado:m=>ORDER.indexOf(m.estado), dest:m=>m.para[0].email, asunto:m=>m.asunto.toLowerCase(), org:m=>m.origen.ref,
  adj:m=>m.adjuntos.length, int:m=>m.intentos.length, ult:m=>lastT(m)?.getTime()||0, res:m=>m.resumen.toLowerCase()
};
const MUTABLE = new Set(['estado','int','ult','res']);
function computeIds(){
  const f = SORTERS[S.sort.key], d = S.sort.dir;
  S.ids = S.msgs.filter(matches).sort((a,b)=>{ const x=f(a), y=f(b); return (x<y?-1:x>y?1:0)*d || a.n-b.n; }).map(m=>m.id);
  S.stale.clear(); S.newMatch.clear(); S.orderDirty=false;
}

function scopeOf(kind, ids){
  const ok=[], ex={}, warn=[];
  const add=(r,m)=>{ (ex[r]=ex[r]||[]).push(m); };
  ids.map(id=>S.byId.get(id)).forEach(m=>{
    if (m.op){ add('Tiene una operación en curso', m); return; }
    if (kind==='retry'){
      if (m.estado==='fallido'){ ok.push(m); if (ERR[m.err].cls==='permanente' || (ERR[m.err].cls==='correccion' && !S.caps.fixed)) warn.push(m); }
      else add({aceptado:'Ya aceptado por el servicio: no se reintenta. Use «Reenviar» si necesita otro envío.', incierto:'Resultado incierto: compruebe primero su estado para no duplicarlo.', pendiente:'Aún no se ha intentado enviar.', proceso:'Se está enviando ahora.', cancelado:'Cancelado antes del envío.'}[m.estado], m);
    } else if (kind==='cancel'){
      if (m.estado==='pendiente') ok.push(m);
      else add({proceso:'Ya se está enviando: no puede cancelarse.', aceptado:'Ya enviado (aceptado por el servicio).', fallido:'Ya intentado: no está pendiente.', incierto:'Ya intentado: no está pendiente.', cancelado:'Ya estaba cancelado.'}[m.estado], m);
    } else if (kind==='check'){
      if (m.estado==='incierto') ok.push(m); else add('Solo se comprueban mensajes con resultado incierto.', m);
    } else if (kind==='resend'){
      if (m.estado==='aceptado') ok.push(m); else add({fallido:'Fallido: use «Reintentar».', incierto:'Incierto: compruebe primero su estado.', pendiente:'Aún no enviado.', proceso:'Se está enviando ahora.', cancelado:'Cancelado: no se envió.'}[m.estado], m);
    }
  });
  return {ok, ex, warn};
}

    <td class="c-adj" ${m.adjuntos.some(a=>!a.disponible)?'style="color:var(--red)" data-tip="Algún adjunto no está disponible"':''}>${m.adjuntos.length}</td>

}
function rowClass(m){ return [S.sel.has(m.id)?'sel':'', S.active===m.id?'active':'', S.stale.has(m.id)?'stale':''].join(' '); }
function renderBody(){
  const tb = $('#tbody');
  tb.innerHTML = S.ids.map(id=>{ const m=S.byId.get(id); return `<tr data-id="${id}" class="${rowClass(m)}" aria-selected="${S.sel.has(id)}">${rowInner(m)}</tr>`; }).join('');
  const ev = $('#emptyv');
  if (S.lot.estado==='prep') ev.innerHTML = `<div class="empty">${ICONS.pendiente.replace('class="ico"','style="width:32px;height:32px;color:#A3A7B0" class="ico"')}<h3>El lote está en preparación</h3><p>Terceros está generando los recordatorios. Los mensajes aparecerán aquí cuando el motor los registre;<br>hasta entonces no hay acciones disponibles. Puede cerrar esta vista sin afectar a la preparación.</p></div>`;
  else if (!S.msgs.length) ev.innerHTML = `<div class="empty"><h3>Lote vacío</h3><p>Este lote no contiene mensajes.</p></div>`;
  else if (!S.ids.length) ev.innerHTML = `<div class="empty"><h3>Ningún mensaje coincide</h3><p>Hay ${S.msgs.length} mensajes en el lote, pero ninguno con esta búsqueda y estos filtros.</p><button class="btn" onclick="clearFilters()">Limpiar filtros</button></div>`;
  else ev.innerHTML = '';
}
function updateRow(id, flash){
  const tr = document.querySelector(`#tbody tr[data-id="${id}"]`); if (!tr) return;
  const m = S.byId.get(id);
  tr.innerHTML = rowInner(m); tr.className = rowClass(m) + (flash?' flash':''); tr.setAttribute('aria-selected', S.sel.has(id));
}
function refreshSelection(){
  document.querySelectorAll('#tbody tr').forEach(tr=>{ const id=tr.dataset.id, m=S.byId.get(id); tr.className=rowClass(m); tr.setAttribute('aria-selected',S.sel.has(id)); tr.querySelector('input').checked=S.sel.has(id); });
  renderHead(); renderTools(); renderNotices();
}
function renderAll(resetScroll){
  computeIds();
  renderHeader(); renderSummary(); renderTools(); renderNotices(); renderHead(); renderBody();
  if (resetScroll) $('#tablewrap').scrollTop = 0;
  renderDetail();
}
function viewChanged(keepScroll){
  const wrap=$('#tablewrap'), st=wrap.scrollTop;
  computeIds();
  if (S.active && !S.ids.includes(S.active)) S.active = S.ids[0] || null;
  S.allVisibleBanner = false;
  renderSummary(); renderTools(); renderNotices(); renderHead(); renderBody();
  wrap.scrollTop = keepScroll ? st : 0;

}
function clearFilters(){ S.q=''; $('#q').value=''; S.estados.clear(); viewChanged(); }

/* Tras un cambio de datos: actualiza en sitio sin mover filas */
function dataChanged(changedIds, flash=true){
  changedIds.forEach(id=>{
    const m = S.byId.get(id);
    const vis = S.ids.includes(id);
    if (vis){ if (!matches(m)) S.stale.add(id); else S.stale.delete(id); updateRow(id, flash); }
    else if (matches(m)) S.newMatch.add(id); else S.newMatch.delete(id);
  });
  if (MUTABLE.has(S.sort.key) && changedIds.length) S.orderDirty = true;
  // las posiciones en cola cambian: refresca la columna de resultado de los pendientes visibles
  document.querySelectorAll('#tbody tr').forEach(tr=>{ const m=S.byId.get(tr.dataset.id); if (m.estado==='pendiente' && !changedIds.includes(m.id)) { tr.lastElementChild.outerHTML = resCell(m); } });
  const fk = focusKey();
  renderHeader(); renderSummary(); renderTools(); renderNotices();
  if (S.detail && changedIds.includes(S.active)) renderDetail();
  restoreFocus(fk);
}
function focusKey(){ const a=document.activeElement; if(!a||a===document.body) return null; if(a.id) return '#'+a.id; if(a.dataset.est) return `[data-est="${a.dataset.est}"]`; if(a.dataset.act) return `[data-act="${a.dataset.act}"]`; return null; }
function restoreFocus(k){ if(!k || (document.activeElement && document.activeElement!==document.body)) return; const e=document.querySelector(k); if(e && !e.disabled) e.focus({preventScroll:true}); }

/* =========================================================
   Detalle

      <details class="tech"><summary>Detalle técnico</summary><pre id="techpre">${esc(techText(m))}</pre><button class="btn" id="copyTech">Copiar detalle técnico</button></details></div>`;
  else if (m.estado==='cancelado') call = `<div class="callout neu"><h4>${ICONS.cancelado}Cancelado antes del envío</h4><p class="what">${esc(m.resumen)}. No llegó a enviarse.</p></div>`;

  else call = `<div class="callout neu"><h4>${ICONS.pendiente}Pendiente</h4><p class="what">${m.prio?'Reintento en cola.':'Aún no se ha intentado enviar.'} Puede cancelarse mientras siga pendiente.</p></div>`;

      <h2>Mensaje nº ${m.n} · ${stBadge(m.estado)}</h2>

      <section class="dsec"><h3>Envío</h3><div class="in"><dl class="kv">
        <dt>Empresa</dt><dd>${esc(m.empresa)}</dd>
        <dt>Remitente</dt><dd>${esc(m.cuenta)}</dd>
        <dt>Para</dt><dd>${addr(m.para)}</dd>
        <dt>CC</dt><dd>${addr(m.cc)}</dd>
        <dt>CCO</dt><dd>${addr(m.cco)}</dd>
        <dt>Message-Id</dt><dd class="mono" style="font-size:11px">${esc(m.msgid)}</dd>
      </dl></div></section>
      <section class="dsec"><h3>Contenido <span class="r">${ICONS.lock} solo lectura</span></h3><div class="in">
        <div style="font-weight:600;margin-bottom:6px">${esc(m.asunto)}</div>
        <div class="body">${esc(m.cuerpo)}</div>

      </div></section>
      <section class="dsec"><h3>Adjuntos (${m.adjuntos.length})</h3><div class="in">
        ${m.adjuntos.map((a,i)=>`<div class="att ${a.disponible?'':'na'}">${ICONS.clip}<span class="nm" title="${esc(a.nombre)}">${esc(a.nombre)}</span><span class="sz">${a.kb>=1000?(a.kb/1024).toFixed(1).replace('.',',')+' MB':a.kb+' KB'}</span>
          ${a.disponible?`<button class="btn" data-prev="${i}">Vista previa</button>`:`<span class="res-err" style="font-size:12px" data-tip="El fichero no existe en la carpeta de documentos.">No disponible</span>`}</div>`).join('')}
      </div></section>
      <section class="dsec"><h3>Origen</h3><div class="in" style="display:flex;align-items:center;gap:10px">
        <span><b>${esc(m.origen.tipo)} ${esc(m.origen.ref)}</b><br><span class="muted">${esc(m.origen.modulo)} · ${esc(S.lot.empresa)}</span></span>
        <span class="spacer"></span><button class="btn" data-open="origen">Abrir ${esc(m.origen.tipo.toLowerCase())}</button>
      </div></section>
      <section class="dsec"><h3>Historial <span class="r">${m.intentos.length} intento${m.intentos.length===1?'':'s'} · ${hist.length} registros</span></h3><div class="in">
        <ol class="tl">${hist.map(h=>`<li><span class="t">${fmtShort(h.t)}</span><span>${h.html}</span></li>`).join('')}</ol>
      </div></section>
    </div>`;
  $('#dClose').onclick = closeDetail;
  $('#dPrev').onclick = ()=>moveActive(-1,false,true);
  $('#dNext').onclick = ()=>moveActive(1,false,true);
  el.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>confirmAction(b.dataset.act,'one',[m.id]));
  el.querySelectorAll('[data-prev]').forEach(b=>b.onclick=()=>preview(m, m.adjuntos[+b.dataset.prev]));
  el.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>toast(b.dataset.open==='cuenta' ? 'En ProConta se abriría la cuenta de correo en Gestor Correo, en otra pestaña del contenedor.' : `En ProConta se abriría ${m.origen.tipo.toLowerCase()} ${m.origen.ref} en otra pestaña del contenedor.`));
  const ct = $('#copyTech'); if (ct) ct.onclick = ()=>copy(techText(m));
  $('#dbody').scrollTop = keepTop;
}
function techText(m){
  const lines = [`Lote: ${S.lot.id} · Mensaje nº ${m.n} · Message-Id <${m.msgid}>`, `Cuenta: ${m.cuenta} · Servidor: smtp.example.invalid:587 (STARTTLS)`];
  m.intentos.forEach(a=>{ lines.push(`--- Intento ${a.n} · ${fmtDT(a.ini)} → ${fmtT(a.fin)} · ${a.code}`); lines.push(a.tech); });
  return lines.join('\n');
}
function histItems(m){
  const it = m.eventos.map(e=>({t:e.t, html:`${esc(e.txt)}${e.por?` <span class="sub">· ${esc(e.por)}</span>`:''}`}));
  m.intentos.forEach(a=>{
    const cls = a.res==='aceptado'?'aceptado':a.res==='fallido'?'fallido':'incierto';
    it.push({t:a.ini, html:`<span class="att-n">Intento ${a.n}</span> ${stBadge(cls).replace(EST[cls].t, a.res==='aceptado'?'Aceptado':a.res==='fallido'?'Fallido':'Incierto')} <span class="sub">${esc(a.txt)} · ${esc(a.code)} · ${Math.max(0,Math.round((a.fin-a.ini)/1000))} s</span>`});
  });
  if (m.estado==='proceso' && m.cur) it.push({t:m.cur, html:`<span class="att-n">Intento ${m.intentos.length+1}</span> ${stBadge('proceso')}`});
  if (m.entrega) it.push({t:m.entrega.t, html:`Aviso del proveedor: <span class="st s-${m.entrega.e}">${ICONS[m.entrega.e]}${m.entrega.e==='entregado'?'Entregado':'Rebotado'}</span> <span class="sub">${esc(m.entrega.txt)} · ${m.entrega.code}</span>`});
  return it.sort((a,b)=>a.t-b.t);
}
function openDetail(){ if (!S.active) return; S.detail = true; renderDetail(); }
function closeDetail(){ S.detail=false; renderDetail(); $('#tablewrap').focus(); }

/* =========================================================
   Teclado y ratón en la tabla
   ========================================================= */
function setActive(id, scroll=true){
  const prev = S.active; S.active = id;
  [prev,id].forEach(x=>{ const tr=document.querySelector(`#tbody tr[data-id="${x}"]`); if(tr) tr.className=rowClass(S.byId.get(x)); });
  if (scroll){ const tr=document.querySelector(`#tbody tr[data-id="${id}"]`); if (tr){ const w=$('#tablewrap'), hh=30; const top=tr.offsetTop-hh, bot=tr.offsetTop+tr.offsetHeight; if (top<w.scrollTop) w.scrollTop=top; else if (bot>w.scrollTop+w.clientHeight) w.scrollTop=bot-w.clientHeight; } }
  if (S.detail) renderDetail();
}
function moveActive(d, extend, fromDetail){
  if (!S.ids.length) return;
  let i = S.ids.indexOf(S.active); if (i<0) i=0; else i = Math.max(0, Math.min(S.ids.length-1, i+d));
  const id = S.ids[i];
  if (extend){ selectRange(S.anchor||S.active, id); }
  else S.anchor = id;
  setActive(id);
  if (fromDetail) $('#dbody')?.focus();
}
function selectRange(a,b){
  const i=S.ids.indexOf(a), j=S.ids.indexOf(b); if (i<0||j<0) return;
  const [x,y]=i<j?[i,j]:[j,i]; for (let k=x;k<=y;k++) S.sel.add(S.ids[k]);
  refreshSelection();
}
function toggleSel(id){ S.sel.has(id)?S.sel.delete(id):S.sel.add(id); S.allVisibleBanner=false; refreshSelection(); }
function bindTable(){
  const tb=$('#tbody'), wrap=$('#tablewrap');
  tb.addEventListener('click', e=>{
    const tr = e.target.closest('tr'); if (!tr) return; const id=tr.dataset.id;
    if (e.target.matches('input[type=checkbox]')){ e.preventDefault(); if (e.shiftKey && S.anchor) selectRange(S.anchor,id); else { toggleSel(id); S.anchor=id; } setActive(id,false); wrap.focus({preventScroll:true}); return; }
    if (e.shiftKey && S.anchor){ selectRange(S.anchor,id); }
    else if (e.ctrlKey||e.metaKey){ toggleSel(id); S.anchor=id; }
    else S.anchor=id;
    setActive(id,false); wrap.focus({preventScroll:true});
  });
  tb.addEventListener('dblclick', e=>{ const tr=e.target.closest('tr'); if(!tr||e.target.matches('input')) return; setActive(tr.dataset.id,false); openDetail(); });
  wrap.addEventListener('keydown', e=>{
    if (e.target!==wrap) return;
    const page = Math.max(1, Math.floor(wrap.clientHeight/26)-2);
    const k=e.key;
    if (k==='ArrowDown'){ moveActive(1,e.shiftKey); e.preventDefault(); }
    else if (k==='ArrowUp'){ moveActive(-1,e.shiftKey); e.preventDefault(); }
    else if (k==='PageDown'){ moveActive(page,e.shiftKey); e.preventDefault(); }
    else if (k==='PageUp'){ moveActive(-page,e.shiftKey); e.preventDefault(); }
    else if (k==='Home'){ moveActive(-1e6,e.shiftKey); e.preventDefault(); }
    else if (k==='End'){ moveActive(1e6,e.shiftKey); e.preventDefault(); }
    else if (k===' '){ if (S.active){ toggleSel(S.active); S.anchor=S.active; } e.preventDefault(); }
    else if (k==='Enter'){ openDetail(); e.preventDefault(); }
    else if ((e.ctrlKey||e.metaKey) && k.toLowerCase()==='a'){ S.ids.forEach(id=>S.sel.add(id)); S.allVisibleBanner=true; refreshSelection(); e.preventDefault(); }
    else if (k==='Escape'){ if (S.detail) closeDetail(); else if (S.sel.size){ S.sel.clear(); S.allVisibleBanner=false; refreshSelection(); } }
  });
}

/* =========================================================
   Acciones (con alcance, excluidos y bloqueo de dobles acciones)
   ========================================================= */
const KIND = {
  retry:{verb:'Reintentar', title:n=>`Reintentar ${n} mensaje${n===1?'':'s'}`, okH:'Se reintentarán', btn:n=>`Reintentar ${n}`,
    foot:'Cada reintento añade un intento nuevo al historial; los errores anteriores se conservan.'},
  cancel:{verb:'Cancelar', title:n=>`Cancelar ${n} envío${n===1?'':'s'} pendiente${n===1?'':'s'}`, okH:'Se cancelarán (aún pendientes)', btn:n=>`Cancelar ${n} envío${n===1?'':'s'}`,
    foot:'Los mensajes cancelados no se envían. Quedan en el lote con su historial.'},
  check:{verb:'Comprobar', title:n=>`Comprobar el estado de ${n} mensaje${n===1?'':'s'} incierto${n===1?'':'s'}`, okH:'Se comprobarán', btn:n=>`Comprobar ${n}`,
    foot:'La comprobación no reenvía nada.'},
  resend:{verb:'Reenviar', title:n=>`Reenviar ${n} mensaje${n===1?'':'s'} ya aceptado${n===1?'':'s'}`, okH:'Se crearán envíos nuevos para', btn:n=>`Crear ${n} envío${n===1?'':'s'} nuevo${n===1?'':'s'}`,
    foot:'Los mensajes originales se conservan como aceptados y quedan vinculados a los nuevos.'}
};
function confirmAction(kind, scopeType, ids){
  if (S.busy) return;
  const sc = scopeOf(kind, ids);
  const vis = new Set(S.ids);
  const hidden = ids.filter(id=>!vis.has(id)).length;
  let scopeTxt;
  if (scopeType==='lot') scopeTxt = `Alcance: <b>todo el lote</b> (${S.msgs.length} mensajes), incluidos los que no se ven con el filtro actual.`;
  else if (scopeType==='sel') scopeTxt = `Alcance: <b>selección</b> de ${ids.length} mensaje${ids.length===1?'':'s'}${hidden?`, de los que <b>${hidden} no ${hidden===1?'se ve':'se ven'}</b> con el filtro actual`:''}.`;
  else scopeTxt = `Alcance: <b>este mensaje</b> (nº ${S.byId.get(ids[0]).n}).`;

  if (kind==='check' && !S.caps.check) return checkUnavailable(sc, scopeTxt);
  const K = KIND[kind];
  const list = arr => `<span class="ids">nº ${arr.slice(0,24).map(m=>m.n).join(', ')}${arr.length>24?` y ${arr.length-24} más`:''}</span>`;
  const exHtml = Object.entries(sc.ex).map(([r,arr])=>`<li><b>${arr.length}</b> · ${esc(r)}<br>${list(arr)}</li>`).join('');
  const exN = Object.values(sc.ex).reduce((s,a)=>s+a.length,0);
  let warnHtml = '';
  if (kind==='retry' && sc.warn.length){
    const perm = sc.warn.filter(m=>ERR[m.err].cls==='permanente'), corr = sc.warn.filter(m=>ERR[m.err].cls!=='permanente');
    warnHtml = `<div class="box wn"><h4>${ICONS.incierto}<span class="n">${sc.warn.length}</span> volverán a fallar previsiblemente</h4><ul>
      ${perm.length?`<li><b>${perm.length}</b> con dirección rechazada: el reintento usa la misma dirección. ${list(perm)}</li>`:''}
      ${corr.length?`<li><b>${corr.length}</b> pendientes de corregir (cuenta, adjunto o tamaño). ${list(corr)}</li>`:''}</ul>
      <label style="display:flex;gap:6px;margin-top:6px"><input type="checkbox" id="incWarn"> Incluirlos igualmente</label></div>`;
  }
  let extra = '';
  if (kind==='resend') extra = `<div class="ack">${ICONS.incierto}<div><b>Esto generará otro envío</b>: el destinatario recibirá el mensaje de nuevo. Se usa el mismo contenido histórico y los mismos adjuntos y destinatarios. El envío original no se modifica.<br><label style="display:flex;gap:6px;margin-top:6px"><input type="checkbox" id="ackResend"> Entiendo que se enviará de nuevo</label></div></div>`;
  if (kind==='cancel'){
    const proc = (sc.ex['Ya se está enviando: no puede cancelarse.']||[]).length;
    if (proc) extra = `<p class="muted" style="margin:6px 0 0">${proc} en proceso no pueden detenerse: terminarán con su resultado.</p>`;
  }
  const effective = () => kind==='retry' && sc.warn.length && !$('#incWarn')?.checked ? sc.ok.filter(m=>!sc.warn.includes(m)) : sc.ok;
  dialog({
    title: K.title(effective().length),
    sub: scopeTxt,
    body: `
      <div class="box ok"><h4>${ICONS.info}${K.okH}: <span class="n" id="okN">${effective().length}</span></h4><div id="okL">${effective().length?list(effective()):'<span class="muted">Ninguno.</span>'}</div></div>
      ${warnHtml}
      ${exN?`<div class="box ex"><h4>Excluidos: <span class="n">${exN}</span></h4><ul>${exHtml}</ul></div>`:''}
      ${extra}`,
    primary: K.btn(effective().length), primaryDisabled: !effective().length || kind==='resend',
    note: K.foot,
    onMount: (d, setPrimary) => {
      const upd = ()=>{ const n=effective().length; $('#okN').textContent=n; $('#okL').innerHTML = n?list(effective()):'<span class="muted">Ninguno.</span>'; $('#dlgT').textContent=K.title(n); setPrimary(K.btn(n), !n || (kind==='resend' && !$('#ackResend').checked)); };
      d.querySelector('#incWarn')?.addEventListener('change', upd);
      d.querySelector('#ackResend')?.addEventListener('change', upd);
    },
    onOk: () => runAction(kind, effective())
  });
}
function checkUnavailable(sc, scopeTxt){
  const n = sc.ok.length;
  dialog({
    title:'No se puede comprobar automáticamente', sub: scopeTxt,
    body:`<p>El motor de correo actual no puede preguntar al proveedor si ${n===1?'el mensaje llegó':'los mensajes llegaron'} a enviarse: SMTP no ofrece esa consulta y la conexión se cortó antes de la confirmación.</p>
      <p><b>Cómo comprobarlo:</b> revise la carpeta Enviados de la cuenta remitente o confirme con el destinatario.</p>
      <div class="box ok"><h4>Mensajes inciertos: <span class="n">${n}</span></h4><span class="ids">nº ${sc.ok.map(m=>m.n).join(', ')||'—'}</span></div>
      <p style="margin-bottom:4px">Registre el resultado de su comprobación:</p>
      <label style="display:flex;gap:6px;margin:4px 0"><input type="radio" name="res" value="sent"> Consta como enviado: marcar como aceptado (verificación manual)</label>
      <label style="display:flex;gap:6px;margin:4px 0"><input type="radio" name="res" value="notsent"> No consta: marcar como fallido para poder reintentarlo</label>
      <label style="display:flex;gap:6px;margin:4px 0"><input type="radio" name="res" value="repeat"> No lo he podido comprobar: repetir el envío igualmente</label>
      <div class="ack" id="repAck" hidden>${ICONS.incierto}<label style="display:flex;gap:6px"><input type="checkbox" id="ackRep"> Entiendo que el destinatario podría recibirlo dos veces.</label></div>`,
    primary:'Registrar', primaryDisabled:true,
    note:'Queda registrado en el historial con su nombre.',
    onMount:(d,setPrimary)=>{
      const upd=()=>{ const v=d.querySelector('input[name=res]:checked')?.value; d.querySelector('#repAck').hidden = v!=='repeat';
        setPrimary(v==='repeat'?`Repetir ${n} envío${n===1?'':'s'}`:'Registrar', !n || !v || (v==='repeat' && !d.querySelector('#ackRep').checked)); };
      d.querySelectorAll('input').forEach(i=>i.addEventListener('change',upd));
    },
    onOk:(d)=>{ const v=d.querySelector('input[name=res]:checked').value; runAction('manual:'+v, sc.ok); }
  });
}
function runAction(kind, list){
  if (!list.length || S.busy) return;
  S.busy = true;
  const label = {retry:'encolando reintento', cancel:'cancelando', check:'comprobando', resend:'creando reenvío'}[kind] || 'registrando';
  list.forEach(m=>m.op=label);
  dataChanged(list.map(m=>m.id), false);
  if (S.detail) renderDetail();
  const t = S.lot.clock;
  setTimeout(()=>{
    const changed = list.map(m=>m.id);
    let msg='';
    if (kind==='retry'){
      list.forEach(m=>{ m.op=null; m.estado='pendiente'; m.prio=Date.now(); m.resumen=''; ev(m,t,'Reintento solicitado (el intento anterior y su error se conservan)', S.operador); });
      msg = `${list.length} mensaje${list.length>1?'s':''} en cola para reintento.${S.sim.running?'':' Se procesarán cuando el motor avance (inicie la simulación o use «Un paso»).'}`;
    } else if (kind==='cancel'){
      list.forEach(m=>{ m.op=null; if (m.estado!=='pendiente'){ return; } m.estado='cancelado'; m.resumen='Cancelado por '+S.operador.replace(/^(\w)\w+/,'$1.')+' · solicitado desde el seguimiento'; ev(m,t,'Cancelado antes del envío', S.operador); });
      const done = list.filter(m=>m.estado==='cancelado').length;
      msg = `${done} envío${done>1?'s':''} cancelado${done>1?'s':''}.` + (done<list.length?` ${list.length-done} ya habían pasado a proceso y no se cancelaron.`:'');
    } else if (kind==='check'){
      list.forEach((m,i)=>{ m.op=null; ev(m,t,'Comprobación de resultado solicitada al proveedor', S.operador);
        if (i%2===0){ m.estado='aceptado'; m.err=null; m.resumen='Aceptado (confirmado por comprobación) · '+fmtT(t,false); ev(m,addS(t,2),'Comprobación: el proveedor registra el Message-Id como aceptado. Estado corregido a Aceptado.', 'Motor de correo'); }
        else { m.estado='fallido'; m.err='noconsta'; m.resumen=ERR.noconsta.res; ev(m,addS(t,2),'Comprobación: el proveedor no registra el envío. Pasa a Fallido y puede reintentarse sin riesgo de duplicado.', 'Motor de correo'); }
      });
      msg = 'Comprobación terminada. Revise el resultado en cada mensaje.';
    } else if (kind==='resend'){
      list.forEach(m=>{
        m.op=null;
        const n = Math.max(...S.msgs.map(x=>x.n))+1;
        const c = structuredClone({...m, intentos:[], eventos:[], entrega:null, reenviadoComo:undefined});
        Object.assign(c, {id:'m'+S.lot.key+'r'+n, n, estado:'pendiente', prio:Date.now(), resumen:'', err:null, creado:t, reenvioDe:m.n, msgid:`${S.lot.key.toLowerCase()}${n}.r${m.n}@empresa-demo-a.example.invalid`,
          cur:null});
        c.creado = m.creado; // el contenido sigue siendo el histórico
        c.eventos = [{t, txt:`Reenvío del mensaje nº ${m.n} (mismo contenido histórico del ${fmtDT(m.creado)})`, por:S.operador}];
        S.msgs.push(c); S.byId.set(c.id,c);
        (m.reenviadoComo = m.reenviadoComo||[]).push(n);
        ev(m,t,`Reenviado como mensaje nº ${n}. Este envío se conserva sin cambios.`, S.operador);
        if (matches(c)){ S.ids.push(c.id); $('#tbody').insertAdjacentHTML('beforeend', `<tr data-id="${c.id}" class="${rowClass(c)} flash">${rowInner(c)}</tr>`); }
      });
      msg = `${list.length} envío${list.length>1?'s':''} nuevo${list.length>1?'s':''} añadido${list.length>1?'s':''} al final del lote.`;
    } else if (kind.startsWith('manual:')){
      const v = kind.split(':')[1];
      list.forEach(m=>{ m.op=null;
        if (v==='sent'){ m.estado='aceptado'; m.err=null; m.resumen='Aceptado (verificado manualmente)'; ev(m,t,'Resultado registrado manualmente: consta como enviado', S.operador); }
        else if (v==='notsent'){ m.estado='fallido'; m.err='noconsta'; m.resumen='No consta como enviado (verificado manualmente)'; ev(m,t,'Resultado registrado manualmente: no consta como enviado', S.operador); }
        else { m.estado='pendiente'; m.prio=Date.now(); m.err=null; m.resumen=''; ev(m,t,'Repetición solicitada sin comprobación previa (posible duplicado aceptado por el operador)', S.operador); }
      });
      msg = v==='repeat' ? `${list.length} mensaje${list.length>1?'s':''} en cola para repetir.` : 'Resultado registrado en el historial.';
    }
    S.busy = false;
    dataChanged(changed);
    renderHead();
    if (S.detail) renderDetail();
    toast(msg);
  }, 900);
}

/* Menú de acciones del lote */
function openLotMenu(btn){
  closeMenus();
  const all = S.msgs.map(m=>m.id);
  const c = counts();
  const n = k => scopeOf(k, all).ok.length;
  const r = btn.getBoundingClientRect();
  const m = document.createElement('div');
  m.className='menu'; m.setAttribute('role','menu'); m.id='lotMenu';
  m.style.top = (r.bottom+4)+'px'; m.style.right = (window.innerWidth - r.right)+'px';
  const cancelProc = c.proceso;
  m.innerHTML = `<div class="mh">Todo el lote · ${c.total} mensajes (incluye los no visibles)</div>
    <button role="menuitem" data-k="retry" ${n('retry')?'':'disabled'}><span>Reintentar todos los fallidos<small>Se avisará de los que volverán a fallar previsiblemente.</small></span><span class="cnt">${n('retry')}</span></button>
    <button role="menuitem" data-k="check" ${n('check')?'':'disabled'}><span>Comprobar estado de los inciertos<small>${S.caps.check?'Consulta al proveedor antes de repetir.':'El motor actual no puede comprobarlo: se explicará cómo hacerlo.'}</small></span><span class="cnt">${n('check')}</span></button>
    <button role="menuitem" data-k="cancel" ${n('cancel')?'':'disabled'}><span>Cancelar todos los pendientes<small>${cancelProc?`${cancelProc} en proceso no pueden cancelarse.`:'Ninguno en proceso.'}</small></span><span class="cnt">${n('cancel')}</span></button>
    <hr>
    <button role="menuitem" data-k="sel"><span>Seleccionar todos los mensajes del lote<small>Para revisar o actuar sobre la selección.</small></span><span class="cnt">${c.total}</span></button>`;
  document.body.appendChild(m);
  btn.setAttribute('aria-expanded','true');
  m.querySelectorAll('button').forEach(b=>b.onclick=()=>{ closeMenus(); const k=b.dataset.k; if (k==='sel'){ all.forEach(id=>S.sel.add(id)); S.allVisibleBanner=true; refreshSelection(); } else confirmAction(k,'lot',all); });
  m.querySelector('button:not(:disabled)')?.focus();
  m.addEventListener('keydown', e=>{
    const items=[...m.querySelectorAll('button:not(:disabled)')], i=items.indexOf(document.activeElement);
    if (e.key==='ArrowDown'){ items[(i+1)%items.length].focus(); e.preventDefault(); }
    if (e.key==='ArrowUp'){ items[(i-1+items.length)%items.length].focus(); e.preventDefault(); }
    if (e.key==='Escape'){ closeMenus(); btn.focus(); }
  });
}
function closeMenus(){ document.querySelectorAll('.menu').forEach(x=>x.remove()); const b=$('#bLot'); if(b) b.setAttribute('aria-expanded','false'); }
document.addEventListener('mousedown', e=>{ if (!e.target.closest('.menu') && !e.target.closest('#bLot')) closeMenus(); });

function onPause(){
  if (!S.caps.pause){
    dialog({title:'Pausar y reanudar: propuesta', sub:'Capacidad pendiente de contrato con el motor de correo.',
      body:`<p>Esta acción se muestra como <b>propuesta</b>. Para ofrecerla, el motor debe permitir dejar de tomar mensajes pendientes de un lote y reanudarlo después, sin perder el orden ni duplicar envíos.</p>
      <p>Comportamiento propuesto: al pausar, los mensajes en proceso terminan con su resultado y los pendientes esperan. Cerrar esta vista no pausa ni cancela el lote.</p>
      <p class="muted">En la maqueta puede simularla activando «Pausa» en la barra de controles.</p>`,
      primary:'Entendido', cancel:false, onOk:()=>{}});
    return;
  }
  S.paused = !S.paused; S.lot.paused = S.paused;
  toast(S.paused ? 'Lote pausado. Los mensajes en proceso terminarán; los pendientes esperan.' : 'Lote reanudado.');
  dataChanged([]);
}

/* =========================================================
   Diálogos, vista previa, tooltips, toasts
   ========================================================= */
function dialog({title, sub, body, primary='Aceptar', primaryDisabled=false, cancel=true, note='', wide=false, onMount, onOk}){
  closeMenus();
  const prevFocus = document.activeElement;
  const bd = document.createElement('div'); bd.className='backdrop';
  bd.innerHTML = `<div class="dlg ${wide?'wide':''}" role="dialog" aria-modal="true" aria-labelledby="dlgT">
    <header><h2 id="dlgT">${title}</h2>${sub?`<p>${sub}</p>`:''}</header>
    <div class="content">${body}</div>
    <footer>${primary?`<button class="btn primary" id="dOk" ${primaryDisabled?'disabled':''}>${primary}</button>`:''}${cancel?`<button class="btn" id="dCancel">${primary?'Cancelar':'Cerrar'}</button>`:''}${note?`<span class="note">${note}</span>`:''}</footer></div>`;
  document.body.appendChild(bd);
  const d = bd.querySelector('.dlg');
  const close = ()=>{ bd.remove(); prevFocus?.focus?.(); };
  const setPrimary = (txt,dis)=>{ const b=d.querySelector('#dOk'); if(b){ b.textContent=txt; b.disabled=dis; } };
  d.querySelector('#dCancel')?.addEventListener('click', close);
  d.querySelector('#dOk')?.addEventListener('click', e=>{
    const b=e.currentTarget; if (b.disabled) return; b.disabled=true; b.textContent='Procesando…';
    onOk?.(d); close();
  });
  bd.addEventListener('keydown', e=>{
    if (e.key==='Escape'){ close(); e.stopPropagation(); }
    if (e.key==='Tab'){ const f=[...d.querySelectorAll('button:not(:disabled),input:not(:disabled),[tabindex="0"]')]; if(!f.length) return; const i=f.indexOf(document.activeElement); if (e.shiftKey && i<=0){ f.at(-1).focus(); e.preventDefault(); } else if (!e.shiftKey && i===f.length-1){ f[0].focus(); e.preventDefault(); } }
  });
  onMount?.(d, setPrimary);
  (d.querySelector('#dOk:not(:disabled)') || d.querySelector('input') || d.querySelector('#dCancel'))?.focus();
  return {close};
}
function preview(m, a){
  let inner;
  if (a.tipo==='xlsx') inner = `<div class="page"><h5>${esc(a.nombre)}</h5><div class="muted">Hoja 1 · Consumos</div><table><tr><th>Concepto</th><th>Unid.</th><th>Importe</th></tr>${['Horas técnico','Desplazamientos','Material fungible','Revisión filtros'].map((x,i)=>`<tr><td>${x}</td><td>${i+2}</td><td>${(45.5*(i+1)).toFixed(2).replace('.',',')} €</td></tr>`).join('')}</table><div class="wm">Vista previa simulada</div></div>`;
  else inner = `<div class="page"><h5>${esc(m.empresa)}</h5><div class="muted">${esc(m.origen.tipo)} ${esc(m.origen.ref)} · ${fmtD(m.creado)}</div>
    <p style="margin-top:14px"><b>Cliente:</b> ${esc(m.para[0].nombre)}</p>
    <table><tr><th style="text-align:left">Concepto</th><th style="text-align:right">Importe</th></tr><tr><td>${esc(m.asunto.split(' · ')[1]||'')}</td><td style="text-align:right">—</td></tr></table>
    <div class="wm">Vista previa simulada del PDF adjunto<br>${esc(a.nombre)}</div></div>`;
  dialog({title:`Vista previa · ${esc(a.nombre)}`, sub:`Adjunto del mensaje nº ${m.n}, tal como se envió.`, body:`<div class="preview">${inner}</div>`, primary:'', cancel:true, wide:true});
}
let tipT=null;
function showTip(el){
  const t = el.getAttribute('data-tip'); if (!t) return;
  const tip=$('#tip'); tip.textContent = t.replace(/\\n/g,'\n'); tip.hidden=false;
  const r = el.getBoundingClientRect(); const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = Math.min(window.innerWidth-w-8, Math.max(8, r.left)); let y = r.bottom+6; if (y+h>window.innerHeight-8) y = r.top-h-6;
  tip.style.left=x+'px'; tip.style.top=y+'px';
}
function hideTip(){ clearTimeout(tipT); $('#tip').hidden=true; }
document.addEventListener('mouseover', e=>{ const el=e.target.closest('[data-tip]'); clearTimeout(tipT); if (!el){ hideTip(); return; } tipT=setTimeout(()=>showTip(el),400); });
document.addEventListener('focusin', e=>{ const el=e.target.closest('[data-tip]'); hideTip(); if (el && el.matches(':focus-visible')) tipT=setTimeout(()=>showTip(el),250); });
document.addEventListener('keydown', e=>{ if (e.key==='Escape') hideTip(); if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='f' && !document.querySelector('.backdrop')){ $('#q').focus(); $('#q').select(); e.preventDefault(); } }, true);
document.addEventListener('scroll', hideTip, true);
function toast(t){ const d=document.createElement('div'); d.className='toast'; d.textContent=t; $('#toasts').appendChild(d); setTimeout(()=>d.remove(), 4800); }
function copy(t){
  const done=()=>toast('Detalle técnico copiado al portapapeles.');
  if (navigator.clipboard?.writeText) navigator.clipboard.writeText(t).then(done, fallback); else fallback();
  function fallback(){ const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy'); done();}catch(e){toast('No se pudo copiar: seleccione el texto manualmente.');} ta.remove(); }
}

/* =========================================================
   Motor simulado
   ========================================================= */
function retryOutcome(m){
  if (!m.err) return m.n%17===5 && !m.prio ? ['fallido','temporal'] : ['aceptado'];
  const k = ERR[m.err];
  if (k.cls==='permanente') return ['fallido', m.err];
  if (k.cls==='correccion') return S.caps.fixed ? ['aceptado'] : ['fallido', m.err];
  return ['aceptado'];
}
function tick(){
  if (S.lot.estado==='prep') return;
  const L = S.lot; L.clock = addS(L.clock, 17);
  const changed = [];
  const proc = S.msgs.filter(m=>m.estado==='proceso').sort((a,b)=>a.cur-b.cur);
  if (proc.length){
    const m = proc[0];
    const [res, k] = retryOutcome(m);
    if (k==='adjunto') m.adjuntos[0].disponible = S.caps.fixed;
    if (res==='aceptado' && m.err==='adjunto') m.adjuntos.forEach(a=>a.disponible=true);
    attempt(m, m.cur, res, k, Math.max(2, Math.round((L.clock-m.cur)/1000)));
    m.intentos.at(-1).fin = L.clock; m.cur=null; m.prio=0;
    if (res==='aceptado') m.resumen = 'Aceptado por el servicio · '+fmtT(L.clock,false);
    changed.push(m.id);
  }
  if (!S.paused){
    const pend = S.msgs.filter(m=>m.estado==='pendiente' && !m.op).sort((a,b)=>(b.prio||0)-(a.prio||0)||a.n-b.n);
    let inProc = S.msgs.filter(m=>m.estado==='proceso').length;
    while (inProc<3 && pend.length){ const m=pend.shift(); m.estado='proceso'; m.cur = addS(L.clock, -inProc*3); m.resumen='Enviando…'; changed.push(m.id); inProc++; }
  }
  const c = counts();
  if (!c.pendiente && !c.proceso && S.sim.running){ stopSim(); toast(c.fallido+c.incierto ? `Lote finalizado con incidencias: ${c.fallido} fallidos, ${c.incierto} inciertos.` : 'Lote finalizado. Todos los mensajes aceptados por el servicio.'); }
  else if (S.paused && !c.proceso && S.sim.running){ toast('Lote en pausa: no quedan mensajes en proceso.'); }
  dataChanged(changed);
}
function startSim(){ if (S.sim.running) return; S.sim.running=true; S.sim.timer=setInterval(tick, +$('#dSpeed').value); syncDemo(); }
function stopSim(){ S.sim.running=false; clearInterval(S.sim.timer); syncDemo(); }
function syncDemo(){ const b=$('#dPlay'); b.setAttribute('aria-pressed', S.sim.running); b.textContent = S.sim.running ? '⏸ Detener' : '▶ Iniciar'; }

/* =========================================================
   Arranque
   ========================================================= */
function init(){
  buildScenarios();
  $('#dScen').onchange = e=>loadScenario(e.target.value);
  $('#dPlay').onclick = ()=> S.sim.running ? stopSim() : startSim();
  $('#dStep').onclick = tick;
  $('#dSpeed').onchange = ()=>{ if (S.sim.running){ stopSim(); startSim(); } };
  $('#cCheck').onchange = e=>{ S.caps.check=e.target.checked; renderDetail(); };
  $('#cPause').onchange = e=>{ S.caps.pause=e.target.checked; if(!S.caps.pause && S.paused){ S.paused=false; S.lot.paused=false; } renderHeader(); renderSummary(); };
  $('#cFixed').onchange = e=>{ S.caps.fixed=e.target.checked; renderTools(); };
  $('#dReset').onclick = ()=>{ const k=S.scen; buildScenarios(); ['cCheck','cPause','cFixed'].forEach(i=>$('#'+i).checked=false); S.caps={check:false,pause:false,fixed:false}; S.paused=false; loadScenario(k); toast('Escenarios restablecidos.'); };
  document.querySelectorAll('#demo [data-w]').forEach(b=>b.onclick=()=>{ $('#frame').className=b.dataset.w; document.querySelectorAll('#demo [data-w]').forEach(x=>x.setAttribute('aria-pressed', x===b)); });
  let qt; $('#q').addEventListener('input', e=>{ clearTimeout(qt); qt=setTimeout(()=>{ S.q=e.target.value.trim(); viewChanged(); },180); });
  $('#q').addEventListener('keydown', e=>{ if (e.key==='Escape' && e.target.value){ e.target.value=''; S.q=''; viewChanged(); e.stopPropagation(); } if (e.key==='ArrowDown' || e.key==='Enter'){ $('#tablewrap').focus(); e.preventDefault(); } });
  $('#qx').onclick = ()=>{ $('#q').value=''; S.q=''; viewChanged(); $('#q').focus(); };
  $('#clear').onclick = clearFilters;
  bindTable();
  loadScenario('A');
}
init();
