<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Configuración ProConta</title>
<style>
/* Disposición: barra de demostración discreta + ventana del módulo (navegación funcional | cabecera + lista/editor redimensionables + barra de acciones al pie) */
:root{
  --bg:#E9E6DF; --frame:#F3F1EC; --surface:#FFFFFF; --surface-2:#FBFAF7; --surface-3:#F1EEE7;
  --line:#E3DED2; --line-2:#D3CCBD; --ink:#16213A; --muted:#646A78; --faint:#8A909C;
  --navy:#14213A; --navy-2:#22345A; --on-navy:#FFFFFF; --on-navy-muted:#AEB8CC;
  --accent:#F4A259; --accent-ink:#9A4A12; --accent-soft:#FFF3E6; --accent-line:#F2C9A1;
  --link:#1D5C8C; --sel:#E3ECF6; --sel-line:#9DB8D6; --hover:#F4F1EA;
  --err:#B42318; --err-soft:#FDECEA; --err-line:#F1B5AE;
  --ok:#1E6B45; --ok-soft:#E2F0E8; --info-soft:#EEF3F9;
  --demo:#5B3F86; --demo-soft:#F1ECF7; --demo-line:#CDBFE0;
  --shadow:0 12px 32px rgba(20,33,58,.18);
  --ui:"Segoe UI","Segoe UI Variable Text",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"Cascadia Mono",Consolas,"SFMono-Regular",ui-monospace,monospace;
  --fs:13px; --row:26px; --lw:184px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1320; --frame:#131B2B; --surface:#182235; --surface-2:#1B263B; --surface-3:#202C44;
  --line:#2A3752; --line-2:#36466A; --ink:#E6EAF2; --muted:#A4ADBF; --faint:#7F899D;
  --navy:#0A1120; --navy-2:#22345A; --on-navy:#FFFFFF; --on-navy-muted:#AEB8CC;
  --accent:#F4A259; --accent-ink:#F7B57A; --accent-soft:#3A2A1C; --accent-line:#7A4E2A;
  --link:#8DBAE6; --sel:#22395A; --sel-line:#4D74A6; --hover:#1E2A40;
  --err:#FF8A80; --err-soft:#3A1E22; --err-line:#7A3A3A;
  --ok:#7BD3A4; --ok-soft:#173327; --info-soft:#1C2A40;
  --demo:#C9B2EE; --demo-soft:#2A2340; --demo-line:#4E4270;
  --shadow:0 12px 32px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1320; --frame:#131B2B; --surface:#182235; --surface-2:#1B263B; --surface-3:#202C44;
  --line:#2A3752; --line-2:#36466A; --ink:#E6EAF2; --muted:#A4ADBF; --faint:#7F899D;
  --navy:#0A1120; --navy-2:#22345A; --on-navy:#FFFFFF; --on-navy-muted:#AEB8CC;
  --accent:#F4A259; --accent-ink:#F7B57A; --accent-soft:#3A2A1C; --accent-line:#7A4E2A;
  --link:#8DBAE6; --sel:#22395A; --sel-line:#4D74A6; --hover:#1E2A40;
  --err:#FF8A80; --err-soft:#3A1E22; --err-line:#7A3A3A;
  --ok:#7BD3A4; --ok-soft:#173327; --info-soft:#1C2A40;
  --demo:#C9B2EE; --demo-soft:#2A2340; --demo-line:#4E4270;
  --shadow:0 12px 32px rgba(0,0,0,.5); color-scheme:dark}

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:var(--fs)/1.4 var(--ui);overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.muted{color:var(--muted)} .mono{font-family:var(--mono)} .tn{font-variant-numeric:tabular-nums}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Barra de demostración ---------- */
.page{height:100%;display:flex;flex-direction:column}
.demo{flex-shrink:0;display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:5px 16px;background:var(--demo-soft);border-bottom:1px dashed var(--demo-line);color:var(--ink);font-size:12px}
.demo .tag{font-weight:600;color:var(--demo);letter-spacing:.04em;text-transform:uppercase;font-size:11px}
.demo label{display:flex;align-items:center;gap:6px;color:var(--muted)}
.demo select{height:24px;border:1px solid var(--demo-line);background:var(--surface);border-radius:4px;padding:0 4px;max-width:160px}
.demo .seg{display:inline-flex;border:1px solid var(--demo-line);border-radius:4px;overflow:hidden}
.demo .seg button{border:0;background:var(--surface);height:22px;padding:0 6px;cursor:pointer;font-size:12px}
.demo .seg button+button{border-left:1px solid var(--demo-line)}
.demo .seg button[aria-pressed="true"]{background:var(--demo);color:var(--surface)}
.demo .dbtn{height:24px;border:1px solid var(--demo-line);background:var(--surface);border-radius:4px;padding:0 9px;cursor:pointer}
.demo .dbtn:hover{border-color:var(--demo)}
.demo .grow{flex:1}
.scn-note{flex-basis:100%;display:none;color:var(--demo);font-size:12px}
.scn-note.on{display:block}

/* ---------- Escenario / marco ---------- */
.stage{flex:1;min-height:0;overflow:auto;padding:12px 16px}
.frame{background:var(--frame);border:1px solid var(--line-2);border-radius:6px;display:flex;flex-direction:column;overflow:hidden;container-type:inline-size;container-name:frame;position:relative}
.frame.fixed{box-shadow:var(--shadow)}
.ctxbar{height:28px;flex-shrink:0;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--navy);color:var(--on-navy-muted);font-size:12px}
.ctxbar b{color:var(--on-navy);font-weight:600}
.ctxbar .dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.app{flex:1;min-height:0;display:grid;grid-template-columns:248px minmax(0,1fr)}

/* ---------- Navegación funcional ---------- */
.nav{border-right:1px solid var(--line);background:var(--surface-2);display:flex;flex-direction:column;min-height:0}
.navhead{padding:10px 10px 8px;border-bottom:1px solid var(--line)}
.navhead h2{font-size:15px;font-weight:600;margin:0 0 8px 2px}
.gsearch{position:relative}
.gsearch input{width:100%;height:30px;border:1px solid var(--line-2);border-radius:4px;background:var(--surface);padding:0 28px 0 28px}
.gsearch input::placeholder{color:var(--faint)}
.gsearch .ic{position:absolute;left:8px;top:8px;color:var(--faint)}
.gsearch .clr{position:absolute;right:3px;top:3px;width:24px;height:24px;border:0;background:transparent;cursor:pointer;color:var(--muted);border-radius:3px}
.gsearch .clr:hover{background:var(--hover)}
.navbody{flex:1;min-height:0;overflow:auto;padding:6px 0 10px}
.cat{margin-top:4px}
.cat>.ch{display:flex;align-items:center;gap:6px;width:100%;border:0;background:transparent;padding:6px 12px 4px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;cursor:pointer;text-align:left}
.cat>.ch .chev{transition:transform .12s}
.cat.closed>.ch .chev{transform:rotate(-90deg)}
.cat.closed>.items{display:none}
.item{display:flex;align-items:center;gap:7px;width:100%;min-height:30px;border:0;background:transparent;text-align:left;padding:4px 10px 4px 20px;cursor:pointer;border-left:3px solid transparent;color:var(--ink)}
.item:hover{background:var(--hover)}
.item[aria-current="true"]{background:var(--sel);border-left-color:var(--navy-2);font-weight:600}
.item .nm{flex:1;min-width:0}
.item .mk{display:flex;gap:4px;align-items:center;flex-shrink:0;color:var(--muted)}
.mdot{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block}
.merr{color:var(--err);font-size:12px;line-height:1}
.ico{width:14px;height:14px;flex-shrink:0;display:inline-block;vertical-align:-2px}
.lockic{color:var(--muted)}
.res{padding:4px 0}
.res h3{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 12px 4px;font-weight:600}
.ritem{display:block;width:100%;border:0;background:transparent;text-align:left;padding:6px 12px;cursor:pointer;color:var(--ink);border-left:3px solid transparent}
.ritem:hover,.ritem.kb{background:var(--hover);border-left-color:var(--accent)}
.ritem .rt{display:flex;gap:6px;align-items:baseline}
.ritem .rk{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);flex-shrink:0;width:52px}
.ritem .rp{display:block;font-size:11.5px;color:var(--muted);margin-left:58px}
.ritem mark{background:var(--accent-soft);color:inherit;border-bottom:1px solid var(--accent)}
.rnone{padding:12px;color:var(--muted)}
.navfoot{border-top:1px solid var(--line);padding:6px 12px;font-size:11.5px;color:var(--muted)}

/* ---------- Área principal ---------- */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--frame)}
.mhead{flex-shrink:0;padding:10px 16px 10px;border-bottom:1px solid var(--line);background:var(--surface);display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.mhead .crumb{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.navtoggle{display:none;height:26px;border:1px solid var(--line-2);background:var(--surface);border-radius:4px;padding:0 8px;cursor:pointer;margin-right:4px}
.mhead h1{font-size:18px;font-weight:600;letter-spacing:-.01em;margin-top:1px}
.mhead .purpose{color:var(--muted);margin-top:2px;max-width:70ch}
.mhead .tl{flex:1;min-width:260px}
.mhead .tr{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:11px;border:1px solid var(--line-2);background:var(--surface-2);font-size:11.5px;white-space:nowrap;color:var(--ink)}
.chip.prop{border-style:dashed}
.chip.scope-equipo{background:var(--info-soft);border-color:var(--sel-line)}
.chip.lock{background:var(--surface-3)}
.chip.dirty{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-ink)}
.chip.err{background:var(--err-soft);border-color:var(--err-line);color:var(--err)}
.chip.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.chip.demo{background:var(--demo-soft);border-color:var(--demo-line);color:var(--demo)}
.chip.syn{background:var(--demo-soft);border-color:var(--demo-line);color:var(--demo)}
.mbody{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.banner{flex-shrink:0;margin:10px 16px 0;padding:8px 12px;border-radius:4px;border:1px solid var(--line-2);background:var(--surface);display:flex;gap:10px;align-items:flex-start}
.banner.lock{background:var(--surface-3)}
.banner.err{background:var(--err-soft);border-color:var(--err-line)}
.banner.ext{background:var(--demo-soft);border-color:var(--demo-line);border-style:dashed}
.banner .bt{flex:1}
.banner b{font-weight:600}

/* ---------- Partición lista / editor ---------- */
.split{flex:1;min-height:0;display:grid;grid-template-columns:var(--listw,45%) 7px minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
.split.stack{grid-template-columns:minmax(0,1fr);grid-template-rows:var(--listh,max(150px,38%)) 7px minmax(0,1fr)}
.gutter{background:var(--frame);cursor:col-resize;position:relative;border:0;padding:0}
.gutter::after{content:"";position:absolute;left:3px;top:0;bottom:0;width:1px;background:var(--line-2)}
.gutter:hover::after,.gutter:focus-visible::after{background:var(--accent);width:2px}
.split.stack .gutter{cursor:row-resize}
.split.stack .gutter::after{left:0;right:0;top:3px;bottom:auto;height:1px;width:auto}
.split.stack .gutter:hover::after{height:2px;width:auto}

.listp{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--surface)}
.ltools{flex-shrink:0;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line)}
.lsearch{position:relative;flex:1;min-width:160px;max-width:300px}
.lsearch input{width:100%;height:28px;border:1px solid var(--line-2);border-radius:4px;padding:0 26px 0 26px;background:var(--surface)}
.lsearch .ic{position:absolute;left:7px;top:7px;color:var(--faint)}
.lsearch .clr{position:absolute;right:2px;top:2px;width:24px;height:24px;border:0;background:transparent;cursor:pointer;color:var(--muted)}
.count{color:var(--muted);font-size:12px;white-space:nowrap}
.ltools .sp{flex:1}
.btn{height:28px;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);border-radius:4px;padding:0 10px;cursor:pointer;white-space:nowrap;color:var(--ink)}
.btn:hover:not(:disabled){border-color:var(--navy-2);background:var(--hover)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.btn.primary:hover:not(:disabled){background:var(--navy-2);border-color:var(--navy-2)}
.btn.danger{color:var(--err)}
.btn.danger:hover:not(:disabled){border-color:var(--err);background:var(--err-soft)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover:not(:disabled){border-color:var(--line-2)}
.btn.sm{height:24px;padding:0 8px;font-size:12px}
.iconbtn{width:28px;padding:0;justify-content:center}
.pfilter{flex-basis:100%;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12px;padding-top:2px}
.pfilter select{height:26px;border:1px solid var(--line-2);border-radius:4px;background:var(--surface);max-width:220px}
.pfilter .nt{color:var(--muted)}
.srcsel{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}

.tablewrap{flex:1;min-height:0;overflow:auto;position:relative}
table.grid{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums}
.grid th{position:sticky;top:0;z-index:1;background:var(--surface-3);text-align:left;font-weight:600;font-size:12px;height:28px;padding:0 8px;border-bottom:1px solid var(--line-2);white-space:nowrap;color:var(--ink)}
.grid th button{border:0;background:transparent;font:inherit;font-weight:600;cursor:pointer;padding:0;display:inline-flex;gap:4px;align-items:center;color:inherit}
.grid th.r,.grid td.r{text-align:right}
.grid th.c,.grid td.c{text-align:center}
.grid td{height:var(--row);padding:0 8px;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:0}
.grid tr{cursor:default}
.grid tbody tr:hover td{background:var(--hover)}
.grid tbody tr[aria-selected="true"] td{background:var(--sel)}
.grid tbody tr[aria-selected="true"] td:first-child{box-shadow:inset 3px 0 0 var(--navy-2)}
.grid td.mk{width:22px;padding:0 0 0 6px}
.grid .no{color:var(--faint)}
.grid .nul{color:var(--faint)}
.grid .inact td:not(.mk){color:var(--muted)}
.badge{display:inline-block;font-size:10.5px;padding:0 5px;border-radius:3px;line-height:16px;border:1px solid var(--line-2);color:var(--muted);vertical-align:1px}
.badge.syn{border-color:var(--demo-line);color:var(--demo);background:var(--demo-soft)}
.badge.new{border-color:var(--accent-line);color:var(--accent-ink);background:var(--accent-soft)}
.badge.fix{border-style:dashed}
.empty{padding:28px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty b{color:var(--ink);font-weight:600}

/* ---------- Editor ---------- */
.edp{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--surface);container-type:inline-size;container-name:ed}
.ehead{flex-shrink:0;display:flex;gap:10px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap;min-height:45px}
.ehead .et{flex:1;min-width:180px}
.ehead h2{font-size:14.5px;font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ehead .es{font-size:12px;color:var(--muted)}
.esum{flex-shrink:0;margin:10px 14px 0;padding:8px 12px;border:1px solid var(--err-line);background:var(--err-soft);border-radius:4px;color:var(--ink)}
.esum b{color:var(--err)}
.esum ul{margin:4px 0 0;padding-left:18px}
.esum a{color:var(--link);cursor:pointer;text-decoration:underline}
.tabs{flex-shrink:0;display:flex;flex-wrap:wrap;gap:2px;padding:6px 10px 0;border-bottom:1px solid var(--line)}
.tab{border:1px solid transparent;border-bottom:1px solid transparent;margin-bottom:-1px;background:transparent;padding:6px 10px 7px;border-radius:4px 4px 0 0;cursor:pointer;white-space:nowrap;display:inline-flex;gap:6px;align-items:center;color:var(--muted);position:relative}
.tab:hover{color:var(--ink);background:var(--hover)}
.tab[aria-selected="true"]{background:var(--surface);border-color:var(--line);border-bottom-color:var(--surface);color:var(--ink);font-weight:600}
.tab .n{font-size:11px;color:var(--faint);font-weight:400}
.tcnt{font-size:10.5px;line-height:15px;min-width:16px;padding:0 4px;border-radius:8px;text-align:center;font-weight:600}
.tcnt.d{background:var(--accent-soft);color:var(--accent-ink);border:1px solid var(--accent-line)}
.tcnt.e{background:var(--err);color:var(--surface)}
.escroll{flex:1;min-height:0;overflow:auto;padding:4px 14px 18px}
.sec{border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sech{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;padding:10px 0 8px;cursor:pointer;text-align:left;color:var(--ink)}
.sech .st{font-weight:600;font-size:13px}
.sech .sd{color:var(--muted);font-size:12px;flex:1;min-width:0}
.sech .chev{transition:transform .12s;color:var(--muted)}
.sec.closed .sech .chev{transform:rotate(-90deg)}
.sec.closed .secb{display:none}
.secb{padding:2px 0 12px}
.secplain .secb{padding-top:10px}
.gdesc{color:var(--muted);font-size:12px;margin:-2px 0 8px var(--lw);max-width:70ch}

/* Campos: etiqueta a la izquierda, control a su medida */
.f{display:grid;grid-template-columns:var(--lw) minmax(0,1fr);gap:4px 12px;align-items:start;padding:4px 0;border-radius:3px}
.fl{padding-top:5px;color:var(--ink);display:flex;gap:5px;align-items:flex-start;min-width:0;line-height:1.3}
.fl .lt{min-width:0;overflow-wrap:anywhere}
.fl .req{color:var(--err)}
.fl .cd{width:7px;height:7px;border-radius:50%;background:var(--accent);margin-top:5px;flex-shrink:0;display:none}
.f.changed .fl .cd{display:block}
.fc{min-width:0;display:flex;flex-direction:column;gap:3px}
.crow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.in{height:28px;border:1px solid var(--line-2);border-radius:3px;background:var(--surface);padding:0 7px;min-width:0;max-width:100%}
.in:hover:not(:disabled):not([readonly]){border-color:var(--faint)}
.in:focus{border-color:var(--navy-2);outline:2px solid var(--sel-line);outline-offset:0}
.f.invalid .in,.f.invalid .combo,.f.invalid .memo{border-color:var(--err);background:var(--err-soft)}
.in.num{text-align:right;font-variant-numeric:tabular-nums}
.in.code{font-family:var(--mono);letter-spacing:.02em}
.w-xs{width:64px}.w-s{width:118px}.w-n{width:118px}.w-m{width:240px}.w-ml{width:340px}.w-l{width:100%;max-width:560px}.w-path{width:100%;max-width:620px}
textarea.in{height:auto;padding:5px 7px;resize:vertical;line-height:1.4}
textarea.long{resize:none;overflow:hidden;width:100%;max-width:560px}
.memo{width:100%;max-width:720px;min-height:96px}
.memo.big{min-height:300px}
.unit{color:var(--muted);font-size:12.5px}
.fh{color:var(--muted);font-size:12px;max-width:72ch}
.fe{color:var(--err);font-size:12px;font-weight:600;display:none;max-width:72ch}
.f.invalid .fe{display:block}
.fw{color:var(--accent-ink);font-size:12px;display:none;max-width:72ch}
.fw.on{display:block}
.fnote{font-size:12px;color:var(--demo);max-width:72ch}
.cnt{font-size:11px;color:var(--faint)}
.pend{display:inline-flex;align-items:center;justify-content:center;font-size:10px;line-height:14px;padding:0 4px;border:1px dashed var(--line-2);border-radius:3px;color:var(--muted);flex-shrink:0;margin-top:1px;cursor:help}
.sens{display:inline-flex;font-size:10px;line-height:14px;padding:0 4px;border-radius:3px;background:var(--accent-soft);color:var(--accent-ink);flex-shrink:0;margin-top:1px}
.notx{font-size:11px;color:var(--demo);border:1px dashed var(--demo-line);border-radius:3px;padding:0 5px;line-height:16px}
.ro{min-height:28px;padding:5px 0;color:var(--ink);overflow-wrap:anywhere;white-space:pre-wrap}
.ro.nul{color:var(--faint)}
.ro.num{font-variant-numeric:tabular-nums}
.flash{animation:flash 1.8s ease-out}
@keyframes flash{0%,35%{background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent)}100%{background:transparent;box-shadow:0 0 0 0 transparent}}

/* casillas */
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:0 18px;margin-left:calc(var(--lw) + 12px)}
.bgrid .f{grid-template-columns:minmax(0,1fr);padding:2px 0}
.fb .chk{display:inline-flex;align-items:flex-start;gap:8px;min-height:28px;padding:5px 0 3px;cursor:pointer;line-height:1.3}
.fb .chk input{margin:1px 0 0;width:15px;height:15px;flex-shrink:0;accent-color:var(--navy-2)}
.fb .chk .cd{width:7px;height:7px;border-radius:50%;background:var(--accent);margin-top:4px;flex-shrink:0;visibility:hidden}
.fb.changed .chk .cd{visibility:visible}
.fb .fh,.fb .fe,.fb .fw{margin-left:23px}
.fb.ro .chk{cursor:default}
.tri{align-self:flex-start;display:inline-flex;border:1px solid var(--line-2);border-radius:3px;overflow:hidden}
.tri label{display:inline-flex;align-items:center;height:26px;padding:0 10px;cursor:pointer;border-left:1px solid var(--line-2)}
.tri label:first-child{border-left:0}
.tri input{position:absolute;opacity:0;pointer-events:none}
.tri input:checked+span{font-weight:600}
.tri label:has(input:checked){background:var(--sel)}
.tri label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:-2px}

/* referencia */
.combo{height:28px;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);border-radius:3px;background:var(--surface);padding:0 6px 0 8px;cursor:pointer;width:300px;max-width:100%;text-align:left}
.combo .cv{flex:1;min-width:0}
.combo .cc{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.combo:disabled{cursor:default;background:var(--surface-2)}
.pop{position:fixed;z-index:60;background:var(--surface);border:1px solid var(--line-2);border-radius:4px;box-shadow:var(--shadow);width:320px;max-width:calc(100vw - 32px);display:flex;flex-direction:column;max-height:320px}
.pop .ps{padding:6px;border-bottom:1px solid var(--line)}
.pop .ps input{width:100%}
.pop .pl{overflow:auto;padding:4px 0}
.opt{display:flex;gap:8px;align-items:center;width:100%;border:0;background:transparent;padding:6px 10px;text-align:left;cursor:pointer;color:var(--ink)}
.opt:hover,.opt.kb{background:var(--hover)}
.opt[aria-selected="true"]{font-weight:600}
.opt .cc{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.pop .pn{padding:10px;color:var(--muted)}

/* secreto */
.secret{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border:1px solid var(--line-2);border-radius:3px;padding:4px 6px 4px 10px;background:var(--surface-2);max-width:560px}
.secret .ss{flex:1;min-width:150px;display:flex;align-items:center;gap:6px}
.secret .ok{color:var(--ok)}
.secret .pendc{color:var(--accent-ink);font-weight:600}

/* auditoría */
.audit{margin-top:14px;padding-top:10px;border-top:1px dashed var(--line-2);display:flex;flex-wrap:wrap;gap:4px 22px;font-size:12px;color:var(--muted)}
.audit b{font-weight:600;color:var(--ink)}
.rel{margin-top:14px;border:1px dashed var(--demo-line);border-radius:4px;background:var(--surface-2)}
.rel .rh{display:flex;gap:8px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.rel .rh b{font-weight:600}
.rel table{width:100%;border-collapse:collapse;font-size:12.5px}
.rel td,.rel th{padding:4px 10px;border-bottom:1px solid var(--line);text-align:left}
.rel th{font-weight:600;color:var(--muted);font-size:11.5px}
.lnk{border:0;background:transparent;color:var(--link);cursor:pointer;padding:0;text-decoration:underline;font:inherit}

/* barra de acciones */
.abar{flex-shrink:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 14px;border-top:1px solid var(--line-2);background:var(--surface-2);min-height:46px}
.abar .msg{font-size:12.5px;display:flex;align-items:center;gap:8px;min-width:0}
.abar .msg.ok{color:var(--ok)}
.abar .msg.err{color:var(--err);font-weight:600}
.abar .chg{color:var(--accent-ink);font-weight:600}
.kbd{font-size:11px;color:var(--muted);font-weight:400}
.btn.primary .kbd{color:var(--on-navy-muted)}

/* carga / error */
.loading{flex:1;padding:16px;display:flex;flex-direction:column;gap:10px}
.sk{height:14px;border-radius:3px;background:linear-gradient(90deg,var(--surface-3),var(--line),var(--surface-3));background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
.bar{height:3px;background:var(--line);overflow:hidden;position:relative}
.bar::after{content:"";position:absolute;top:0;bottom:0;width:30%;background:var(--accent);animation:bar 1.1s ease-in-out infinite}
@keyframes bar{0%{left:-30%}100%{left:100%}}
.state{margin:16px;padding:14px 16px;border:1px solid var(--line-2);border-radius:4px;background:var(--surface);max-width:640px;display:flex;flex-direction:column;gap:8px}
.state.err{border-color:var(--err-line);background:var(--err-soft)}
.state h3{font-size:14px;font-weight:600}
.state .acts{display:flex;gap:8px;flex-wrap:wrap}

/* diálogo */
.ovl{position:absolute;inset:0;background:rgba(10,17,32,.45);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:var(--surface);border-radius:6px;box-shadow:var(--shadow);width:480px;max-width:100%;max-height:calc(100% - 32px);display:flex;flex-direction:column;border:1px solid var(--line-2)}
.dlg.wide{width:760px}
.dlg.xwide{width:980px}
.dlg .dh{padding:14px 18px 8px;display:flex;gap:10px;align-items:flex-start}
.dlg .dh h2{font-size:15px;font-weight:600;flex:1}
.dlg .db{padding:0 18px 12px;overflow:auto;display:flex;flex-direction:column;gap:8px}
.dlg .df{padding:10px 18px 14px;display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 6px 6px}
.dlg .df .sp{flex:1}
.dlg table{border-collapse:collapse;width:100%;font-size:12.5px}
.dlg td,.dlg th{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
.dlg th{font-weight:600;color:var(--muted);font-size:11.5px}
.dlg .ttl{font-weight:600}
.folders{border:1px solid var(--line-2);border-radius:3px;max-height:200px;overflow:auto}
.folders button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:6px 10px;cursor:pointer;font-family:var(--mono);font-size:12px;color:var(--ink)}
.folders button:hover,.folders button[aria-pressed="true"]{background:var(--sel)}

/* notas */
.notes{font-size:13px;line-height:1.5}
.notes h3{font-size:14px;font-weight:600;margin:14px 0 6px}
.notes h3:first-child{margin-top:0}
.notes p,.notes li{max-width:90ch}
.notes ul{margin:4px 0;padding-left:18px}
.notes .cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.notes .tw{overflow-x:auto}
.ntabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:0 -18px 10px;padding:0 18px}
.toast{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);background:var(--navy);color:var(--on-navy);padding:8px 14px;border-radius:4px;box-shadow:var(--shadow);z-index:90;font-size:12.5px;max-width:calc(100% - 32px)}

/* ---------- Adaptación a ancho ---------- */
@container frame (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .nav{position:absolute;z-index:40;top:0;bottom:0;left:0;width:280px;max-width:88%;box-shadow:var(--shadow);display:none}
  .frame.navopen .nav{display:flex}
  .navtoggle{display:inline-flex;align-items:center}
}
@container ed (max-width:560px){
  .f{grid-template-columns:minmax(0,1fr);gap:2px}
  .fl{padding-top:0}
  .bgrid{margin-left:0}
  .gdesc{margin-left:0}
}
@media (max-width:640px){.demo select{max-width:150px}.stage{padding:8px 16px}}

/* ---------- Números en formato español ---------- */
function fmtNum(v,f){
  if(v===null||v===undefined) return '';
  if(typeof v!=='number') return String(v);
  return v.toLocaleString('es-ES',{useGrouping:f&&f.grp===false?false:true,maximumFractionDigits:f&&f.int?0:6});
}
function parseNum(s,f){
  s=String(s).trim().replace(/\s/g,'');
  if(f.unit==='%') s=s.replace(/%$/,'');
  if(s==='') return {ok:true,v:null};
  let t=s;
  if(/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(t)) t=t.replace(/\./g,'').replace(',','.');
  else if(t.includes(',')){ if(t.includes('.')) return {ok:false,msg:'Usa la coma para los decimales, por ejemplo 75,5.'}; t=t.replace(',','.'); }
  if(!/^-?\d+(\.\d+)?$/.test(t)) return {ok:false,msg:f.int?'Escribe un número entero, por ejemplo 587.':'Escribe un número, por ejemplo 75,5.'};
  const v=Number(t);
  if(f.int&&!Number.isInteger(v)) return {ok:false,msg:'Este dato solo admite números enteros.'};
  if((f.min!=null&&v<f.min)||(f.max!=null&&v>f.max)) return {ok:false,msg:`Escribe un valor entre ${fmtNum(f.min,f)} y ${fmtNum(f.max,f)}: es lo que admite el almacenamiento de este dato.`};
  return {ok:true,v};
}
function fmtDT(v){ if(!v) return ''; const [d,t]=String(v).split('T'); const [y,m,dd]=d.split('-'); return `${dd}/${m}/${y}${t?' '+t.slice(0,5):''}`; }
function fixMoj(s){ if(typeof s!=='string'||!/[ÃÂ]/.test(s)) return null; try{ const r=decodeURIComponent(escape(s)); return r!==s?r:null; }catch(e){ return null; } }

// Tipos OLE DB → editor y límites de almacenamiento. Los límites no fijan el ancho visual.
const OLE={
  17:{ed:'int',int:true,min:0,max:255,store:'número de 0 a 255'},
  2:{ed:'int',int:true,min:-32768,max:32767,store:'entero corto'},
  3:{ed:'int',int:true,min:-2147483648,max:2147483647,store:'entero largo'},
  4:{ed:'dec',store:'real simple'},
  5:{ed:'dec',store:'real doble'},
  11:{ed:'bool',store:'sí/no'},
  7:{ed:'datetime',store:'fecha y hora'},
  130:{ed:'text',store:'texto'},
};
const PENDING='Significado pendiente de confirmar.';
function buildFields(table,spec){
  const sch=SCHEMA[table]; if(!sch) throw new Error('Sin esquema '+table);
  const byName=Object.fromEntries(sch.map(c=>[c[0],c]));
  const out=[];
  const names=Object.keys(spec);
  for(const n of names){
    const s=spec[n];
    if(s.virtual){ out.push(Object.assign({n,virtual:true,len:null,nul:true},s,{label:s.l})); continue; }
    const c=byName[n]; if(!c) throw new Error(`Campo ${table}.${n} no está en el esquema`);
    const [,t,len,nul]=c; const base=OLE[t]||{ed:'text'};
    const f=Object.assign({n,t,len,nul,table},base,s);
    f.label=s.l||n;
    if(t===130){ f.ed=s.ed||(len===0?'memo':'text'); f.max=null; f.min=null; f.maxLen=len>0?len:null; }
    if(t!==130&&s.ed&&!['int','dec','pct','bool','bool3','datetime','counter','ref','option','id'].includes(s.ed)) f.ed=s.ed;
    if(s.ed==='pct'){ f.unit='%'; }
    if(t===11&&nul) f.ed='bool3';
    if(s.pend){ f.help=(s.h?s.h+' ':'')+PENDING; f.pending=true; } else f.help=s.h||'';
    out.push(f);
  }
  const missing=sch.filter(c=>!spec[c[0]]).map(c=>c[0]);
  if(missing.length) console.warn('Campos sin asignar en',table,missing);
  return out;
}

function fillPartial(table,v,{notExtracted}={}){
  // Las filas reales solo traen algunas columnas: el resto queda "no extraído" (undefined).
  // Los ejemplos sintéticos son parciales: lo no indicado se trata como vacío (null) y los sí/no obligatorios como No.
  const o={};
  for(const [n,t,,nul] of SCHEMA[table]){
    if(n in v) o[n]=v[n];
    else if(notExtracted) o[n]=undefined;
    else o[n]=(t===11&&!nul)?false:null;
  }
  return o;
}

for(const p of PROVIDERS){
  if(p.spec) p.fields=buildFields(p.table,p.spec);
  else p.fields=p.fields.map(f=>Object.assign({},f,{help:f.h||'',label:f.label}));
  p.F=Object.fromEntries(p.fields.map(f=>[f.n,f]));
  for(const f of p.fields){ f.group=f.g; }
  p.layout=p.fields.filter(f=>!f.idf&&!f.audit).length>30?'tabs':(p.groups.length>1?'sections':'plain');
  p.physical=p.fields.filter(f=>!f.virtual).length;
  p.pl=PL[p.id]||p.title.toLowerCase();
}

/* ---------- Acceso a filas ---------- */
const P=()=>PBY[S.pid];
function allRows(p){
  if(p.id==='conceptos') return S.vol?DB.conceptos.concat(DB.conceptosVol):DB.conceptos;
  return DB[p.id]||[];
}
function rowsOf(p){
  if(S.scenario==='vacio'&&p.card==='list') return [];
  let r=allRows(p);
  if(p.byCompany) r=r.filter(x=>x.v.IdSociedad===S.ctx.emp);
  return r;
}
function findRec(p,k){ return allRows(p).find(r=>r.k===k)||(S.newRec&&S.newRec.k===k?S.newRec:null); }
function blankValues(p){
  const o={};
  for(const f of p.fields){ if(f.virtual) continue; o[f.n]=(f.ed==='bool')?false:null; }
  if(p.local) for(const f of p.fields) o[f.n]=null;
  return o;
}

/* ---------- Referencias (CargarOpciones) ---------- */
function refOptions(ref,d){
  if(ref==='soc') return DB.sociedades.map(r=>({v:r.v.IdSociedad,t:r.v.Nombre,c:r.v.IdSociedad}));
  if(ref==='ej'){
    let r=DB.ejercicios; const emp=d&&d.virt?d.virt._emp:null;
    if(emp) r=r.filter(x=>x.v.IdSociedad===emp);
    return r.map(x=>({v:x.v.IdSociedadEjercicio,t:x.v.Nombre||`${x.v.IdSociedad} ${x.v.Ejercicio}`,c:`${x.v.IdSociedad} · ${x.v.Ejercicio}`,emp:x.v.IdSociedad}));
  }
  return [];
}
function refText(ref,v){
  if(isEmpty(v)) return '';
  if(ref==='soc'){ const r=DB.sociedades.find(x=>x.v.IdSociedad===v); return r?r.v.Nombre:`Empresa ${v} (no encontrada)`; }
  if(ref==='ej'){ const r=DB.ejercicios.find(x=>x.v.IdSociedadEjercicio===v); return r?(r.v.Nombre||r.v.Ejercicio):`Ejercicio ${v} (no encontrado)`; }
  return String(v);
}
function ejEmp(id){ const r=DB.ejercicios.find(x=>x.v.IdSociedadEjercicio===id); return r?r.v.IdSociedad:null; }

/* ---------- Copia en memoria ---------- */
function makeDraft(p,r,isNew){
  const d={pid:p.id,k:r.k,ver:r.ver||0,rawBlur:{},isNew:!!isNew,src:r.src,orig:clone(r.v),cur:clone(r.v),aux:{cred:clone((r.aux&&r.aux.cred)||{}),op:{}},raw:{},virt:{},notice:{}};
  if(p.id==='series') d.virt._emp=ejEmp(d.cur.IdSociedadEjercicio)||(isNew?S.pf&&S.pf.emp||S.ctx.emp:null);
  return d;
}
function changes(d){
  if(!d) return [];
  const p=PBY[d.pid], out=[];
  for(const f of p.fields){
    if(f.virtual||f.idf||f.audit) continue;
    if(f.n in d.raw) { out.push({f,raw:true}); continue; }
    if(!same(d.orig[f.n],d.cur[f.n])) out.push({f,from:d.orig[f.n],to:d.cur[f.n]});
  }
  for(const n in d.aux.op) out.push({f:p.F[n],secret:d.aux.op[n]});
  return out;
}
function isDirty(){ const d=S.draft; return !!d&&(d.isNew||changes(d).length>0); }
function dispVal(f,v){
  if(v===undefined) return 'no extraído';
  if(v===null) return 'sin valor';
  if(v==='') return 'vacío';
  if(f.ed==='bool'||f.ed==='bool3') return v?'Sí':'No';
  if(f.ed==='ref') return refText(f.ref,v);
  if(typeof v==='number') return fmtNum(v,f)+(f.unit?` ${f.unit}`:'');
  if(f.ed==='datetime') return fmtDT(v);
  const s=String(v); return s.length>60?s.slice(0,57)+'…':s;
}

/* ---------- Validación (Validar del proveedor + reglas de metadatos) ---------- */
function lowerLabel(f){ return f.label.charAt(0).toLowerCase()+f.label.slice(1); }
function reqMsg(p,f){
  const fem=f.rq?/^la /.test(f.rq):(f.g2==='f'||/(ción|sión|dad|a)$/.test(f.label));
  const art=fem?'la':'el';
  const what=f.rq?`Falta ${f.rq} de ${p.this}.`:`Falta ${art} ${lowerLabel(f)} de ${p.this}.`;
  if(f.ed==='ref') return `${what} Elíge${fem?'la':'lo'} para poder guardar${p.lo}.`;
  if(['int','dec','pct'].includes(f.ed)) return `${what} Escribe un número; 0 también es un valor válido.`;
  if(f.ed==='path') return `${what} Escríbela o usa Examinar para poder guardar${p.lo}.`;
  return `${what} Escríbe${fem?'la':'lo'} para poder guardar${p.lo}.`;
}
function validate(p,d){
  const e={};
  for(const f of p.fields){
    if(f.virtual||f.idf||f.audit) continue;
    if(f.n in d.raw){ e[f.n]=d.raw[f.n].msg; continue; }
    const v=d.cur[f.n];
    if(f.req&&isEmpty(v)){ e[f.n]=reqMsg(p,f); continue; }
    if(f.maxLen&&typeof v==='string'&&v.length>f.maxLen){ e[f.n]=`Admite ${f.maxLen} caracteres como máximo; ahora tiene ${v.length}.`; continue; }
    if(f.uniq&&!isEmpty(v)&&rowsOf(p).some(r=>r.k!==d.k&&same(r.v[f.n],v))){ e[f.n]=`Ya existe ${p.g==='f'?'otra':'otro'} ${p.short} con este ${lowerLabel(f)} (${v}). Usa uno distinto.`; continue; }
  }
  if(p.id==='series'&&d.cur.RangoDesde!=null&&d.cur.RangoHasta!=null&&d.cur.RangoDesde>d.cur.RangoHasta&&!e.RangoHasta)
    e.RangoHasta='El número final es menor que el inicial. Corrige el rango (regla de demostración, pendiente de confirmar).';
  if(S.scenario==='validacion'&&p.id==='formaspago'&&isEmpty(d.cur.Descripcion)) e.Descripcion='Falta la descripción de esta forma de pago. Escríbela para poder guardarla.';
  return e;
}
function warnings(p,d){
  const w={};
  for(const f of p.fields){
    const v=d.cur[f.n];
    if(d.rawBlur&&d.rawBlur[f.n]&&d.raw[f.n]){ w[f.n]=d.raw[f.n].msg; continue; }
    if(f.warnEmpty&&isEmpty(v)) w[f.n]=f.warnEmpty;
    if(f.email&&!isEmpty(v)&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) w[f.n]='No parece una dirección de correo completa (aviso; no impide guardar).';
    if(f.sens&&d.orig[f.n]!==undefined&&!same(d.orig[f.n],v)) w[f.n]=f.sens+' Se pedirá confirmación al guardar.';
  }
  return w;
}

/* =====================================================================
   Renderizado común: navegación, cabecera, lista, editor y campos
   ===================================================================== */
function permOf(p){
  if(S.scenario==='sinAcceso'&&p.cat==='integraciones') return 'none';
  if(S.scenario==='lectura') return 'read';
  return p.perm||'edit';
}
function roAll(p,d){
  if(S.saving) return true;
  if(permOf(p)!=='edit') return true;
  if(d&&d.isNew) return !p.caps.create;
  return !p.caps.update;
}

/* ---------- Navegación ---------- */
function renderNav(){
  const body=$('#navbody');
  if(S.gq.trim()){ body.innerHTML=searchResultsHTML(S.gq); return; }
  body.innerHTML=CATS.map(c=>{
    const items=PROVIDERS.filter(p=>p.cat===c.id);
    const closed=S.closed['cat:'+c.id];
    return `<div class="cat${closed?' closed':''}"><button class="ch" data-act="cat" data-id="${c.id}" aria-expanded="${!closed}">${I.chev}${esc(c.t)}</button><div class="items">${items.map(p=>{
      const cur=p.id===S.pid, dirty=cur&&isDirty(), fail=S.failed[p.id];
      const locked=permOf(p)==='none'||p.protect||permOf(p)==='read';
      const kind=p.local?`<span title="Este equipo">${I.pc}</span>`:(p.card==='single'?`<span title="Registro único">${I.one}</span>`:`<span title="Colección">${I.list}</span>`);
      return `<button class="item" data-act="open" data-id="${p.id}" aria-current="${cur}"><span class="nm ell">${esc(p.title)}</span><span class="mk">${fail?'<span class="merr" title="El último guardado falló">▲</span>':''}${dirty?'<span class="mdot" title="Cambios sin guardar"></span>':''}${locked?`<span title="${permOf(p)==='none'?'Sin permiso':p.protect?'Catálogo protegido':'Solo consulta'}">${I.lock}</span>`:''}${kind}</span></button>`;
    }).join('')}</div></div>`;
  }).join('');
}

function headHTML(p){
  const sc=SCOPES[p.scope], cat=CATS.find(c=>c.id===p.cat);
  const chips=[];
  chips.push(`<span class="chip ${p.scope==='equipo'?'scope-equipo':''} ${p.scopeFact?'':'prop'}" title="${esc(sc.d)}${p.scopeFact?'':' Ámbito propuesto, pendiente de confirmar.'}">${p.scope==='equipo'?I.pc:''}Ámbito: ${esc(sc.t)}${p.scopeFact?'':' · propuesta'}</span>`);
  if(p.byCompany) chips.push(`<span class="chip">${esc(refText('soc',S.ctx.emp))}</span>`);
  if(p.protect) chips.push(`<span class="chip lock">${I.lock}Catálogo protegido</span>`);
  else if(permOf(p)==='read') chips.push(`<span class="chip lock">${I.eye}Solo consulta</span>`);
  return `<div class="tl"><div class="crumb"><button class="navtoggle" data-act="navtoggle" aria-label="Mostrar mantenimientos">${I.menu}</button>${esc(cat.t)} › ${p.card==='single'?'Registro único':'Colección'}</div>
    <h1>${esc(p.title)}</h1><p class="purpose">${esc(p.purpose)}</p></div>
    <div class="tr"><div class="chips">${chips.join('')}</div><div class="chips" id="statechip"></div></div>`;
}

/* ---------- Área principal ---------- */
function renderMain(opts={}){
  const p=P(), m=$('#main');
  if(!p){ m.innerHTML=''; return; }
  const perm=permOf(p);
  let body='';
  if(perm==='none'){
    body=`<div class="state err" role="alert"><h3>No tienes permiso para abrir «${esc(p.title)}»</h3><p>Tu perfil no incluye el acceso a Integraciones. Pide a un administrador que te lo conceda. Ocultar el contenido no sustituye a la comprobación del permiso: el mantenimiento tampoco devolvería datos.</p></div>`;
    m.innerHTML=`<header class="mhead">${headHTML(p)}</header><div class="mbody">${body}</div>`;
    updateStatus(); return;
  }
  if(S.scenario==='carga'){
    body=`<div class="bar" aria-hidden="true"></div><div class="state" role="status"><h3>Cargando ${esc(p.pl)}…</h3><p class="muted">Escenario de demostración: la carga no termina sola.</p><div class="acts"><button class="btn" data-act="endload">Terminar la carga</button></div></div><div class="loading" aria-hidden="true">${'<div class="sk" style="width:%"></div>'.repeat(7).replace(/%/g,()=>40+Math.round(Math.random()*50)+'%')}</div>`;
    m.innerHTML=`<header class="mhead">${headHTML(p)}</header><div class="mbody">${body}</div>`; updateStatus(); return;
  }
  if(S.scenario==='errorCarga'){
    body=`<div class="state err" role="alert"><h3>No se han podido cargar ${p.card==='single'?'los datos de':'los registros de'} «${esc(p.title)}»</h3><p>La base de datos no respondió en 30 segundos (simulado). No se ha modificado nada. Comprueba la conexión con la carpeta de datos y vuelve a intentarlo.</p><div class="acts"><button class="btn primary" data-act="retry">Reintentar</button><button class="btn" data-act="open" data-id="local">Revisar la ubicación de datos</button></div></div>`;
    m.innerHTML=`<header class="mhead">${headHTML(p)}</header><div class="mbody">${body}</div>`; updateStatus(); return;
  }
  const banners=[];
  if(p.protect) banners.push(`<div class="banner lock">${I.lock}<div class="bt"><b>${esc(p.protect)}</b> Puedes consultar y buscar. Las descripciones mal codificadas en la base se muestran corregidas y marcadas.</div></div>`);
  else if(perm==='read') banners.push(`<div class="banner lock">${I.eye}<div class="bt"><b>Solo consulta.</b> Tu perfil puede ver ${esc(p.pl)} pero no ${p.g==='f'?'modificarlas':'modificarlos'}${S.scenario==='lectura'?'':' (perfil de demostración para este catálogo)'}. Los botones se muestran desactivados; el mantenimiento rechazaría igualmente el guardado.</div></div>`);
  if(p.note) banners.push(`<div class="banner"><div class="bt muted">${esc(p.note)}</div></div>`);
  if(p.card==='single'){
    const r=rowsOf(p)[0];
    if(!r){
      body=`<div class="state"><h3>No hay ${esc(p.short)} para ${esc(refText('soc',S.ctx.emp))}</h3><p class="muted">Este mantenimiento es de registro único por empresa y el ejemplo de la demostración solo incluye la empresa A. El mantenimiento no ofrece altas desde aquí.</p></div>`;
      m.innerHTML=`<header class="mhead">${headHTML(p)}</header><div class="mbody">${banners.join('')}${body}</div>`; updateStatus(); return;
    }
    if(!S.draft||S.draft.pid!==p.id||S.draft.k!==r.k) S.draft=makeDraft(p,r,false);
    m.innerHTML=`<header class="mhead">${headHTML(p)}</header><div class="mbody">${banners.join('')}<div class="edp" id="edp" style="flex:1;min-height:0;margin-top:${banners.length?10:0}px;border-top:1px solid var(--line)">${editorHTML(p,S.draft)}</div>${abarHTML(p)}</div>`;
    afterEditor(p); updateStatus(); return;
  }
  // colección
  const mode=layoutMode(p);
  const lw=S.listw[p.id]||p.listw||'45%';
  m.innerHTML=`<header class="mhead">${headHTML(p)}</header><div class="mbody">${banners.join('')}
    <div class="split ${mode==='stack'?'stack':''}" id="split" style="--listw:${typeof lw==='number'?lw+'px':lw};--listh:${S.listh[p.id]||'max(150px,38%)'};${banners.length?'margin-top:10px;border-top:1px solid var(--line)':''}">
      <section class="listp" aria-label="Lista de ${esc(p.pl)}">${listToolsHTML(p)}<div class="tablewrap" id="tw" tabindex="0" aria-label="Registros. Usa las flechas para cambiar de registro.">${tableHTML(p)}</div></section>
      <button class="gutter" id="gutter" aria-label="Redimensionar lista y editor (flechas)" title="Arrastra para redimensionar"></button>
      <section class="edp" id="edp" aria-label="Editor del registro seleccionado">${S.draft?editorHTML(p,S.draft):emptyEditorHTML(p)}</section>
    </div>${abarHTML(p)}</div>`;
  if(S.draft) afterEditor(p);
  updateStatus();
  if(opts.scrollSel) scrollSelIntoView();
}
function layoutMode(p){
  const m=S.mode[p.id]; if(m) return m;
  const w=$('#main')?$('#main').clientWidth:1200;
  return w<760?'stack':'side';
}
function emptyEditorHTML(p){
  const rows=rowsOf(p);
  if(!rows.length) return `<div class="empty"><span>El editor se mostrará al seleccionar o crear un registro.</span></div>`;
  return `<div class="empty"><span>Selecciona un registro de la lista para verlo y editarlo.</span></div>`;
}

/* ---------- Lista ---------- */
function listToolsHTML(p){
  const ro=permOf(p)!=='edit'||!p.caps.create;

  const q=S.filter[p.id]||'';

      <label>Empresa <select id="pf-emp" data-act="pf"><option value="">Todas</option>${DB.sociedades.map(s=>`<option value="${esc(s.v.IdSociedad)}" ${pfv.emp===s.v.IdSociedad?'selected':''}>${esc(s.v.Nombre)}</option>`).join('')}</select></label>
      <label>Ejercicio <select id="pf-ej" data-act="pf"><option value="">Todos</option>${ejs.map(x=>`<option value="${x.v.IdSociedadEjercicio}" ${String(pfv.ej)===String(x.v.IdSociedadEjercicio)?'selected':''}>${esc(x.v.Nombre)}</option>`).join('')}</select></label>
      <span class="nt">Solo filtra esta lista; no cambia la empresa ni el ejercicio de trabajo.</span>${S.pfNote?`<span class="nt" style="color:var(--accent-ink)">${esc(S.pfNote)}</span>`:''}</div>`;
  }
  const vol=p.volume?`<label class="srcsel"><input type="checkbox" id="volchk" data-act="vol" ${S.vol?'checked':''}> Incluir 150 registros sintéticos de volumen</label>`:'';
  return `<div class="ltools">
    <div class="lsearch"><span class="ic">${I.search}</span><input id="lq" type="search" placeholder="Filtrar ${esc(p.pl)}" value="${esc(q)}" aria-label="Filtrar los registros de esta lista" autocomplete="off"><button class="clr" data-act="lqclear" aria-label="Limpiar filtro" ${q?'':'hidden'}>${I.x}</button></div>
    <span class="count" id="count"></span><span class="sp"></span>
    <button class="btn iconbtn" data-act="mode" title="${layoutMode(p)==='stack'?'Lista a la izquierda':'Lista arriba'}" aria-label="Cambiar disposición: ${layoutMode(p)==='stack'?'lista a la izquierda':'lista arriba'}">${layoutMode(p)==='stack'?I.side:I.stack}</button>
    <button class="btn" data-act="new" ${ro?'disabled':''} title="${esc(why)}">+ Nuevo</button>
    ${vol}${pf}</div>`;
}
function visibleRows(p){
  let rows=rowsOf(p).slice();
  if(p.parentFilter&&S.pf){
    if(S.pf.ej) rows=rows.filter(r=>String(r.v.IdSociedadEjercicio)===String(S.pf.ej));
    else if(S.pf.emp) rows=rows.filter(r=>ejEmp(r.v.IdSociedadEjercicio)===S.pf.emp);
  }
  const q=norm(S.filter[p.id]||'').trim();
  if(q){ const terms=q.split(/\s+/); rows=rows.filter(r=>{ const hay=norm(p.cols.map(c=>cellText(p,c,r.v,r)).join(' ')+' '+(r.v[p.key]??'')); return terms.every(t=>hay.includes(t)); }); }
  const so=S.sort[p.id];
  if(so){ const c=p.cols.find(c=>c.n===so.n); rows.sort((a,b)=>{ let x=a.v[so.n],y=b.v[so.n]; if(c&&c.fmt){x=c.fmt(x);y=c.fmt(y);} if(x==null) return 1; if(y==null) return -1; return (typeof x==='number'&&typeof y==='number'?x-y:String(x).localeCompare(String(y),'es',{numeric:true}))*so.dir; }); }
  return rows;
}
function cellText(p,c,v,r){
  if(c.src) return r?srcLabel(r.src):'';
  const x=v[c.n];
  if(c.fmt) return c.fmt(x);
  if(c.moj) return fixMoj(x)||x||'';
  if(c.b) return x===undefined?'?':x?'Sí':'No';
  if(c.memo) return x?String(x).split('\n')[0]:'';
  if(typeof x==='number') return fmtNum(x,{grp:c.grp})+(c.unit?' '+c.unit:'');
  return x==null?'':String(x);
}
function srcLabel(s){ return {real:'Muestra real',syn:'Sintético',copia:'Copia demo',vol:'Volumen',alta:'Alta en la demo'}[s]||s; }
function cellHTML(p,c,v,r){
  const x=v[c.n];
  if(c.src) return r.src==='real'?'<span class="muted">Muestra real</span>':`<span class="badge syn">${srcLabel(r.src)}</span>`;
  if(c.b){ if(x===undefined) return '<span class="nul" title="No extraído">?</span>'; return x?'<span title="Sí">Sí</span>':'<span class="no">No</span>'; }
  if(c.memo){ if(x===undefined) return '<span class="nul">no extraído</span>'; if(x===null) return '<span class="nul">—</span>'; if(x==='') return '<span class="nul">vacía</span>'; return `<span title="${esc(String(x).slice(0,400))}">${esc(String(x).split('\n')[0])}</span>`; }
  if(c.moj){ const fx=fixMoj(x); return fx?`<span title="Texto corregido para mostrar. Original: ${esc(x)}">${esc(fx)}</span> <span class="badge fix">corregido</span>`:esc(x??''); }
  if(c.fmt){ const t=c.fmt(x); return t?`<span title="${esc(t)}">${esc(t)}</span>`:'<span class="nul">—</span>'; }
  if(x===undefined) return '<span class="nul">no extraído</span>';
  if(x===null) return '<span class="nul" title="Sin valor">—</span>';
  if(typeof x==='number') return esc(fmtNum(x,{grp:c.grp}))+(c.unit?'&nbsp;'+c.unit:'');
  return `<span title="${esc(x)}">${esc(x)}</span>`;
}
function tableHTML(p){
  const all=rowsOf(p), rows=visibleRows(p), q=S.filter[p.id]||'';
  const so=S.sort[p.id]||{};
  const head=`<thead><tr><th class="mk" aria-label="Estado"></th>${p.cols.map(c=>`<th class="${c.r?'r':''} ${c.b?'c':''}" style="${c.w?'width:'+c.w+'px':''}" aria-sort="${so.n===c.n?(so.dir>0?'ascending':'descending'):'none'}"><button data-act="sort" data-n="${c.n}">${esc(c.h)}${so.n===c.n?(so.dir>0?I.up:I.down):''}</button></th>`).join('')}</tr></thead>`;
  let body='';
  const nr=S.newRec&&S.newRec.pid===p.id?S.newRec:null;
  if(nr){ const v=S.draft&&S.draft.k===nr.k?S.draft.cur:nr.v; body+=rowHTML(p,nr,v,true); }
  body+=rows.map(r=>rowHTML(p,r,S.draft&&S.draft.k===r.k?S.draft.cur:r.v,false)).join('');
  let empty='';
  if(!all.length&&!nr){
    const canNew=p.caps.create&&permOf(p)==='edit';
    empty=`<div class="empty"><b>Todavía no hay ${esc(p.pl)}.</b><span>${canNew?`Crea ${p.g==='f'?'la primera':'el primero'} con Nuevo.`:'Este catálogo no admite altas desde aquí.'}</span>${canNew?'<button class="btn primary" data-act="new">+ Nuevo</button>':''}</div>`;
  } else if(!rows.length&&!nr){
    const why=q?`con «${esc(q)}»`:'en la empresa o el ejercicio elegidos';
    empty=`<div class="empty"><b>Ninguna fila coincide ${why}.</b><span>Hay ${all.length} ${esc(plural(all.length,p.short,p.pl))} en total.</span>${q?'<button class="btn" data-act="lqclear">Limpiar filtro</button>':'<button class="btn" data-act="pfclear">Quitar el filtro de empresa y ejercicio</button>'}</div>`;
  }
  const minw=p.cols.reduce((a,c)=>a+(c.w||200),22);
  return `<table class="grid" role="grid" aria-rowcount="${rows.length}" style="min-width:${minw}px">${head}<tbody id="tb">${body}</tbody></table>${empty}`;
}
function rowHTML(p,r,v,isNew){
  const sel=S.sel===r.k;
  const dirty=sel&&isDirty(), err=sel&&S.showErr&&Object.keys(S.errors).length;
  const inact=(('Activo' in v)&&v.Activo===false)||(('Activa' in v)&&v.Activa===false);
  return `<tr data-k="${r.k}" aria-selected="${sel}" class="${inact?'inact':''}"><td class="mk">${err?'<span class="merr" title="Datos por revisar">▲</span>':dirty?'<span class="mdot" title="Cambios sin guardar"></span>':''}${isNew?'<span class="badge new">Nuevo</span>':''}</td>${p.cols.map(c=>`<td class="${c.r?'r':''} ${c.b?'c':''} ${c.mono?'mono':''}">${cellHTML(p,c,v,r)}</td>`).join('')}</tr>`;
}
function refreshTable(){ const p=P(); const tw=$('#tw'); if(!tw) return; const st=tw.scrollTop; tw.innerHTML=tableHTML(p); tw.scrollTop=st; updateCount(); }
function refreshSelRow(){
  const p=P(); if(!p||p.card!=='list'||!S.draft) return;
  const tr=$(`#tb tr[data-k="${S.draft.k}"]`); if(!tr) return;
  const r=findRec(p,S.draft.k); if(!r) return;
  const tmp=document.createElement('tbody'); tmp.innerHTML=rowHTML(p,r,S.draft.cur,S.draft.isNew); tr.replaceWith(tmp.firstElementChild);
}
function updateCount(){
  const p=P(); const c=$('#count'); if(!c||!p) return;
  const all=rowsOf(p).length, vis=visibleRows(p).length, n=S.newRec?1:0;
  const name=plural(all,p.short,p.pl);
  const extra=p.volume&&S.vol?` · ${DB.conceptosVol.length} sintéticos`:'';
  c.textContent=(vis===all?`${all} ${name}`:`${vis} de ${all} ${name}`)+extra+(n?' · 1 nuevo sin guardar':'');
}
function scrollSelIntoView(){ const tr=$(`#tb tr[aria-selected="true"]`); if(tr) tr.scrollIntoView({block:'nearest'}); }

/* ---------- Editor ---------- */
function editorHTML(p,d){
  const ro=roAll(p,d);
  const r=findRec(p,d.k)||{};
  const chips=[];
  if(d.isNew) chips.push('<span class="badge new">Nuevo, sin guardar</span>');
  if(r.src&&r.src!=='real'&&!d.isNew) chips.push(`<span class="badge syn" title="Registro inventado para la demostración, no procede de la base">${srcLabel(r.src)}</span>`);
  else if(r.src==='real') chips.push('<span class="badge" title="Valores tal como están en la base de pruebas">Muestra real</span>');
  const canDel=p.caps.delete&&permOf(p)==='edit'&&!d.isNew;
  const delWhy=!p.caps.delete?'El mantenimiento no admite bajas':permOf(p)!=='edit'?'Tu perfil no permite eliminar':d.isNew?'Aún no está guardado: usa Cancelar cambios para descartarlo':'';
  const head=p.card==='list'?`<div class="ehead"><div class="et"><h2><span class="ell">${esc(d.isNew?(p.newTitle||'Nuevo registro'):p.recTitle(d.orig))}</span>${chips.join('')}</h2><div class="es">${esc(p.recSub(d.cur))}</div></div>
     ${p.caps.delete||p.card==='list'?`<button class="btn danger" data-act="del" ${canDel?'':'disabled'} title="${esc(delWhy)}">Eliminar…</button>`:''}</div>`:'';
  const errs=S.showErr?Object.keys(S.errors):[];
  const sum=`<div class="esum" id="esum" role="alert" ${errs.length?'':'hidden'}></div>`;
  const gs=p.groups.filter(g=>p.fields.some(f=>f.group===g.id));
  let content='';
  if(p.layout==='tabs'){
    const act=S.tab[p.id]&&gs.some(g=>g.id===S.tab[p.id])?S.tab[p.id]:gs[0].id;
    S.tab[p.id]=act;
    content=`<div class="tabs" role="tablist">${gs.map(g=>`<button class="tab" role="tab" id="tab-${g.id}" aria-selected="${g.id===act}" aria-controls="pn-${g.id}" data-act="tab" data-g="${g.id}">${esc(g.t)} <span class="n">${p.fields.filter(f=>f.group===g.id).length}</span><span class="tcnt d" data-gd="${g.id}" hidden></span><span class="tcnt e" data-ge="${g.id}" hidden></span></button>`).join('')}</div>
      <div class="escroll" id="escroll">${gs.map(g=>`<div class="secplain" role="tabpanel" id="pn-${g.id}" aria-labelledby="tab-${g.id}" ${g.id===act?'':'hidden'}><div class="secb">${groupBody(p,g,d,ro)}</div></div>`).join('')}${relatedHTML(p,d)}${auditHTML(p,d)}</div>`;
  } else if(p.layout==='sections'){
    content=`<div class="escroll" id="escroll">${gs.map(g=>{ const cl=S.closed[p.id+':'+g.id]; return `<div class="sec${cl?' closed':''}" data-sec="${g.id}"><button class="sech" data-act="sec" data-g="${g.id}" aria-expanded="${!cl}">${I.chev}<span class="st">${esc(g.t)}</span><span class="tcnt d" data-gd="${g.id}" hidden></span><span class="tcnt e" data-ge="${g.id}" hidden></span><span class="sd ell">${esc(g.d||'')}</span></button><div class="secb">${groupBody(p,g,d,ro,true)}</div></div>`; }).join('')}${relatedHTML(p,d)}${auditHTML(p,d)}</div>`;
  } else {
    content=`<div class="escroll" id="escroll"><div class="secplain"><div class="secb">${gs.map(g=>groupBody(p,g,d,ro)).join('')}</div></div>${relatedHTML(p,d)}${auditHTML(p,d)}</div>`;
  }
  return head+sum+content;
}
function groupBody(p,g,d,ro,noDesc){
  const fs=p.fields.filter(f=>f.group===g.id);
  let h='';
  if(g.d&&!noDesc) h+=`<p class="gdesc">${esc(g.d)}</p>`;
  if(fs.some(f=>f.pending)) h+=`<p class="gdesc">Los datos marcados con <span class="pend" style="cursor:default">?</span> tienen significado pendiente de confirmar.</p>`;
  let bools=[];
  const flush=()=>{ if(bools.length){ h+=`<div class="bgrid">${bools.join('')}</div>`; bools=[]; } };
  for(const f of fs){
    if(f.ed==='bool'){ bools.push(fieldHTML(p,f,d,ro)); continue; }
    flush(); h+=fieldHTML(p,f,d,ro);
  }
  flush();
  return h;
}
function isChanged(d,f){ return (f.n in d.raw)||(!f.virtual&&!same(d.orig[f.n],d.cur[f.n]))||!!d.aux.op[f.n]; }
function fieldHTML(p,f,d,ro){
  const v=f.virtual?d.virt[f.n]:d.cur[f.n];
  const id='in-'+f.n;
  const intrinsic=f.ro||(f.keyNew&&!d.isNew)||f.ed==='counter';
  const dis=ro||intrinsic;
  const cls=['f']; if(f.ed==='bool') cls.push('fb'); if(dis) cls.push('ro'); if(isChanged(d,f)) cls.push('changed'); if(S.showErr&&S.errors[f.n]) cls.push('invalid');
  const pend=f.pending?`<span class="pend" title="${esc(PENDING)}" aria-label="${esc(PENDING)}">?</span>`:'';
  const sens=f.sens?`<span class="sens" title="${esc(f.sens)}">Sensible</span>`:'';
  const notx=v===undefined&&!f.virtual?'<span class="notx" title="La muestra solo incluye 8 de las 64 columnas">No extraído</span>':'';
  const help=f.help&&!f.pending?f.help:(f.pending&&f.h?f.h:'');
  const tail=`${help?`<div class="fh" id="h-${esc(f.n)}">${esc(help)}</div>`:''}<div class="fw" data-w="${esc(f.n)}"></div><div class="fe" id="e-${esc(f.n)}" role="alert">${esc(S.showErr&&S.errors[f.n]||'')}</div>`;
  const desc=`aria-describedby="h-${esc(f.n)} e-${esc(f.n)}"`;
  if(f.ed==='bool'){
    return `<div class="${cls.join(' ')}" data-f="${esc(f.n)}"><div class="fc"><label class="chk"><input type="checkbox" id="${id}" data-ed="bool" ${v?'checked':''} ${v===undefined?'data-indet="1"':''} ${dis?'disabled':''} ${desc}><span class="cd"></span><span>${esc(f.label)}</span>${pend}${sens}${notx}</label>${tail}</div></div>`;
  }
  const req=f.req&&!dis?'<span class="req" aria-hidden="true"> *</span>':'';
  const lab=`<label class="fl" for="${id}"><span class="cd"></span><span class="lt">${esc(f.label)}${req}</span>${pend}${sens}</label>`;
  let ctl='';
  const w=f.w||'m';
  switch(f.ed){
    case 'text': case 'textl': {
      if(intrinsic){ ctl=roText(f,v); break; }
      if(f.moj&&fixMoj(v)&&dis){ ctl=mojHTML(f,v); break; }
      const ph=v===null?(['xs','s'].includes(w)?'—':'Sin valor'):'';
      if(f.ed==='textl') ctl=`<textarea class="in long" rows="1" id="${id}" data-ed="textl" ${f.maxLen?`maxlength="${f.maxLen}"`:''} ${dis?'readonly':''} placeholder="${ph}" ${desc}>${esc(v??'')}</textarea>${cntHTML(f,v)}`;
      else ctl=`<div class="crow"><input class="in w-${w} ${f.code?'code':''}" id="${id}" data-ed="text" type="text" ${f.maxLen?`maxlength="${f.maxLen}"`:''} value="${esc(v??'')}" ${dis?'readonly':''} placeholder="${ph}" autocomplete="off" ${desc}>${notx}${cntHTML(f,v)}</div>`;
      break; }
    case 'memo': {
      if(v===undefined&&dis){ ctl='<div class="ro nul">No extraído</div>'; break; }
      const lines=v?String(v).split('\n').length:0;

/* ---------- Estado visible (cambios, errores) sin reconstruir controles ---------- */
function updateStatus(){
  const p=P(); if(!p) return;
  const d=S.draft&&S.draft.pid===p.id?S.draft:null;
  const sc=$('#statechip');
  if(sc){
    const dirty=isDirty(); const ne=S.showErr?Object.keys(S.errors).length:0;
    let h='';
    if(S.failed[p.id]) h+=`<span class="chip err">${I.warn}Último guardado fallido</span>`;
    if(ne) h+=`<span class="chip err">${ne} ${plural(ne,'dato','datos')} por revisar</span>`;
    if(dirty) h+=`<span class="chip dirty"><span class="mdot"></span>${d.isNew?'Alta sin guardar':'Cambios sin guardar'}</span>`;
    else if(S.msg&&S.msg.k==='ok') h+=`<span class="chip ok">${I.check}Guardado</span>`;
    else if(permOf(p)!=='none'&&S.scenario!=='carga'&&S.scenario!=='errorCarga') h+=`<span class="chip">Sin cambios pendientes</span>`;
    sc.innerHTML=h;
  }
  if(d){
    const ed=$('#edp');
    if(ed){
      for(const el of $$('.f[data-f]',ed)){ const f=p.F[el.dataset.f]; if(!f) continue; el.classList.toggle('changed',isChanged(d,f)); const bad=S.showErr&&!!S.errors[f.n]; el.classList.toggle('invalid',bad); const e=$('.fe',el); if(e) e.textContent=bad?S.errors[f.n]:''; }
      const w=warnings(p,d);
      for(const el of $$('.fw',ed)){ const n=el.dataset.w; const t=d.notice[n]||w[n]||''; el.textContent=t; el.classList.toggle('on',!!t); }
      for(const g of p.groups){
        const fs=p.fields.filter(f=>f.group===g.id);
        const nd=fs.filter(f=>isChanged(d,f)).length, ne=S.showErr?fs.filter(f=>S.errors[f.n]).length:0;
        const bd=$(`[data-gd="${g.id}"]`,ed), be=$(`[data-ge="${g.id}"]`,ed);
        if(bd){ bd.hidden=!nd; bd.textContent=nd; bd.title=`${nd} ${plural(nd,'cambio','cambios')}`; }
        if(be){ be.hidden=!ne; be.textContent=ne; be.title=`${ne} ${plural(ne,'error','errores')}`; }
      }
      const sum=$('#esum',ed);
      if(sum){
        const es=S.showErr?p.fields.filter(f=>S.errors[f.n]):[];
        sum.hidden=!es.length;
        if(es.length) sum.innerHTML=`<b>No se ha guardado. ${es.length===1?'Hay un dato por revisar':`Hay ${es.length} datos por revisar`}.</b> <a data-act="firsterr" tabindex="0">Ir al primero</a><ul>${es.map(f=>`<li><a data-act="goerr" data-n="${esc(f.n)}" tabindex="0">${esc(f.label)}</a>${p.layout!=='plain'?` <span class="muted">(${esc(p.groups.find(g=>g.id===f.group).t)})</span>`:''}: ${esc(S.errors[f.n])}</li>`).join('')}</ul>`;
      }
    }
  }
  updateAbar(); refreshSelRow(); updateCount();
  // marcadores de la navegación
  for(const it of $$('#navbody .item')){ const pid=it.dataset.id; const mk=$('.mk',it); if(!mk) continue; const dot=$('.mdot',mk); const want=pid===S.pid&&isDirty(); if(want&&!dot) mk.insertAdjacentHTML('afterbegin','<span class="mdot" title="Cambios sin guardar"></span>'); if(!want&&dot) dot.remove(); const er=$('.merr',mk); if(S.failed[pid]&&!er) mk.insertAdjacentHTML('afterbegin','<span class="merr" title="El último guardado falló">▲</span>'); if(!S.failed[pid]&&er) er.remove(); }
}

function frameEl(){ return $('#frame'); }

/* ---------- Diálogos propios (sin alert/confirm) ---------- */
function dialog({title,body,buttons,size,host,onOpen}){
  return new Promise(res=>{
    const layer=host==='page'?$('#layer'):frameEl();
    const prev=document.activeElement;
    const ov=document.createElement('div'); ov.className='ovl'; if(host==='page') ov.style.position='fixed';
    ov.innerHTML=`<div class="dlg ${size||''}" role="dialog" aria-modal="true" aria-labelledby="dlg-t"><div class="dh"><h2 id="dlg-t">${title}</h2></div><div class="db">${body}</div><div class="df">${buttons.map((b,i)=>b.sp?'<span class="sp"></span>':`<button class="btn ${b.cls||''}" data-v="${b.v}" ${b.dis?'disabled':''}>${b.t}</button>`).join('')}</div></div>`;
    layer.appendChild(ov);
    const close=v=>{ ov.remove(); document.removeEventListener('keydown',kd,true); if(prev&&prev.focus&&document.contains(prev)) prev.focus(); res(v); };
    const kd=e=>{ if(e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); const esc=buttons.find(b=>b.esc); close(esc?esc.v:null); }
      if(e.key==='Tab'){ const fs=$$('button:not([disabled]),input,select,textarea,[tabindex="0"]',ov).filter(x=>!x.hidden&&x.offsetParent!==null); if(!fs.length) return; const i=fs.indexOf(document.activeElement); if(e.shiftKey&&i<=0){e.preventDefault();fs[fs.length-1].focus();} else if(!e.shiftKey&&i===fs.length-1){e.preventDefault();fs[0].focus();} } };
    document.addEventListener('keydown',kd,true);
    ov.addEventListener('click',e=>{ const b=e.target.closest('.df button[data-v]'); if(b){ const spec=buttons.find(x=>String(x.v)===b.dataset.v); if(spec&&spec.check&&!spec.check(ov)) return; close(b.dataset.v); } });
    const api={ov,close};
    if(onOpen) onOpen(api);
    const af=$('[autofocus]',ov)||$('.df .btn.primary',ov)||$('.df .btn',ov); if(af) af.focus();
  });
}
function changesTable(ch){

/* ---------- Protección de cambios pendientes ---------- */
async function guard(what){
  if(!isDirty()) return true;
  const d=S.draft, p=PBY[d.pid], ch=changes(d);
  const name=d.isNew?(p.newTitle||'registro nuevo'):p.recTitle(d.orig);
  const v=await dialog({title:`¿Guardar los cambios de «${esc(name)}»?`,
    body:`<p>Vas a ${esc(what)}. ${d.isNew?`${p.newTitle||'El registro nuevo'} aún no está guardad${p.lo==='la'?'a':'o'}.`:`Hay ${ch.length} ${plural(ch.length,'cambio','cambios')} sin guardar en ${esc(p.this)}.`}</p>${changesTable(ch)}`,
    buttons:[{t:'Guardar cambios',v:'save',cls:'primary'},{t:'Descartar cambios',v:'discard'},{sp:1},{t:'Seguir editando',v:'stay',esc:true}]});
  if(v==='save') return await save();
  if(v==='discard'){ discard(); return true; }
  return false;
}
function discard(){
  const d=S.draft; if(!d) return; const p=PBY[d.pid];
  if(d.isNew){ S.newRec=null; S.sel=S.prevSel||null; const r=S.sel&&findRec(p,S.sel); S.draft=r?makeDraft(p,r,false):null; }
  else { const r=findRec(p,d.k); S.draft=r?makeDraft(p,r,false):null; }
  S.errors={}; S.showErr=false; S.msg=null;
}

const DEFAULTS={iva:{Activo:true},conceptos:{Activo:true},formaspago:{Activa:true},correo:{Activo:false},ejercicios:{Activa:true}};
async function newRecord(){
  const p=P(); if(!p.caps.create||permOf(p)!=='edit') return;

  for(const p of PROVIDERS){
    if(hit(p.title+' '+(p.al||[]).join(' ')+' '+CATS.find(c=>c.id===p.cat).t)) m.push({p,score:norm(p.title).startsWith(terms[0])?0:1});
    for(const g of p.groups){ if(p.groups.length>1&&hit(g.t)) f.push({p,g,score:2}); }
    for(const fl of p.fields){
      if(fl.virtual) continue;
      const byLabel=hit(fl.label+' '+(fl.al||[]).join(' ')), byName=!byLabel&&hit(fl.n);
      if(byLabel||byName) f.push({p,fl,byName,score:norm(fl.label).startsWith(terms[0])?0:1});
    }
    if(p.card==='list'&&permOf(p)!=='none'){
      const rows=allRows(p).filter(x=>hit(p.cols.map(c=>cellText(p,c,x.v,x)).join(' ')));
      if(rows.length) r.push({p,n:rows.length});
    }
  }
  m.sort((a,b)=>a.score-b.score); f.sort((a,b)=>a.score-b.score);
  return {m,f:f.slice(0,40),r,terms};
}

  if(S.frame.size==='fit'){ W=st.clientWidth-32; H=st.clientHeight-24; }
  else { [W,H]=S.frame.size.split('x').map(Number); W=W-(W>=1400?236:56); H=H-100; /* área de trabajo: se restan el lateral (236 px desplegado, 56 px plegado bajo 1400) y cabecera, pestañas y barra de estado del contenedor (100 px) */ }
  const cap=$('#areacap'); if(cap) cap.textContent=S.frame.size==='fit'?'':`Área de trabajo ${Math.round(W)} × ${Math.round(H)} px${s!==1?` · ${Math.round(W/s)} × ${Math.round(H/s)} lógicos`:''}`;
  fr.style.zoom=s; fr.style.width=Math.max(320,W)/s+'px'; fr.style.height=Math.max(360,H)/s+'px';
  fr.classList.toggle('fixed',S.frame.size!=='fit');
  const p=P(); if(p&&p.card==='list'&&!S.mode[p.id]){ const sp=$('#split'); if(sp){ const want=layoutMode(p)==='stack'; if(sp.classList.contains('stack')!==want){ sp.classList.toggle('stack',want); const b=$('[data-act="mode"]'); if(b) b.innerHTML=want?I.side:I.stack; } } }
}

/* =====================================================================
   Eventos
   ===================================================================== */
function startDrag(e){
  const sp=$('#split'), p=P(); if(!sp) return; e.preventDefault();
  const g=$('#gutter'); g.setPointerCapture(e.pointerId);
  const stack=sp.classList.contains('stack'), s=scale();
  const mv=ev=>{ const r=sp.getBoundingClientRect();
    if(stack){ const h=Math.min(Math.max((ev.clientY-r.top)/s,110),r.height/s-160); sp.style.setProperty('--listh',h+'px'); S.listh[p.id]=h+'px'; }
    else { const w=Math.min(Math.max((ev.clientX-r.left)/s,240),r.width/s-300); sp.style.setProperty('--listw',w+'px'); S.listw[p.id]=w; } };
  const up=()=>{ g.removeEventListener('pointermove',mv); g.removeEventListener('pointerup',up); };
  g.addEventListener('pointermove',mv); g.addEventListener('pointerup',up);
}
function nudgeSplit(dx){
  const sp=$('#split'), p=P(); if(!sp) return; const s=scale(); const r=sp.getBoundingClientRect();
  if(sp.classList.contains('stack')){ const cur=$('.listp',sp).getBoundingClientRect().height/s; const h=Math.min(Math.max(cur+dx,110),r.height/s-160); sp.style.setProperty('--listh',h+'px'); S.listh[p.id]=h+'px'; }
  else { const cur=$('.listp',sp).getBoundingClientRect().width/s; const w=Math.min(Math.max(cur+dx,240),r.width/s-300); sp.style.setProperty('--listw',w+'px'); S.listw[p.id]=w; }
}
async function moveSel(dir){
  const p=P(); const rows=visibleRows(p); if(!rows.length) return;
  let i=rows.findIndex(r=>r.k===S.sel); i=i<0?0:Math.min(rows.length-1,Math.max(0,i+dir));
  await selectRecord(rows[i].k); const tw=$('#tw'); if(tw) tw.focus();
}
document.addEventListener('click',async e=>{
  const tr=e.target.closest('#tb tr[data-k]'); if(tr&&!e.target.closest('button')){ selectRecord(tr.dataset.k); return; }
  const a=e.target.closest('[data-act]'); if(!a) return;
  const act=a.dataset.act;
  switch(act){
    case 'open': openProvider(a.dataset.id); break;
    case 'cat': { const k='cat:'+a.dataset.id; S.closed[k]=!S.closed[k]; renderNav(); break; }
    case 'navtoggle': S.navOpen=!S.navOpen; frameEl().classList.toggle('navopen',S.navOpen); if(S.navOpen) $('#gq').focus(); break;
    case 'gores': activateResult(a); break;
    case 'sort': { const p=P(); const so=S.sort[p.id]; S.sort[p.id]=so&&so.n===a.dataset.n?{n:so.n,dir:-so.dir}:{n:a.dataset.n,dir:1}; refreshTable(); break; }
    case 'new': newRecord(); break;
    case 'del': deleteRecord(); break;
    case 'save': save(); break;
    case 'cancel': cancelChanges(); break;
    case 'showchg': dialog({title:'Cambios sin guardar',body:changesTable(changes(S.draft)),buttons:[{t:'Cerrar',v:'x',cls:'primary',esc:true}],size:'wide'}); break;
    case 'lqclear': { const p=P(); S.filter[p.id]=''; const lq=$('#lq'); if(lq){ lq.value=''; lq.focus(); } $('[data-act="lqclear"]').hidden=true; refreshTable(); break; }
    case 'pfclear': { const ok=await guard('quitar el filtro'); if(!ok) return; S.pf={emp:'',ej:''}; renderMain(); break; }
    case 'mode': { const p=P(); S.mode[p.id]=layoutMode(p)==='stack'?'side':'stack'; renderMain(); break; }
    case 'tab': { const p=P(); S.tab[p.id]=a.dataset.g; for(const t of $$('#edp .tab')) t.setAttribute('aria-selected',t===a); for(const pn of $$('#edp [role="tabpanel"]')) pn.hidden=pn.id!=='pn-'+a.dataset.g; $('#escroll').scrollTop=0; break; }
    case 'sec': { const p=P(); const s=a.closest('.sec'); const cl=s.classList.toggle('closed'); S.closed[p.id+':'+a.dataset.g]=cl; a.setAttribute('aria-expanded',!cl); break; }
    case 'ref': openRef(a); break;
    case 'browse': browse(a); break;
    case 'secset': secretSet(a); break;
    case 'secdel': secretDel(a); break;
    case 'secundo': secretUndo(a); break;
    case 'memosize': { const t=$(`#in-${cssid(a.dataset.n)}`,a.closest('.f')); const big=t.classList.toggle('big'); a.textContent=big?'Reducir':'Ampliar'; break; }
    case 'moj': { const box=$('[data-moj]',a.closest('.fc')); box.hidden=!box.hidden; a.textContent=box.hidden?'Ver texto original':'Ocultar texto original'; break; }
    case 'firsterr': goFirstError(); break;
    case 'goerr': revealField(a.dataset.n,true); break;
    case 'goto': openProvider(a.dataset.p,{k:a.dataset.k,pf:a.dataset.p==='series'?{emp:'',ej:''}:undefined}); break;
    case 'endload': case 'retry': { $('#scn').value='normal'; S.scenario='normal'; $('#scnnote').classList.remove('on'); await openProvider(S.pid,{force:true}); toast(act==='retry'?'Datos cargados.':'Carga terminada.'); break; }
  }
});
document.addEventListener('keydown',e=>{
  if(e.target.matches&&e.target.matches('.firsterr,[data-act="goerr"],[data-act="firsterr"]')&&e.key==='Enter'){ e.target.click(); return; }
  if((e.ctrlKey||e.metaKey)&&(e.key==='g'||e.key==='G'||e.key==='s'||e.key==='S')){ if($('.ovl')) return; e.preventDefault(); if(isDirty()) save(); return; }
  if((e.ctrlKey||e.metaKey)&&(e.key==='k'||e.key==='K')){ e.preventDefault(); if(frameEl().clientWidth<900){S.navOpen=true;frameEl().classList.add('navopen');} $('#gq').focus(); $('#gq').select(); return; }
  if(e.key==='Escape'&&POP){ closePop(); return; }
  if(e.target.id==='tw'){
    if(e.key==='ArrowDown'){ e.preventDefault(); moveSel(1); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); moveSel(-1); }
    else if(e.key==='Enter'){ e.preventDefault(); const i=$('#edp .f:not(.ro) input,#edp .f:not(.ro) textarea,#edp .f:not(.ro) select,#edp .f:not(.ro) .combo'); if(i) i.focus(); }
  }
  if(e.target.id==='gutter'){
    const st=$('#split').classList.contains('stack');
    if((!st&&e.key==='ArrowLeft')||(st&&e.key==='ArrowUp')){ e.preventDefault(); nudgeSplit(-24); }
    if((!st&&e.key==='ArrowRight')||(st&&e.key==='ArrowDown')){ e.preventDefault(); nudgeSplit(24); }
  }
  if(e.target.id==='gq'){
    const items=$$('#navbody .ritem');
    if(e.key==='ArrowDown'){ e.preventDefault(); S.gkb=Math.min(items.length-1,S.gkb+1); items.forEach((x,i)=>x.classList.toggle('kb',i===S.gkb)); items[S.gkb]&&items[S.gkb].scrollIntoView({block:'nearest'}); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); S.gkb=Math.max(0,S.gkb-1); items.forEach((x,i)=>x.classList.toggle('kb',i===S.gkb)); items[S.gkb]&&items[S.gkb].scrollIntoView({block:'nearest'}); }
    else if(e.key==='Enter'){ e.preventDefault(); const b=items[S.gkb<0?0:S.gkb]; if(b) activateResult(b); }
    else if(e.key==='Escape'){ e.preventDefault(); clearGlobal(); }
  }
});
function clearGlobal(){ S.gq=''; S.gkb=-1; $('#gq').value=''; $('#gqclr').hidden=true; renderNav(); }
document.addEventListener('input',e=>{
  if(e.target.id==='gq'){ S.gq=e.target.value; S.gkb=-1; $('#gqclr').hidden=!S.gq; renderNav(); return; }
  if(e.target.id==='lq'){ const p=P(); S.filter[p.id]=e.target.value; $('[data-act="lqclear"]').hidden=!e.target.value; refreshTable(); return; }
  onFieldInput(e);
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.id==='scn'){ applyScenario(t.value); return; }
  if(t.id==='ctxsel'){ changeContext(t.value); return; }
  if(t.id==='volchk'){ if(!(await guard('cambiar el origen de los datos'))){ t.checked=S.vol; return; } S.vol=t.checked; await openProvider('conceptos',{force:true}); return; }
  if(t.id==='pf-emp'||t.id==='pf-ej'){
    const prev=clone(S.pf||{emp:'',ej:''}); const next=clone(prev);
    if(t.id==='pf-emp'){ next.emp=t.value; S.pfNote=null; if(next.ej&&next.emp&&ejEmp(Number(next.ej))!==next.emp){ S.pfNote=`Se ha quitado el ejercicio «${refText('ej',Number(next.ej))}» del filtro porque pertenece a otra empresa.`; next.ej=''; } }
    else { next.ej=t.value?Number(t.value):''; if(next.ej) next.emp=ejEmp(next.ej); S.pfNote=null; }
    const p=P(); const curVisible=()=>{ const keep=S.pf; S.pf=next; const ok=!S.sel||visibleRows(p).some(r=>r.k===S.sel); S.pf=keep; return ok; };
    if(!curVisible()&&!(await guard('cambiar el filtro de empresa y ejercicio'))){ renderMain(); return; }
    S.pf=next; await openProvider(p.id,{force:true,k:S.draft&&S.draft.isNew?null:S.sel}); return;
  }
  onFieldInput(e);
});
document.addEventListener('focusout',onFieldBlur);
document.addEventListener('pointerdown',e=>{ if(e.target.id==='gutter') startDrag(e); });
window.addEventListener('beforeunload',e=>{ if(isDirty()){ e.preventDefault(); e.returnValue=''; } });
window.addEventListener('resize',sizeFrame);

/* =====================================================================
   Arranque
   ===================================================================== */
function init(){
  $('#scn').innerHTML=Object.entries(SCN).map(([k,v])=>`<option value="${k}">${v.t}</option>`).join('');
  $('#ctxsel').innerHTML=CTXS.map(c=>`<option value="${c.emp}|${c.ej}" ${c.emp===S.ctx.emp&&c.ej===S.ctx.ej?'selected':''}>${esc(refText('ej',c.ej))}</option>`).join('');
  $('#gqclr').addEventListener('click',()=>{ clearGlobal(); $('#gq').focus(); });
  for(const b of $$('[data-size]')) b.addEventListener('click',()=>{ S.frame.size=b.dataset.size; for(const x of $$('[data-size]')) x.setAttribute('aria-pressed',x===b); sizeFrame(); });
  for(const b of $$('[data-scale]')) b.addEventListener('click',()=>{ S.frame.scale=Number(b.dataset.scale); for(const x of $$('[data-scale]')) x.setAttribute('aria-pressed',x===b); sizeFrame(); renderMain(); });
  $('#btnreset').addEventListener('click',resetDemo);
  $('#btnnotes').addEventListener('click',()=>openNotes());
  $('#btnclose').addEventListener('click',closeTab);
  renderCtx(); sizeFrame();
  openProvider('formaspago',{force:true});
  new ResizeObserver(()=>sizeFrame()).observe($('#stage'));
}
init();

</script>
