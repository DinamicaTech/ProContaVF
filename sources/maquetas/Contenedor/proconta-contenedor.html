<style>
body{margin:0;font-family:'IBM Plex Sans',system-ui,sans-serif;color:#16213A;background:#2B3345}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}

.disp{font-family:'Bricolage Grotesque','IBM Plex Sans',sans-serif}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.tn{font-variant-numeric:tabular-nums}
.muted{color:#646A78}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.fill{flex-grow:1}
.r{text-align:right;justify-content:flex-end}

.scroll::-webkit-scrollbar-track{background:transparent}
.dk.scroll::-webkit-scrollbar-thumb{background:#34435F;background-clip:padding-box}

.win{position:absolute;display:flex;flex-direction:column;background:#F3F1EC;overflow:hidden}
.win.max{left:0;top:0;right:0;bottom:0}
.win.rest{left:56px;top:36px;right:56px;bottom:76px;border:1px solid #0B1322;border-radius:8px;box-shadow:0 30px 70px rgba(0,0,0,.45)}

.taskbar{position:absolute;left:0;right:0;bottom:0;height:44px;background:#1B2231;border-top:1px solid #0B1322;display:flex;align-items:center;justify-content:center;gap:8px}
.tkb{height:36px;padding:0 14px;border:0;border-radius:6px;background:rgba(255,255,255,.08);color:#fff;display:flex;align-items:center;gap:8px;font-size:12.5px;cursor:pointer;border-bottom:2px solid #F4A259}
.tkb:hover{background:rgba(255,255,255,.14)}
.desk-note{position:absolute;left:0;right:0;top:40%;text-align:center;color:#AEB8CC;font-size:13px}

/* Cabecera global */
.tb{height:40px;flex-shrink:0;background:#14213A;color:#FFFFFF;display:flex;align-items:center;gap:10px;padding-left:12px;position:relative;z-index:30}
.brand{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;letter-spacing:-.01em;flex-shrink:0;padding-right:2px}
.logo{width:24px;height:24px;border-radius:7px;background:#F4A259;color:#14213A;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.ctxw{position:relative;flex-shrink:1;min-width:0}
.ctx{height:30px;display:flex;align-items:center;gap:8px;padding:0 10px;border-radius:8px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#FFFFFF;cursor:pointer;font-size:13px;max-width:460px;min-width:0}
.ctx:hover{background:rgba(255,255,255,.12)}
.ctx.on{border-color:#F4A259;background:rgba(244,162,89,.16)}
.ctx svg{color:#F4A259;flex-shrink:0}
.ctx .chv{color:#AEB8CC}
.ctx-soc{font-weight:600}
.ctx-ej{white-space:nowrap}
.ctx-sep{width:1px;height:16px;background:rgba(255,255,255,.24);flex-shrink:0}
.ctx-flag{font-size:11px;padding:1px 6px;border-radius:5px;background:rgba(255,255,255,.16);color:#E8ECF4;white-space:nowrap}
.nsw{position:relative;flex-shrink:0}
.nsearch{display:flex;align-items:center;gap:7px;height:30px;padding:0 10px;border-radius:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#AEB8CC;cursor:text}
.nsearch:focus-within{border-color:#F4A259;background:rgba(255,255,255,.13)}
.nsl{font-size:12px;font-weight:600;color:#F4A259;white-space:nowrap}
.nsearch input{border:0;outline:none;background:transparent;color:#FFFFFF;font-size:13px;min-width:0;flex-grow:1}
.nsearch input::placeholder{color:#9FAAC0}
.usr{height:30px;display:flex;align-items:center;gap:8px;padding:0 8px 0 4px;border-radius:8px;border:0;background:none;color:#FFFFFF;cursor:pointer;font-size:13px;flex-shrink:0;max-width:220px}
.usr:hover,.usr.on{background:rgba(255,255,255,.1)}
.usr .chv{color:#AEB8CC;flex-shrink:0}
.av{width:24px;height:24px;border-radius:50%;background:#F4A259;color:#14213A;font-size:10.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.av.lg{width:40px;height:40px;font-size:14px}
.caps{display:flex;align-self:stretch;flex-shrink:0}
.cap{width:46px;height:40px;border:0;background:none;color:#DDE3EE;display:flex;align-items:center;justify-content:center;cursor:default}
.cap:hover{background:rgba(255,255,255,.1);color:#FFFFFF}
.cap.x:hover{background:#C42B1C;color:#FFFFFF}
.zenx{height:30px;padding:0 12px;border-radius:8px;border:1px solid #F4A259;background:rgba(244,162,89,.18);color:#FFFFFF;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:7px;cursor:pointer;white-space:nowrap;flex-shrink:0}
.zenx:hover{background:rgba(244,162,89,.3)}

/* Menús y popovers */
.pop{position:absolute;background:#FFFFFF;color:#16213A;border-radius:12px;box-shadow:0 2px 6px rgba(20,33,58,.12),0 18px 44px rgba(20,33,58,.26);z-index:35;overflow:hidden}
.clear{position:absolute;left:0;top:0;right:0;bottom:0;border:0;padding:0;margin:0;background:transparent;z-index:25;cursor:default}
.mi{width:100%;height:36px;border:0;background:none;border-radius:8px;text-align:left;padding:0 10px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:10px;color:#16213A}
.mi:hover,.mi.on{background:#F6F3EC}
.mi svg{color:#646A78;flex-shrink:0}
.mi .k{margin-left:auto;font-size:11.5px;color:#7A8090}
.msep{height:1px;background:#ECE8DE;margin:4px 6px}
.nqpop{top:36px;left:0;width:460px;padding:6px}
.nqh{font-size:11.5px;color:#646A78;padding:6px 10px 8px;border-bottom:1px solid #F1EEE7;margin-bottom:4px;line-height:1.35}
.nqh b{color:#16213A;font-weight:600}
.nqg{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:none;color:#7A8090;padding:8px 10px 4px}
.nqi{width:100%;min-height:36px;border:0;background:none;border-radius:8px;text-align:left;padding:0 10px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:10px;color:#16213A}
.nqi svg{color:#646A78;flex-shrink:0}
.nqi:hover{background:#F6F3EC}
.nqi.on{background:#FFF1E2}
.nqi.on svg{color:#C8562A}
.nqt{font-weight:500;white-space:nowrap}
.nqp{font-size:12px;color:#7A8090;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.nqo{margin-left:auto;font-size:11px;color:#1D5C8C;background:#E3ECF6;border-radius:5px;padding:1px 6px;white-space:nowrap}
.nqe{padding:14px 10px;font-size:13px;color:#646A78}
.ctxpop{top:36px;left:0;width:620px}
.pop-h{padding:14px 16px 10px;border-bottom:1px solid #F1EEE7}
.pop-h h2{font-size:16px;font-weight:600;letter-spacing:-.01em}
.pop-h p{font-size:12px;color:#646A78;margin-top:2px}
.ctxcols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:0}
.ctxcol{padding:10px;display:flex;flex-direction:column;gap:4px;min-width:0}
.ctxcol+.ctxcol{border-left:1px solid #F1EEE7}
.colh{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:none;color:#7A8090;padding:2px 6px 6px}
.opt{width:100%;min-height:48px;border:1px solid transparent;background:none;border-radius:10px;text-align:left;padding:7px 10px;cursor:pointer;display:flex;align-items:center;gap:10px;color:#16213A}
.opt:hover{background:#FAF8F3}
.opt.on{background:#FFF3E6;border-color:#F2D2B2}
.opt .rad{width:16px;height:16px;border-radius:50%;border:1.5px solid #B7B2A5;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center}
.opt.on .rad{border-color:#C8562A}
.opt.on .rad::after{content:'';width:8px;height:8px;border-radius:50%;background:#C8562A}
.optt{display:flex;flex-direction:column;min-width:0;gap:1px}
.optt b{font-size:13.5px;font-weight:600}
.optt small{font-size:11.5px;color:#646A78}
.tagcur{margin-left:auto;font-size:11px;color:#555B69;background:#ECE9E0;border-radius:5px;padding:1px 6px;white-space:nowrap}
.pop-f{display:flex;align-items:center;gap:8px;padding:12px 16px;border-top:1px solid #F1EEE7;background:#FBFAF7}
.destln{display:flex;flex-direction:column;gap:2px;min-width:0;flex-grow:1;font-size:13px}
.destln small{font-size:11.5px;color:#646A78;line-height:1.35}
.userpop{top:36px;right:142px;width:300px;padding:6px}
.uhead{display:flex;gap:10px;align-items:center;padding:10px 10px 12px}
.uhead b{display:block;font-size:14px}
.uhead small{display:block;font-size:12px;color:#646A78;line-height:1.4}
.tabspop{top:74px;right:8px;width:360px;padding:6px;max-height:420px;overflow-y:auto}
.tmi{display:flex;align-items:center;gap:2px}
.tmi .mi{flex-grow:1;min-width:0}
.opspop{right:10px;bottom:28px;width:400px;padding:14px 16px}

/* Navegación lateral */
.body{flex-grow:1;min-height:0;display:flex;position:relative}
.side{flex-shrink:0;background:#0E1729;color:#C9D1E0;display:flex;flex-direction:column;position:relative;z-index:6}
.side-top{height:36px;display:flex;align-items:center;padding:0 8px;border-bottom:1px solid rgba(255,255,255,.07);flex-shrink:0}
.sidetg{height:28px;border:0;background:none;color:#AEB8CC;border-radius:7px;display:flex;align-items:center;gap:9px;padding:0 9px;cursor:pointer;font-size:12.5px;width:100%;white-space:nowrap}
.sidetg:hover{background:rgba(255,255,255,.08);color:#FFFFFF}
.side.col .sidetg{justify-content:center;padding:0}
.slist{flex-grow:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:6px 8px 12px;position:relative;display:flex;flex-direction:column;gap:1px}
.side.col .slist{align-items:center;padding:6px 0 12px}
.nb{position:relative;width:100%;height:34px;border:0;background:none;color:#C9D1E0;border-radius:8px;display:flex;align-items:center;gap:10px;padding:0 10px;font-size:13.5px;cursor:pointer;text-align:left;flex-shrink:0;white-space:nowrap}
.nb:hover{background:rgba(255,255,255,.08);color:#FFFFFF}
.nb svg{flex-shrink:0;color:#8E9AB3}
.nb:hover svg{color:#FFFFFF}
.nb.has{color:#FFFFFF}
.nb.has svg{color:#F4A259}
.nb.cur{background:#F4A259;color:#14213A;font-weight:600}
.nb.cur svg{color:#14213A}
.nb .chv{margin-left:auto;color:#6F7C96;transition:transform .15s}
.nb .chv.open{transform:rotate(90deg)}
.side.col .nb{justify-content:center;padding:0;width:40px;height:40px}
.side.col .nb.has{background:rgba(244,162,89,.16)}
.side.col .nb.cur{background:#F4A259}
.side.col .nb.fo{background:rgba(255,255,255,.12);color:#FFFFFF}
.nk{height:30px;border:0;background:none;color:#AEB8CC;border-radius:7px;display:flex;align-items:center;padding:0 10px 0 38px;font-size:13px;cursor:pointer;text-align:left;width:100%;flex-shrink:0;position:relative;white-space:nowrap}
.nk:hover{background:rgba(255,255,255,.08);color:#FFFFFF}
.nk.cur{color:#FFFFFF;background:rgba(244,162,89,.18);font-weight:600}
.nk.cur::before{content:'';position:absolute;left:23px;top:11.5px;width:7px;height:7px;border-radius:50%;background:#F4A259}
.ntip{position:absolute;background:#14213A;color:#FFFFFF;font-size:12.5px;padding:6px 10px;border-radius:7px;box-shadow:0 6px 18px rgba(0,0,0,.28);white-space:nowrap;z-index:40;pointer-events:none;border:1px solid rgba(255,255,255,.12)}
.ntip small{display:block;color:#AEB8CC;font-size:11px}
.fly{position:absolute;width:250px;padding:6px;z-index:41}
.flyh{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:none;color:#7A8090;padding:8px 10px 6px}
.fi{width:100%;height:34px;border:0;background:none;border-radius:8px;text-align:left;padding:0 10px 0 26px;font-size:13px;cursor:pointer;display:flex;align-items:center;color:#16213A;position:relative}
.fi:hover{background:#F6F3EC}
.fi.cur{background:#FFF3E6;font-weight:600;color:#B4481F}
.fi.cur::before{content:'';position:absolute;left:11px;top:13.5px;width:7px;height:7px;border-radius:50%;background:#F4A259}

/* Pestañas */
.main{flex-grow:1;min-width:0;display:flex;flex-direction:column;position:relative}
.tabs{height:36px;flex-shrink:0;display:flex;align-items:flex-end;background:#E7E3D9;border-bottom:1px solid #D6D0C2;padding:0 6px;gap:2px;position:relative;z-index:4}
.tstrip{position:relative;flex-grow:1;min-width:0;display:flex;align-items:flex-end;gap:2px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;height:36px}
.tstrip::-webkit-scrollbar{display:none}
.tab{position:relative;flex-shrink:0;height:31px;display:flex;align-items:center;border-radius:8px 8px 0 0;color:#4A5163;min-width:118px;max-width:270px}
.tab:hover{background:rgba(255,255,255,.55)}
.tab.on{background:#FBFAF7;color:#14213A;height:32px;margin-bottom:-1px;box-shadow:inset 1px 0 0 #D6D0C2,inset -1px 0 0 #D6D0C2,inset 0 1px 0 #D6D0C2}
.tab.on::before{content:'';position:absolute;left:0;right:0;top:0;height:2px;border-radius:8px 8px 0 0;background:#F4A259}
.tab.pin{min-width:0}
.tabm{flex-grow:1;min-width:0;height:100%;border:0;background:none;display:flex;align-items:center;gap:7px;padding:0 6px 0 11px;cursor:pointer;font-size:12.5px;font-weight:500;text-align:left;color:inherit;white-space:nowrap}
.tab.pin .tabm{padding:0 11px}
.tabm svg{flex-shrink:0;color:#7A8090}
.tab.on .tabm svg{color:#C8562A}
.tab.deny .tabm{color:#7A8090}
.tabt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tdot{width:8px;height:8px;border-radius:50%;background:#D9622B;flex-shrink:0;display:inline-block}
.tdot.sm{width:7px;height:7px;margin-left:6px;vertical-align:middle}
.terr{color:#B42318;display:inline-flex;flex-shrink:0}
.tabx{width:22px;height:22px;margin-right:5px;border:0;background:none;border-radius:5px;display:flex;align-items:center;justify-content:center;color:#7A8090;cursor:pointer;flex-shrink:0}
.tabx:hover{background:#DDD8CC;color:#14213A}
.tbtn{height:28px;margin-bottom:4px;min-width:28px;padding:0 7px;border:0;background:none;border-radius:6px;color:#4A5163;display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;cursor:pointer;flex-shrink:0;white-space:nowrap}
.tbtn:hover,.tbtn.on{background:rgba(20,33,58,.09);color:#14213A}
.tbtn .ct{font-weight:600}
.tbsep{width:1px;height:18px;background:#CFC9BA;margin:0 4px 9px;flex-shrink:0}

/* Área de trabajo */
.stage{flex-grow:1;min-height:0;position:relative;background:#FBFAF7}
.mod{position:absolute;left:0;top:0;right:0;bottom:0;display:flex;flex-direction:column;background:#FBFAF7}
.mscroll{flex-grow:1;min-height:0;overflow:auto}
.mtb{height:48px;flex-shrink:0;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid #E9E5DB;background:#FFFFFF;min-width:0}
.mt{font-size:17px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;margin-right:4px}
.rs{display:flex;align-items:center;gap:7px;height:32px;padding:0 10px;border:1px solid #DDD8CC;border-radius:8px;background:#FFFFFF;color:#646A78;flex-shrink:1;min-width:180px}
.rs:focus-within{border-color:#14213A;box-shadow:0 0 0 3px rgba(244,162,89,.3)}
.rs input{border:0;outline:none;background:transparent;font-size:13px;min-width:0;flex-grow:1;color:#16213A}
.seg{display:flex;gap:2px;padding:3px;border-radius:9px;background:#F1EEE7;flex-shrink:0}
.sg{height:26px;border:0;border-radius:7px;background:none;font-size:12.5px;font-weight:500;color:#555B69;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;padding:0 9px}
.sg:hover{color:#14213A}
.sg.on{background:#FFFFFF;color:#14213A;box-shadow:0 1px 2px rgba(20,33,58,.12),0 2px 6px rgba(20,33,58,.06)}
.sg .ct{font-size:11px;color:#7A8090}
.btn{height:32px;padding:0 12px;border-radius:8px;border:1px solid #DDD8CC;background:#FFFFFF;font-size:13px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;color:#16213A;flex-shrink:0}
.btn:hover{background:#FAF8F3}
.btn.dark{background:#14213A;border-color:#14213A;color:#FFFFFF}
.btn.dark:hover{background:#22314F}
.btn.pri{background:#F4A259;border-color:#F4A259;color:#14213A;font-weight:600}
.btn.pri:hover{background:#F7B475}
.btn.danger{color:#A12B1B;border-color:#EBC7C0}
.btn.danger:hover{background:#FDF1EF}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:#F3F0E8}
.btn.sm{height:28px;padding:0 9px;font-size:12.5px;border-radius:7px}
.btn:disabled{opacity:.42;cursor:default}
.btn:disabled:hover{background:#FFFFFF}
.btn.dark:disabled:hover{background:#14213A}
.lnk{border:0;background:none;padding:0;color:#1D5C8C;font-size:inherit;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.lnk:hover{color:#C8562A}
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:500;white-space:nowrap}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block}
.st-ok{background:#E2F0E8;color:#1E6B45}.st-draft{background:#ECE9E0;color:#57523F}.st-pend{background:#E3ECF6;color:#1D5C8C}.st-due{background:#FBE8D8;color:#9A4A12}.st-prop{background:#ECE6F3;color:#5B3F86}.st-new{background:#FFE8D2;color:#9A4A12}
.mfoot{height:30px;flex-shrink:0;display:flex;align-items:center;gap:14px;padding:0 14px;border-top:1px solid #E9E5DB;background:#FFFFFF;font-size:12px;color:#555B69;white-space:nowrap;overflow:hidden}
.mfoot b{color:#16213A;font-weight:600}
.dirtyl{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:#9A4A12;font-weight:500;white-space:nowrap}
.ebar{display:flex;gap:10px;align-items:flex-start;margin:10px 16px 0;padding:10px 12px;border-radius:10px;background:#FDF1EF;border:1px solid #F0C9C2;color:#7A1F12;font-size:13px;line-height:1.4;flex-shrink:0}
.ebar svg{flex-shrink:0;margin-top:1px;color:#B42318}
.ebar b{display:block;font-weight:600}
.ibar{display:flex;gap:10px;align-items:center;padding:0 14px;height:32px;background:#FFF6EC;border-bottom:1px solid #F2D9BE;color:#7A3E10;font-size:12.5px;flex-shrink:0;white-space:nowrap;overflow:hidden}
.ibar b{font-weight:600}
.bar{height:6px;border-radius:6px;background:#EDE9E0;overflow:hidden;flex-shrink:0}
.bar i{display:block;height:100%;background:#F4A259;border-radius:6px}
.switching{position:absolute;left:0;top:0;right:0;bottom:0;background:rgba(251,250,247,.86);z-index:20;display:flex;align-items:center;justify-content:center;gap:10px;font-size:14px;color:#14213A;font-weight:500}

/* Inicio */
.home{max-width:1120px;padding:30px 40px 40px;display:flex;flex-direction:column;gap:28px}
.hhead{display:flex;align-items:flex-end;gap:16px;justify-content:space-between;flex-wrap:wrap}
.hgreet{font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.hsub{font-size:14px;color:#4A5163;margin-top:8px}
.hsub b{color:#16213A;font-weight:600}

.tr-brow:focus-visible{outline:2px solid #F4A259;outline-offset:-2px}
.tr-opn{margin-left:8px;font-size:10.5px;font-weight:600;color:#1D5C8C;background:#E3ECF6;border-radius:5px;padding:1px 6px}
.tr-ct{color:#646A78}
.tr-fchip.tr-on .tr-ct{color:#F4A259}
.tr-fbody{flex-grow:1;min-height:0;overflow-y:auto;background:#FFFFFF}
.tr-fin{display:flex;flex-direction:column;gap:18px;padding:18px 24px 28px 24px;max-width:1360px}
.tr-fin>*{flex-shrink:0}
.tr-row{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start}
.tr-full{flex-basis:100%}
.tr-half{display:grid;grid-template-columns:minmax(0,420px) minmax(0,300px);gap:14px}
.tr-w-tid{width:138px}.tr-w-nif{width:148px}.tr-w-pc{width:72px}.tr-w-nom{width:190px}.tr-w-com{width:300px}
.tr-addr{display:grid;grid-template-columns:136px 104px 150px 180px minmax(220px,480px);gap:12px;align-items:start}
.tr-stack{display:flex;flex-direction:column;gap:14px}
.tr-g-pr{grid-template-columns:118px minmax(200px,320px) 96px 96px 84px 84px 72px 112px}
.tr-progchip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 4px 0 10px;border-radius:12px;background:#FFF3E6;color:#8A4410;font-size:12px;font-weight:500}
.tr-progchip button{width:18px;height:18px;border:0;border-radius:9px;background:none;color:#8A4410;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.tr-progchip button:hover{background:#F9DCC0}
.tr-notes{display:flex;flex-direction:column;gap:18px;max-width:760px}
.tr-notes textarea{min-height:170px;font-size:13px}
.tr-rbs{display:flex;gap:6px;align-items:center;flex-shrink:0}
.tr-rb{height:26px;border:0;border-radius:7px;padding:0 9px;display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;cursor:pointer}
.tr-rb .tr-rb-id{font-weight:500;font-size:11.5px;opacity:.85}
.tr-rb:hover{filter:brightness(.96)}
.tr-rb:focus-visible{outline:2px solid #F4A259;outline-offset:1px}
.tr-rb-c{background:#E2F0E8;color:#1E6B45}.tr-rb-p{background:#FBE8D8;color:#9A4A12}.tr-rb-k{background:#E3ECF6;color:#1D5C8C}
.tr-rb-none{background:#F1EEE7;color:#646A78;font-weight:500}
.tr-abar{position:relative;height:52px;flex-shrink:0;display:flex;align-items:center;gap:8px;padding:0 24px;border-top:1px solid #E9E5DB;background:#FFFFFF}
.tr-abar.tr-dirty{background:#FFF8F0;border-top-color:#F2C9A0}
.tr-abar-st{font-size:12.5px;color:#646A78;white-space:nowrap}
.tr-abar-st.tr-on{color:#9A4A12;font-weight:500}
.tr-chglist{position:absolute;bottom:58px;z-index:30;width:340px;max-height:300px;overflow:auto;background:#FFFFFF;border-radius:12px;box-shadow:0 2px 6px rgba(20,33,58,.1),0 16px 40px rgba(20,33,58,.22);padding:12px 14px;display:flex;flex-direction:column}
.tr-fcard:focus{outline:none;box-shadow:0 0 0 3px rgba(244,162,89,.45)}
.tr-mi .tr-dot{width:8px;height:8px;border-radius:4px;flex-shrink:0}
.tr-dz{display:flex;align-items:center;gap:10px;padding:14px 16px;border:1.5px dashed #D6D1C4;border-radius:12px;background:#FBFAF7;color:#555B69;font-size:13px}
.tr-dz.tr-over{border-color:#F4A259;background:#FFF3E6;color:#8A4410}
.tr-g-dc{grid-template-columns:30px minmax(240px,420px) 156px minmax(200px,280px) 88px 70px 104px}
.tr-drow{border-bottom:1px solid #F3F0E9;padding:0 4px;user-select:none}
.tr-drow:hover{background:#FBFAF6}
.tr-drow.tr-new{background:#FFF8F0}
.tr-ft{width:28px;height:34px;border-radius:5px;font-size:8.5px;font-weight:700;letter-spacing:.03em;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;box-sizing:border-box;background:#EEF0F3;color:#555B69}
.tr-ft-pdf{background:#FCE7E1;color:#A12B1B}.tr-ft-jpg,.tr-ft-png{background:#E3ECF6;color:#1D5C8C}.tr-ft-xlsx{background:#E2F0E8;color:#1E6B45}.tr-ft-docx{background:#E4E7F6;color:#33449A}
.tr-lockd{display:inline-flex;color:#8A8F9B;flex-shrink:0}
.tr-hs-Documentos{background:#E4E7F6;color:#33449A}

</style>

<style>html,body{height:100%;margin:0}body{min-width:1280px;min-height:760px;overflow:auto}#app{width:100vw;height:100vh;min-width:1280px;min-height:760px}</style>
</head>
<body>
<div id="app"></div>
<script type="text/x-template" id="tpl">

<div class="{{winCls}}">

<sc-if value="{{sess}}" hint-placeholder-val="{{false}}">

</div>

</div>

</div>

e-linejoin="round" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5"></path><path d="M4 15v5h16v-5"></path></svg></sc-if><sc-if value="{{r.ic.check}}" hint-placeholder-val="{{false}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if><sc-if value="{{r.ic.alert}}" hint-placeholder-val="{{false}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 3.9L2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path><path d="M12 9v4M12 17h.01"></path></svg></sc-if><span class="nqt">{{r.t}}</span><span class="nqp">{{r.path}}</span><sc-if value="{{r.open}}" hint-placeholder-val="{{false}}"><span class="nqo">Abierta</span></sc-if></button></sc-if>

</div>

<div class="fill"></div>

<sc-if value="{{sess}}" hint-placeholder-val="{{false}}">
<button class="{{usrCls}}" type="button" onClick="{{toggleUser}}" aria-haspopup="menu" aria-expanded="{{userOpen}}" title="Operador: {{opName}}"><span class="av">{{opIni}}</span><span class="ell">{{opShort}}</span><span class="chv"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></span></button>
<sc-if value="{{userOpen}}" hint-placeholder-val="{{false}}">
<div class="pop userpop" role="menu" aria-label="Operador">

        v.note = oi.canCancel ? 'Esta fase todavía admite cancelación: no se ha aplicado ningún movimiento. Si la cancelas, podrás repetir la acción después.' : 'La fase actual no admite cancelación. Cuando termine, este aviso lo indicará y podrás continuar. Mientras tanto puedes seguir trabajando en ' + this.ctxShort() + '.';
        v.btns = [];
        if (oi.canCancel) v.btns.push(B('Cancelar la importación', 'danger', function () { self.cancelOp(); }));
        v.btns.push(B(A.type === 'ctx' ? 'Permanecer en ' + this.ctxShort() : 'Seguir trabajando', 'dark', close));
      }
      return v;
    }
    return { show: false };
  }

  gateVals() {
    var S = this.S, self = this, g = S.gate;
    return {
      boot: S.boot === 'incompatible', login: S.boot === 'login', closed: S.boot === 'closed',
      details: g.details, discCls: 'disc' + (g.details ? ' open' : ''), checking: g.checking,
      toggle: function () { g.details = !g.details; self.bump(); },
      tech: 'Servidor .............. PROCONTA-SQL01\nBase de datos ......... ProcontaVF\nEstructura encontrada . 58 (2026.07)\nEstructura necesaria .. 61 (2026.09)\nAplicación ............ ProConta 0.9.4 (maqueta)\nCódigo ................ DB_SCHEMA_OLDER_THAN_APP\nRegistro .............. C:\\ProgramData\\ProConta\\logs\\arranque-20260930.log',
      note: g.checking ? 'Comprobando la base de datos…' : (g.tries ? 'Intento ' + (g.tries + 1) + ' a las ' + g.last + ': la estructura sigue sin ser compatible.' : ''),
      exit: function () { S.boot = 'closed'; self.bump(); },
      retry: function () { g.checking = true; self.bump(); setTimeout(function () { g.checking = false; if (S.demo.dbFixed) { S.boot = 'login'; S.lg = { mode: 'signin', op: S.op, pw: '', soc: S.soc, ej: S.ej }; self.fixLogin(); g.tries = 0; } else { g.tries += 1; g.last = nowHM(); } self.bump(); }, 1100); },
      reopen: function () { S.boot = 'login'; S.lg = { mode: 'signin', op: S.op, pw: '', soc: S.soc, ej: S.ej }; self.fixLogin(); S.win = 'max'; self.bump(); }
    };
  }
  loginVals() {
    var S = this.S, self = this, lg = S.lg; if (S.boot !== 'login') return {};
    this.fixLogin();
    var sw = lg.mode === 'switch';
    return {
      title: sw ? 'Cambiar operador' : 'Iniciar sesión',
      lead: sw ? 'Identifícate con tu propio usuario y contraseña. La sesión de ' + OPS[S.op].short + ' se cerrará al entrar.' : 'Tu usuario y contraseña son los mismos en todas las sociedades; lo que cambia según la sociedad es a qué pantallas tienes acceso.',
      op: lg.op, pw: lg.pw, soc: lg.soc, ej: String(lg.ej),
      ops: Object.keys(OPS).map(function (k) { return { v: k, t: OPS[k].name + ' (' + k + ')' }; }),
      socs: this.authSocs(lg.op).map(function (s) { return { v: s.id, t: s.name }; }),
      ejs: socById(lg.soc).ejs.map(function (e) { return { v: String(e.y), t: e.y + ' · ' + e.st }; }),
      onOp: function (e) { lg.op = e.target.value; self.fixLogin(); self.bump(); },
      onPw: function (e) { lg.pw = e.target.value; self.bump(); },
      onSoc: function (e) { lg.soc = e.target.value; lg.ej = socById(lg.soc).ejs[0].y; self.bump(); },
      onEj: function (e) { lg.ej = +e.target.value; self.bump(); },
      canCancel: sw, cancel: function () { S.boot = 'ok'; self.bump(); },
      enter: function () { self.loginAs(lg.op, lg.soc, +lg.ej); self.bump(); }
    };
  }
  demoVals(vp, H) {
    var S = this.S, self = this, dm = S.demo;
    return {
      open: dm.open, closed: !dm.open, maxH: H - 240, fluid: vp === 'fluid',
      toggle: function () { dm.open = !dm.open; self.bump(); },
      sizes: [['Ventana', null], ['2050 × 1110', '2050 × 1110'], ['1440 × 900', '1440 × 900'], ['1280 × 800', '1280 × 800']].map(function (z) { var on = dm.size === z[1]; return { t: z[0], cls: 'db' + (on ? ' on' : ''), pick: function () { dm.size = z[1]; self.bump(); } }; }),
      ops: Object.keys(OPS).map(function (k) { var on = S.op === k && S.boot === 'ok'; return { t: OPS[k].short + ' · ' + (OPS[k].auth.RG.rol), cls: 'db' + (on ? ' on' : ''), pick: function () { if (S.boot !== 'ok') { self.loginAs(k); return self.bump(); } if (S.op === k) return; self.request({ type: 'operator', to: k }); } }; }),
      prepare: function () { if (S.boot !== 'ok') return; if (!self.perm('terceros') || !self.perm('fac-emitidas')) { self.toast('Este operador no tiene acceso a Terceros o Facturas emitidas en esta sociedad.'); return self.bump(); } self.prepare(); },
      failSave: dm.failSave, togFail: function () { dm.failSave = !dm.failSave; self.bump(); },
      opBusy: !!this.runningOp(), startOp: function () { if (S.boot !== 'ok') return; if (!self.perm('n43')) { self.toast('Este operador no tiene acceso a Bancos en esta sociedad.'); return self.bump(); } self.openDest('n43', { quiet: true }); self.startOp(0); },
      revoked: dm.revoked, togRevoke: function () { dm.revoked = !dm.revoked; self.toast(dm.revoked ? 'Permiso retirado: Líneas bancarias desaparece de la navegación y su pestaña, si está abierta, muestra el acceso denegado.' : 'Permiso de Líneas bancarias restablecido.'); self.bump(); },
      shortcut: function () { if (S.boot !== 'ok') return; self.openDest('operadores'); },
      many: function () { if (S.boot !== 'ok') return; self.openMany(); },
      boot: function () { self.resetWs(); S.ops = []; S.boot = 'incompatible'; S.gate = { details: false, checking: false, tries: 0, last: '' }; self.bump(); },
      dbFixed: dm.dbFixed, togFixed: function () { dm.dbFixed = !dm.dbFixed; self.bump(); },
      reset: function () { clearInterval(self._iv); self._iv = null; var keep = dm.size; self.init(); self.S.demo.size = keep; self.scenario('inicio'); self.S.demo.open = true; self.bump(); }
    };
  }
}
