<style>
body{margin:0;font-family:'IBM Plex Sans',system-ui,sans-serif;color:#16213A;background:#2B3345}
*{box-sizing:border-box}

.disp{font-family:'Bricolage Grotesque','IBM Plex Sans',sans-serif}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.tn{font-variant-numeric:tabular-nums}
.muted{color:#646A78}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.fill{flex-grow:1}
.r{text-align:right;justify-content:flex-end}

.win{position:absolute;display:flex;flex-direction:column;background:#F3F1EC;overflow:hidden}

.taskbar{position:absolute;left:0;right:0;bottom:0;height:44px;background:#1B2231;border-top:1px solid #0B1322;display:flex;align-items:center;justify-content:center;gap:8px}
.tkb{height:36px;padding:0 14px;border:0;border-radius:6px;background:rgba(255,255,255,.08);color:#fff;display:flex;align-items:center;gap:8px;font-size:12.5px;cursor:pointer;border-bottom:2px solid #F4A259}
.tkb:hover{background:rgba(255,255,255,.14)}
.desk-note{position:absolute;left:0;right:0;top:40%;text-align:center;color:#AEB8CC;font-size:13px}

/* Cabecera global */
.tb{height:40px;flex-shrink:0;background:#14213A;color:#FFFFFF;display:flex;align-items:center;gap:10px;padding-left:12px;position:relative;z-index:30}
.brand{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;letter-spacing:-.01em;flex-shrink:0;padding-right:2px}
.logo{width:24px;height:24px;border-radius:7px;background:#F4A259;color:#14213A;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.ctxw{position:relative;flex-shrink:1;min-width:0}
.ctx{height:30px;display:flex;align-items:center;gap:8px;padding:0 10px;border-radius:8px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#FFFFFF;cursor:pointer;font-size:13px;max-width:460px;min-width:0}
.ctx:hover{background:rgba(255,255,255,.12)}
.ctx.on{border-color:#F4A259;background:rgba(244,162,89,.16)}
.ctx svg{color:#F4A259;flex-shrink:0}
.ctx .chv{color:#AEB8CC}
.ctx-soc{font-weight:600}
.ctx-ej{white-space:nowrap}
.ctx-sep{width:1px;height:16px;background:rgba(255,255,255,.24);flex-shrink:0}
.ctx-flag{font-size:11px;padding:1px 6px;border-radius:5px;background:rgba(255,255,255,.16);color:#E8ECF4;white-space:nowrap}
.nsw{position:relative;flex-shrink:0}
.nsearch{display:flex;align-items:center;gap:7px;height:30px;padding:0 10px;border-radius:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#AEB8CC;cursor:text}
.nsearch:focus-within{border-color:#F4A259;background:rgba(255,255,255,.13)}
.nsl{font-size:12px;font-weight:600;color:#F4A259;white-space:nowrap}
.nsearch input{border:0;outline:none;background:transparent;color:#FFFFFF;font-size:13px;min-width:0;flex-grow:1}
.nsearch input::placeholder{color:#9FAAC0}
.usr{height:30px;display:flex;align-items:center;gap:8px;padding:0 8px 0 4px;border-radius:8px;border:0;background:none;color:#FFFFFF;cursor:pointer;font-size:13px;flex-shrink:0;max-width:220px}
.usr:hover,.usr.on{background:rgba(255,255,255,.1)}
.usr .chv{color:#AEB8CC;flex-shrink:0}
.av{width:24px;height:24px;border-radius:50%;background:#F4A259;color:#14213A;font-size:10.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.av.lg{width:40px;height:40px;font-size:14px}
.caps{display:flex;align-self:stretch;flex-shrink:0}
.cap{width:46px;height:40px;border:0;background:none;color:#DDE3EE;display:flex;align-items:center;justify-content:center;cursor:default}
.cap:hover{background:rgba(255,255,255,.1);color:#FFFFFF}
.cap.x:hover{background:#C42B1C;color:#FFFFFF}
.zenx{height:30px;padding:0 12px;border-radius:8px;border:1px solid #F4A259;background:rgba(244,162,89,.18);color:#FFFFFF;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:7px;cursor:pointer;white-space:nowrap;flex-shrink:0}
.zenx:hover{background:rgba(244,162,89,.3)}

/* Menús y popovers */
.pop{position:absolute;background:#FFFFFF;color:#16213A;border-radius:12px;box-shadow:0 2px 6px rgba(20,33,58,.12),0 18px 44px rgba(20,33,58,.26);z-index:35;overflow:hidden}
.clear{position:absolute;left:0;top:0;right:0;bottom:0;border:0;padding:0;margin:0;background:transparent;z-index:25;cursor:default}
.mi{width:100%;height:36px;border:0;background:none;border-radius:8px;text-align:left;padding:0 10px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:10px;color:#16213A}
.mi:hover,.mi.on{background:#F6F3EC}
.mi svg{color:#646A78;flex-shrink:0}
.mi .k{margin-left:auto;font-size:11.5px;color:#7A8090}
.msep{height:1px;background:#ECE8DE;margin:4px 6px}
.nqpop{top:36px;left:0;width:460px;padding:6px}
.nqh{font-size:11.5px;color:#646A78;padding:6px 10px 8px;border-bottom:1px solid #F1EEE7;margin-bottom:4px;line-height:1.35}
.nqh b{color:#16213A;font-weight:600}
.nqg{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:none;color:#7A8090;padding:8px 10px 4px}
.nqi{width:100%;min-height:36px;border:0;background:none;border-radius:8px;text-align:left;padding:0 10px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:10px;color:#16213A}
.nqi svg{color:#646A78;flex-shrink:0}
.nqi:hover{background:#F6F3EC}
.nqi.on{background:#FFF1E2}
.nqi.on svg{color:#C8562A}
.nqt{font-weight:500;white-space:nowrap}
.nqp{font-size:12px;color:#7A8090;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.nqo{margin-left:auto;font-size:11px;color:#1D5C8C;background:#E3ECF6;border-radius:5px;padding:1px 6px;white-space:nowrap}
.nqe{padding:14px 10px;font-size:13px;color:#646A78}
.ctxpop{top:36px;left:0;width:620px}
.pop-h{padding:14px 16px 10px;border-bottom:1px solid #F1EEE7}
.pop-h h2{font-size:16px;font-weight:600;letter-spacing:-.01em}
.pop-h p{font-size:12px;color:#646A78;margin-top:2px}
.ctxcols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:0}
.ctxcol{padding:10px;display:flex;flex-direction:column;gap:4px;min-width:0}
.ctxcol+.ctxcol{border-left:1px solid #F1EEE7}
.colh{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:none;color:#7A8090;padding:2px 6px 6px}
.opt{width:100%;min-height:48px;border:1px solid transparent;background:none;border-radius:10px;text-align:left;padding:7px 10px;cursor:pointer;display:flex;align-items:center;gap:10px;color:#16213A}
.opt:hover{background:#FAF8F3}
.opt.on{background:#FFF3E6;border-color:#F2D2B2}
.opt .rad{width:16px;height:16px;border-radius:50%;border:1.5px solid #B7B2A5;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center}
.opt.on .rad{border-color:#C8562A}
.opt.on .rad::after{content:'';width:8px;height:8px;border-radius:50%;background:#C8562A}
.optt{display:flex;flex-direction:column;min-width:0;gap:1px}
.optt b{font-size:13.5px;font-weight:600}
.optt small{font-size:11.5px;color:#646A78}
.tagcur{margin-left:auto;font-size:11px;color:#555B69;background:#ECE9E0;border-radius:5px;padding:1px 6px;white-space:nowrap}
.pop-f{display:flex;align-items:center;gap:8px;padding:12px 16px;border-top:1px solid #F1EEE7;background:#FBFAF7}
.destln{display:flex;flex-direction:column;gap:2px;min-width:0;flex-grow:1;font-size:13px}
.destln small{font-size:11.5px;color:#646A78;line-height:1.35}
.userpop{top:36px;right:142px;width:300px;padding:6px}
.uhead{display:flex;gap:10px;align-items:center;padding:10px 10px 12px}
.uhead b{display:block;font-size:14px}
.uhead small{display:block;font-size:12px;color:#646A78;line-height:1.4}
.tabspop{top:74px;right:8px;width:360px;padding:6px;max-height:420px;overflow-y:auto}
.tmi{display:flex;align-items:center;gap:2px}
.tmi .mi{flex-grow:1;min-width:0}
.opspop{right:10px;bottom:28px;width:400px;padding:14px 16px}

/* Navegación lateral */
.body{flex-grow:1;min-height:0;display:flex;position:relative}
.side{flex-shrink:0;background:#0E1729;color:#C9D1E0;display:flex;flex-direction:column;position:relative;z-index:6}
.side-top{height:36px;display:flex;align-items:center;padding:0 8px;border-bottom:1px solid rgba(255,255,255,.07);flex-shrink:0}
.sidetg{height:28px;border:0;background:none;color:#AEB8CC;border-radius:7px;display:flex;align-items:center;gap:9px;padding:0 9px;cursor:pointer;font-size:12.5px;width:100%;white-space:nowrap}
.sidetg:hover{background:rgba(255,255,255,.08);color:#FFFFFF}
.side.col .sidetg{justify-content:center;padding:0}
.slist{flex-grow:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:6px 8px 12px;position:relative;display:flex;flex-direction:column;gap:1px}
.side.col .slist{align-items:center;padding:6px 0 12px}
.nb{position:relative;width:100%;height:34px;border:0;background:none;color:#C9D1E0;border-radius:8px;display:flex;align-items:center;gap:10px;padding:0 10px;font-size:13.5px;cursor:pointer;text-align:left;flex-shrink:0;white-space:nowrap}
.nb:hover{background:rgba(255,255,255,.08);color:#FFFFFF}
.nb svg{flex-shrink:0;color:#8E9AB3}
.nb:hover svg{color:#FFFFFF}
.nb.has{color:#FFFFFF}
.nb.has svg{color:#F4A259}
.nb.cur{background:#F4A259;color:#14213A;font-weight:600}
.nb.cur svg{color:#14213A}
.nb .chv{margin-left:auto;color:#6F7C96;transition:transform .15s}
.nb .chv.open{transform:rotate(90deg)}
.side.col .nb{justify-content:center;padding:0;width:40px;height:40px}
.side.col .nb.has{background:rgba(244,162,89,.16)}
.side.col .nb.cur{background:#F4A259}
.side.col .nb.fo{background:rgba(255,255,255,.12);color:#FFFFFF}
.nk{height:30px;border:0;background:none;color:#AEB8CC;border-radius:7px;display:flex;align-items:center;padding:0 10px 0 38px;font-size:13px;cursor:pointer;text-align:left;width:100%;flex-shrink:0;position:relative;white-space:nowrap}
.nk:hover{background:rgba(255,255,255,.08);color:#FFFFFF}
.nk.cur{color:#FFFFFF;background:rgba(244,162,89,.18);font-weight:600}
.nk.cur::before{content:'';position:absolute;left:23px;top:11.5px;width:7px;height:7px;border-radius:50%;background:#F4A259}
.ntip{position:absolute;background:#14213A;color:#FFFFFF;font-size:12.5px;padding:6px 10px;border-radius:7px;box-shadow:0 6px 18px rgba(0,0,0,.28);white-space:nowrap;z-index:40;pointer-events:none;border:1px solid rgba(255,255,255,.12)}
.ntip small{display:block;color:#AEB8CC;font-size:11px}
.fly{position:absolute;width:250px;padding:6px;z-index:41}
.flyh{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:none;color:#7A8090;padding:8px 10px 6px}
.fi{width:100%;height:34px;border:0;background:none;border-radius:8px;text-align:left;padding:0 10px 0 26px;font-size:13px;cursor:pointer;display:flex;align-items:center;color:#16213A;position:relative}
.fi:hover{background:#F6F3EC}
.fi.cur{background:#FFF3E6;font-weight:600;color:#B4481F}
.fi.cur::before{content:'';position:absolute;left:11px;top:13.5px;width:7px;height:7px;border-radius:50%;background:#F4A259}

/* Pestañas */
.nsplit{flex:none;width:6px;margin:0 -3px;position:relative;z-index:7;cursor:col-resize;display:flex;align-items:center;justify-content:center;outline:none}
.nsplit i{width:2px;height:40px;border-radius:2px;background:transparent}
.nsplit:hover i,.nsplit:focus-visible i{background:#F4A259}
.nsplit.hid{width:12px;margin:0;background:#0E1729}
.nsplit.hid i{background:rgba(255,255,255,.35);height:48px}
.nsplit.hid:hover i,.nsplit.hid:focus-visible i{background:#F4A259}
.main{flex-grow:1;min-width:0;display:flex;flex-direction:column;position:relative}
.tabs{height:36px;flex-shrink:0;display:flex;align-items:flex-end;background:#E7E3D9;border-bottom:1px solid #D6D0C2;padding:0 6px;gap:2px;position:relative;z-index:4}
.tstrip{position:relative;flex-grow:1;min-width:0;display:flex;align-items:flex-end;gap:2px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;height:36px}
.tstrip::-webkit-scrollbar{display:none}
.tab{position:relative;flex-shrink:0;height:31px;display:flex;align-items:center;border-radius:8px 8px 0 0;color:#4A5163;min-width:118px;max-width:270px}
.tab:hover{background:rgba(255,255,255,.55)}
.tab.on{background:#FBFAF7;color:#14213A;height:32px;margin-bottom:-1px;box-shadow:inset 1px 0 0 #D6D0C2,inset -1px 0 0 #D6D0C2,inset 0 1px 0 #D6D0C2}
.tab.on::before{content:'';position:absolute;left:0;right:0;top:0;height:2px;border-radius:8px 8px 0 0;background:#F4A259}
.tab.pin{min-width:0}
.tabm{flex-grow:1;min-width:0;height:100%;border:0;background:none;display:flex;align-items:center;gap:7px;padding:0 6px 0 11px;cursor:pointer;font-size:12.5px;font-weight:500;text-align:left;color:inherit;white-space:nowrap}
.tab.pin .tabm{padding:0 11px}
.tabm svg{flex-shrink:0;color:#7A8090}
.tab.on .tabm svg{color:#C8562A}
.tab.deny .tabm{color:#7A8090}
.tabt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tdot{width:8px;height:8px;border-radius:50%;background:#D9622B;flex-shrink:0;display:inline-block}
.tdot.sm{width:7px;height:7px;margin-left:6px;vertical-align:middle}
.terr{color:#B42318;display:inline-flex;flex-shrink:0}
.tabx{width:22px;height:22px;margin-right:5px;border:0;background:none;border-radius:5px;display:flex;align-items:center;justify-content:center;color:#7A8090;cursor:pointer;flex-shrink:0}
.tabx:hover{background:#DDD8CC;color:#14213A}
.tbtn{height:28px;margin-bottom:4px;min-width:28px;padding:0 7px;border:0;background:none;border-radius:6px;color:#4A5163;display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;cursor:pointer;flex-shrink:0;white-space:nowrap}
.tbtn:hover,.tbtn.on{background:rgba(20,33,58,.09);color:#14213A}
.tbtn .ct{font-weight:600}
.tbsep{width:1px;height:18px;background:#CFC9BA;margin:0 4px 9px;flex-shrink:0}

/* Área de trabajo */
.stage{flex-grow:1;min-height:0;position:relative;background:#FBFAF7}
.mod{position:absolute;left:0;top:0;right:0;bottom:0;display:flex;flex-direction:column;background:#FBFAF7}
.mscroll{flex-grow:1;min-height:0;overflow:auto}
.mtb{height:48px;flex-shrink:0;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid #E9E5DB;background:#FFFFFF;min-width:0}
.mt{font-size:17px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;margin-right:4px}
.rs{display:flex;align-items:center;gap:7px;height:32px;padding:0 10px;border:1px solid #DDD8CC;border-radius:8px;background:#FFFFFF;color:#646A78;flex-shrink:1;min-width:180px}
.rs:focus-within{border-color:#14213A;box-shadow:0 0 0 3px rgba(244,162,89,.3)}
.rs input{border:0;outline:none;background:transparent;font-size:13px;min-width:0;flex-grow:1;color:#16213A}
.seg{display:flex;gap:2px;padding:3px;border-radius:9px;background:#F1EEE7;flex-shrink:0}
.sg{height:26px;border:0;border-radius:7px;background:none;font-size:12.5px;font-weight:500;color:#555B69;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;padding:0 9px}
.sg:hover{color:#14213A}
.sg.on{background:#FFFFFF;color:#14213A;box-shadow:0 1px 2px rgba(20,33,58,.12),0 2px 6px rgba(20,33,58,.06)}
.sg .ct{font-size:11px;color:#7A8090}
.btn{height:32px;padding:0 12px;border-radius:8px;border:1px solid #DDD8CC;background:#FFFFFF;font-size:13px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;color:#16213A;flex-shrink:0}
.btn:hover{background:#FAF8F3}
.btn.dark{background:#14213A;border-color:#14213A;color:#FFFFFF}
.btn.dark:hover{background:#22314F}
.btn.pri{background:#F4A259;border-color:#F4A259;color:#14213A;font-weight:600}
.btn.pri:hover{background:#F7B475}
.btn.danger{color:#A12B1B;border-color:#EBC7C0}
.btn.danger:hover{background:#FDF1EF}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:#F3F0E8}
.btn.sm{height:28px;padding:0 9px;font-size:12.5px;border-radius:7px}
.btn:disabled{opacity:.42;cursor:default}
.btn:disabled:hover{background:#FFFFFF}
.btn.dark:disabled:hover{background:#14213A}
.lnk{border:0;background:none;padding:0;color:#1D5C8C;font-size:inherit;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.lnk:hover{color:#C8562A}
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:500;white-space:nowrap}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block}
.st-ok{background:#E2F0E8;color:#1E6B45}.st-draft{background:#ECE9E0;color:#57523F}.st-pend{background:#E3ECF6;color:#1D5C8C}.st-due{background:#FBE8D8;color:#9A4A12}.st-prop{background:#ECE6F3;color:#5B3F86}.st-new{background:#FFE8D2;color:#9A4A12}
.mfoot{height:30px;flex-shrink:0;display:flex;align-items:center;gap:14px;padding:0 14px;border-top:1px solid #E9E5DB;background:#FFFFFF;font-size:12px;color:#555B69;white-space:nowrap;overflow:hidden}
.mfoot b{color:#16213A;font-weight:600}
.dirtyl{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:#9A4A12;font-weight:500;white-space:nowrap}
.ebar{display:flex;gap:10px;align-items:flex-start;margin:10px 16px 0;padding:10px 12px;border-radius:10px;background:#FDF1EF;border:1px solid #F0C9C2;color:#7A1F12;font-size:13px;line-height:1.4;flex-shrink:0}
.ebar svg{flex-shrink:0;margin-top:1px;color:#B42318}
.ebar b{display:block;font-weight:600}
.ibar{display:flex;gap:10px;align-items:center;padding:0 14px;height:32px;background:#FFF6EC;border-bottom:1px solid #F2D9BE;color:#7A3E10;font-size:12.5px;flex-shrink:0;white-space:nowrap;overflow:hidden}
.ibar b{font-weight:600}
.bar{height:6px;border-radius:6px;background:#EDE9E0;overflow:hidden;flex-shrink:0}
.bar i{display:block;height:100%;background:#F4A259;border-radius:6px}
.switching{position:absolute;left:0;top:0;right:0;bottom:0;background:rgba(251,250,247,.86);z-index:20;display:flex;align-items:center;justify-content:center;gap:10px;font-size:14px;color:#14213A;font-weight:500}

/* Inicio */
.home{max-width:1120px;padding:30px 40px 40px;display:flex;flex-direction:column;gap:28px}
.hhead{display:flex;align-items:flex-end;gap:16px;justify-content:space-between;flex-wrap:wrap}
.hgreet{font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.hsub{font-size:14px;color:#4A5163;margin-top:8px}
.hsub b{color:#16213A;font-weight:600}
.hsec{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:none;color:#646A78;margin-bottom:10px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{height:64px;border:1px solid #E6E1D5;border-radius:12px;background:#FFFFFF;display:flex;align-items:center;gap:12px;padding:0 14px;text-align:left;cursor:pointer;color:#16213A}
.tile:hover{border-color:#E7C29D;box-shadow:0 4px 14px rgba(20,33,58,.07)}
.tic{width:38px;height:38px;border-radius:10px;background:#14213A;color:#F4A259;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.tt{display:flex;flex-direction:column;min-width:0;gap:1px}
.tt b{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt small{font-size:12px;color:#646A78}
.recl{display:flex;flex-direction:column;border:1px solid #E6E1D5;border-radius:12px;background:#FFFFFF;overflow:hidden}
.rec{height:42px;border:0;border-bottom:1px solid #F1EEE7;background:#FFFFFF;display:flex;align-items:center;gap:12px;padding:0 14px;text-align:left;cursor:pointer;font-size:13.5px;color:#16213A}
.rec:last-child{border-bottom:0}
.rec:hover{background:#FBF8F1}
.rec svg{color:#7A8090;flex-shrink:0}
.rt{font-weight:500;white-space:nowrap}
.rp{font-size:12.5px;color:#7A8090;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-grow:1;min-width:0}
.rtime{font-size:12px;color:#7A8090;width:44px;text-align:right;flex-shrink:0}
.p-open{background:#E3ECF6;color:#1D5C8C}
.hempty{padding:18px;border:1.5px dashed #DDD8CC;border-radius:12px;color:#646A78;font-size:13px}
.hhelp{display:flex;gap:8px;align-items:center;font-size:12.5px;color:#646A78}
.hhelp svg{flex-shrink:0}

/* Terceros */
.tbody{flex-grow:1;min-height:0;display:flex}
.tlist{flex-shrink:0;overflow-y:auto;background:#FFFFFF;border-right:1px solid #E9E5DB}
.trow{width:100%;display:grid;grid-template-columns:32px minmax(0,1fr) auto;column-gap:10px;align-items:center;padding:8px 12px;min-height:54px;border:0;border-bottom:1px solid #F1EEE7;background:#FFFFFF;text-align:left;cursor:pointer;color:#16213A}
.trow:hover{background:#FBFAF6}
.trow.on{background:#FFF3E6}
.trow.on .tname{color:#B4481F}
.tcol{display:flex;flex-direction:column;min-width:0}
.tname{font-size:13.5px;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tsub{font-size:11.5px;color:#646A78;line-height:1.35;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ta{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0}
.ta.lg{width:40px;height:40px;font-size:13px}
.ta-F{border-radius:50%;background:#E3ECF6;color:#1D5C8C}
.ta-J{border-radius:9px;background:#14213A;color:#FFFFFF}
.ta-E{border-radius:9px;background:#ECE6F3;color:#5B3F86;box-shadow:inset 0 0 0 1.5px #B9A6D6}
.fbs{display:flex;gap:4px;align-items:center;flex-shrink:0}
.fb{height:20px;padding:0 6px;border-radius:6px;font-size:10.5px;font-weight:600;display:inline-flex;align-items:center;letter-spacing:.02em}
.fb-c{background:#E2F0E8;color:#1E6B45}.fb-p{background:#FBE8D8;color:#9A4A12}.fb-k{background:#E3ECF6;color:#1D5C8C}
.lempty{padding:24px 16px;color:#646A78;font-size:13px;text-align:center}
.ficha{flex-grow:1;min-width:0;display:flex;flex-direction:column}
.fh{height:64px;flex-shrink:0;display:flex;align-items:center;gap:12px;padding:0 16px;background:#FFFFFF;border-bottom:1px solid #E9E5DB;min-width:0}
.fhid{display:flex;flex-direction:column;min-width:0;gap:2px}
.fname{font-size:19px;font-weight:600;letter-spacing:-.01em;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fmeta{font-size:12px;color:#646A78;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stabs{height:40px;flex-shrink:0;display:flex;align-items:flex-end;gap:2px;padding:0 12px;border-bottom:1px solid #E9E5DB;background:#FFFFFF}
.st{height:40px;border:0;background:none;padding:0 12px;font-size:13px;font-weight:500;color:#555B69;cursor:pointer;display:inline-flex;align-items:center;gap:6px;position:relative;white-space:nowrap}
.st:hover{color:#14213A}
.st.on{color:#14213A;font-weight:600}
.st.on::after{content:'';position:absolute;left:10px;right:10px;bottom:0;height:2px;border-radius:2px;background:#F4A259}
.st .ct{font-size:11px;color:#7A8090;font-weight:500}
.fbody{flex-grow:1;min-height:0;overflow:auto;padding:18px 20px 28px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px;max-width:900px}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f.w2{grid-column:span 2}
.f label{font-size:12px;font-weight:500;color:#4A5163;display:flex;align-items:center;gap:6px}
.req{color:#B4481F}
.chgl{font-size:10.5px;font-weight:600;color:#9A4A12;background:#FFE8D2;border-radius:4px;padding:0 5px}
.in{height:34px;border:1px solid #DDD8CC;border-radius:8px;background:#FFFFFF;padding:0 10px;font-size:13.5px;min-width:0;width:100%;color:#16213A}
.in:focus{outline:none;border-color:#14213A;box-shadow:0 0 0 3px rgba(244,162,89,.3)}
.in.chg{background:#FFF8EF;border-color:#EBC59C}
.in.bad{border-color:#B42318;background:#FFF7F6}
.in[readonly]{background:#F6F4EF;color:#555B69}
textarea.in{height:auto;padding:8px 10px;resize:vertical;line-height:1.45}
.ferr{font-size:12px;color:#B42318;display:flex;gap:5px;align-items:center}
.fhint{font-size:11.5px;color:#7A8090}
.fcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;max-width:980px}
.fcard{border:1px solid #E6E1D5;border-radius:12px;background:#FFFFFF;padding:14px;display:flex;flex-direction:column;gap:10px}
.fcard.off{background:#FAF8F3;color:#7A8090}
.fcard h3{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.kvl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;font-size:12.5px}
.kvl dt{color:#646A78}
.kvl dd{margin:0;font-weight:500}
.ftab{border:1px solid #E6E1D5;border-radius:12px;background:#FFFFFF;overflow:hidden;max-width:900px}
.frow{width:100%;display:grid;grid-template-columns:130px 100px minmax(0,1fr) 120px 110px 70px;align-items:center;column-gap:12px;height:40px;padding:0 14px;border:0;border-bottom:1px solid #F1EEE7;background:#FFFFFF;text-align:left;cursor:pointer;font-size:13px;color:#16213A}
.frow:last-child{border-bottom:0}
.frow:hover{background:#FBF8F1}
.frow .go{color:#1D5C8C;font-size:12.5px;display:inline-flex;align-items:center;gap:4px;justify-content:flex-end}
.fhrow{display:grid;grid-template-columns:130px 100px minmax(0,1fr) 120px 110px 70px;column-gap:12px;height:32px;align-items:center;padding:0 14px;background:#F6F3EC;font-size:11.5px;font-weight:600;color:#4A5163;border-bottom:1px solid #E9E5DB}
.cap1{font-size:12.5px;color:#646A78;margin-bottom:10px}

/* Rejillas densas */
.gwrap{flex-grow:1;min-height:0;overflow:auto;background:#FFFFFF}
.gh{position:sticky;top:0;z-index:2;display:grid;align-items:center;height:30px;background:#F3F0E8;border-bottom:1px solid #DCD7CA;font-size:11.5px;font-weight:600;color:#4A5163}
.gh>span{padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gr{display:grid;align-items:center;width:100%;border:0;border-bottom:1px solid #F0ECE3;background:#FFFFFF;text-align:left;padding:0;color:#16213A;cursor:pointer}
.gr>span{padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.gr:hover{background:#FBF8F1}
.gr.on{background:#FFF3E6}
.gr.fr{height:34px;font-size:13px}
.gr.nr{height:26px;font-size:12.5px;cursor:default}
.gr.nr.new{background:#FFFBF4}
.gr.nr.on{background:#FFF3E6}
.g-fac{grid-template-columns:128px 96px minmax(200px,1.6fr) 110px 112px 100px 118px 118px 140px}
.g-n43{grid-template-columns:32px 92px 92px 46px minmax(120px,1fr) 54px minmax(190px,2fr) 112px 96px 108px 116px 104px 112px}
.imp-d{color:#A12B1B}
.imp-h{color:#1E6B45}
.chk{width:15px;height:15px;accent-color:#14213A;margin:0;cursor:pointer}
.stp{display:inline-flex;align-items:center;height:19px;padding:0 7px;border-radius:5px;font-size:11px;font-weight:500}

/* Factura */
.fdet{padding:18px 20px 30px;display:flex;flex-direction:column;gap:16px;max-width:1100px}
.fcols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.box{border:1px solid #E6E1D5;border-radius:12px;background:#FFFFFF;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.boxh{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:none;color:#7A8090}
.lines{border:1px solid #E6E1D5;border-radius:12px;background:#FFFFFF;overflow:hidden}
.lh,.lr{display:grid;grid-template-columns:minmax(0,1fr) 80px 110px 70px 120px;column-gap:12px;padding:0 14px;align-items:center}
.lh{height:32px;background:#F6F3EC;font-size:11.5px;font-weight:600;color:#4A5163}
.lr{height:38px;border-top:1px solid #F1EEE7;font-size:13px}
.tot{display:flex;justify-content:flex-end}
.totb{width:320px;display:grid;grid-template-columns:1fr auto;gap:6px 14px;font-size:13px;padding:12px 16px;border-radius:12px;background:#FFFFFF;border:1px solid #E6E1D5}
.totb .big{font-size:17px;font-weight:600;padding-top:6px;border-top:1px solid #ECE8DE}
.back{height:30px;padding:0 10px 0 8px;border-radius:8px;border:1px solid #F2D2B2;background:#FFF6EC;color:#8A4410;font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap;flex-shrink:1;min-width:0;overflow:hidden}
.back:hover{background:#FFEBD6}

/* Norma 43 import */
.n43i{padding:20px;display:flex;flex-direction:column;gap:14px;max-width:880px}
.panel{border:1px solid #E6E1D5;border-radius:12px;background:#FFFFFF;padding:16px;display:flex;flex-direction:column;gap:10px}
.psec{font-size:15px;font-weight:600}
.fopt{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid #ECE8DE;border-radius:10px;cursor:pointer}
.fopt:hover{background:#FBF8F1}
.fopt.on{border-color:#F2D2B2;background:#FFF6EC}
.fopt span{display:flex;flex-direction:column;gap:2px}
.fopt small{font-size:12px;color:#646A78}

/* Estados vacíos / denegado */
.center{flex-grow:1;display:flex;align-items:center;justify-content:center;padding:40px}
.stbox{max-width:520px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.stic{width:52px;height:52px;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;background:#EFEBE2;color:#646A78}
.stic.lock{background:#FBE8D8;color:#9A4A12}
.stbox h2{font-size:20px;font-weight:600;letter-spacing:-.01em}
.stbox p{font-size:13.5px;color:#4A5163;line-height:1.5}
.stbtns{display:flex;gap:8px;margin-top:6px}

/* Barra de estado */
.sb{height:24px;flex-shrink:0;background:#ECE8DF;border-top:1px solid #D6D0C2;display:flex;align-items:center;gap:6px;padding:0 8px;font-size:11.5px;color:#555B69;position:relative;z-index:4;white-space:nowrap}
.sbi{display:inline-flex;align-items:center;gap:6px;padding:0 6px}
.sbb{height:20px;border:0;background:none;padding:0 6px;border-radius:4px;font-size:11.5px;color:#555B69;display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}
.sbb:hover{background:rgba(20,33,58,.08);color:#14213A}
.sbb.op{color:#14213A;font-weight:600;background:#FFE8D2}
.sbb.opd{color:#1E6B45;font-weight:600;background:#E2F0E8}
.sbb .tdot{width:7px;height:7px}
.sdot{width:7px;height:7px;border-radius:50%;background:#2E8A5C;display:inline-block}
.sbsep{width:1px;height:12px;background:#CFC9BA}

/* Diálogos */
.ovl{position:absolute;left:0;top:0;right:0;bottom:0;z-index:50;display:flex;align-items:center;justify-content:center}
.bd{position:absolute;left:0;top:0;right:0;bottom:0;background:rgba(14,23,41,.46)}
.dlg{position:relative;width:560px;max-width:calc(100% - 40px);background:#FFFFFF;border-radius:14px;box-shadow:0 24px 64px rgba(14,23,41,.4);display:flex;flex-direction:column;overflow:hidden}
.dlgh{display:flex;gap:12px;padding:20px 22px 6px}
.dlgic{width:36px;height:36px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;background:#FFE8D2;color:#9A4A12}
.dlgic.err{background:#FDE7E4;color:#B42318}
.dlgic.info{background:#E3ECF6;color:#1D5C8C}
.dlgh h2{font-size:18px;font-weight:600;letter-spacing:-.01em;line-height:1.25}
.dlgh p{font-size:13.5px;color:#4A5163;margin-top:5px;line-height:1.45}
.dlgb{padding:10px 22px 4px;display:flex;flex-direction:column;gap:10px}
.trans{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center}
.tbx{border:1px solid #E6E1D5;border-radius:10px;padding:8px 12px;display:flex;flex-direction:column;gap:1px;min-width:0}
.tbx small{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:none;color:#7A8090}
.tbx b{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbx span{font-size:12px;color:#646A78}
.tbx.to{border-color:#F2D2B2;background:#FFF6EC}
.dli{display:flex;flex-direction:column;border:1px solid #E6E1D5;border-radius:10px;overflow:hidden}
.dit{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid #F1EEE7;font-size:13px}
.dit:last-child{border-bottom:0}
.dit svg{flex-shrink:0;color:#7A8090}
.ditx{display:flex;flex-direction:column;gap:2px;min-width:0;flex-grow:1}
.ditx b{font-weight:600}
.ditx small{font-size:12px;color:#646A78;line-height:1.35}
.ditx small.e{color:#B42318}
.ditx small.ok{color:#1E6B45}
.dnote{font-size:12.5px;color:#555B69;line-height:1.45}
.dlgf{display:flex;justify-content:flex-end;gap:8px;padding:16px 22px 18px}
.opcard{border:1px solid #E6E1D5;border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.oprow{display:flex;align-items:center;gap:8px;font-size:13px}
.opmeta{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:12px}
.opmeta dt{color:#646A78}
.opmeta dd{margin:0}

/* Toast */
.toast{position:absolute;left:50%;bottom:40px;transform:translateX(-50%);background:#14213A;color:#FFFFFF;border-radius:10px;padding:10px 12px 10px 14px;font-size:13px;display:flex;gap:10px;align-items:center;box-shadow:0 12px 30px rgba(14,23,41,.35);z-index:45;max-width:640px}
.toast svg{color:#F4A259;flex-shrink:0}
.toast button{border:0;background:none;color:#AEB8CC;cursor:pointer;display:flex;padding:2px}

/* Arranque, sesión */
.gate{flex-grow:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#F3F1EC;padding:30px;overflow:auto}
.gate.navy{background:#14213A}
.gcard{width:560px;max-width:100%;background:#FFFFFF;border-radius:16px;box-shadow:0 1px 2px rgba(20,33,58,.06),0 16px 40px rgba(20,33,58,.14);padding:26px 28px;display:flex;flex-direction:column;gap:14px}
.gcard.sm{width:440px}
.gcard h1{font-size:22px;font-weight:600;letter-spacing:-.015em;line-height:1.2}
.gcard p{font-size:14px;color:#4A5163;line-height:1.5}
.gic{width:44px;height:44px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;background:#FDE7E4;color:#B42318}
.disc{border:0;background:none;padding:0;font-size:13px;font-weight:600;color:#14213A;display:inline-flex;align-items:center;gap:6px;cursor:pointer;align-self:flex-start}
.disc svg{transition:transform .15s}
.disc.open svg{transform:rotate(90deg)}
.tech{margin:0;background:#F6F4EF;border:1px solid #E6E1D5;border-radius:10px;padding:12px 14px;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12px;line-height:1.6;color:#2F3748;white-space:pre-wrap}
.gfoot{display:flex;gap:8px;justify-content:flex-end;align-items:center}
.gnote{font-size:12.5px;color:#646A78;margin-right:auto}

/* Panel de demostración (no forma parte de la interfaz) */
.demo-t{position:absolute;left:50%;transform:translateX(-50%);bottom:3px;z-index:60;height:20px;padding:0 10px;border-radius:999px;border:1.5px dashed #8C73B5;background:#F4F0FA;color:#4B3474;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:7px;cursor:pointer;box-shadow:none;font-size:11.5px}
.demo-t:hover{background:#ECE4F7}
.demo{position:absolute;right:12px;bottom:34px;width:320px;z-index:60;background:#F9F7FC;border:1.5px dashed #8C73B5;border-radius:14px;box-shadow:0 14px 40px rgba(14,23,41,.3);display:flex;flex-direction:column;overflow:hidden}
.demoh{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#ECE4F7;color:#4B3474}
.demoh b{font-size:13px}
.demoh small{display:block;font-size:11px;color:#6A5790}
.demob{padding:10px 12px 12px;display:flex;flex-direction:column;gap:12px;overflow-y:auto}
.dsec{display:flex;flex-direction:column;gap:6px}
.dsec h3{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:none;color:#6A5790}
.drow{display:flex;gap:6px;flex-wrap:wrap}
.db{height:28px;padding:0 9px;border-radius:7px;border:1px solid #D6CBE8;background:#FFFFFF;color:#2E2346;font-size:12px;cursor:pointer;text-align:left;display:inline-flex;align-items:center;gap:6px}
.db:hover{background:#F1EBFA}
.db.on{background:#4B3474;border-color:#4B3474;color:#FFFFFF}
.db.w{width:100%}
.dchk{display:flex;align-items:flex-start;gap:8px;font-size:12px;color:#2E2346;cursor:pointer;line-height:1.35}
.dchk input{margin:1px 0 0;accent-color:#4B3474}
.dx{border:0;background:none;color:#4B3474;cursor:pointer;display:flex;padding:4px;border-radius:6px;margin-left:auto}
.dx:hover{background:rgba(75,52,116,.12)}
/* Terceros (buscador y fichas) */
.tr-disp{font-family:'Bricolage Grotesque','IBM Plex Sans',sans-serif}
.tr-tn{font-variant-numeric:tabular-nums}
.tr-mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.tr-muted{color:#646A78}
.tr-cell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr-r{text-align:right}
.tr-rail-i{width:44px;height:44px;border-radius:12px;border:0;background:none;color:#8E9AB3;display:flex;align-items:center;justify-content:center;cursor:pointer}
.tr-rail-i:hover{background:rgba(255,255,255,.07);color:#FFFFFF}
.tr-rail-i.tr-on{background:#F4A259;color:#14213A}
.tr-hsearch{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:10px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#AEB8CC}
.tr-hsearch:focus-within{background:rgba(255,255,255,.13);border-color:#F4A259}
.tr-hsearch input{flex-grow:1;min-width:0;border:0;outline:none;background:transparent;color:#FFFFFF;font:inherit;font-size:13.5px}
.tr-hsearch input::placeholder{color:#9FAAC0}

<style>html,body{height:100%;margin:0}body{min-width:1280px;min-height:760px;overflow:auto}#app{width:100vw;height:100vh;min-width:1280px;min-height:760px}</style>

<sc-if value="{{sess}}" hint-placeholder-val="{{false}}">

<sc-if value="{{userOpen}}" hint-placeholder-val="{{false}}">
<div class="pop userpop" role="menu" aria-label="Operador">
<div class="uhead"><span class="av lg">{{opIni}}</span><div><b>{{opName}}</b><small>Usuario {{opLogin}}</small><small>{{rol}} en {{socShort}}</small></div></div>
<div class="msep"></div>
<button class="mi" type="button" role="menuitem" onClick="{{askOperator}}" title="Inicia sesión con otro operador sin cerrar ProConta; antes se revisan los cambios sin guardar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="8" r="3.5"></circle><path d="M3.5 20c.5-3.5 3-5.5 6.5-5.5 1.3 0 2.5.3 3.4.8"></path><path d="M17 13.5l-2.5 2.5 2.5 2.5M14.5 16H21"></path></svg>Cambiar operador…</button>
<button class="mi" type="button" role="menuitem" onClick="{{askLogout}}" title="Cierra la sesión del operador actual; antes se revisan los cambios sin guardar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="M16 17l5-5-5-5M21 12H9"></path></svg>Cerrar sesión</button>
</div>
</sc-if>
</sc-if>

<div class="caps">

<button class="cap x" type="button" aria-label="Cerrar ProConta" title="Cerrar" onClick="{{askExit}}"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M0.5 0.5l9 9M9.5 0.5l-9 9" stroke="currentColor" stroke-width="1.05"></path></svg></button>
</div>
</header>

<sc-if value="{{gate.boot}}" hint-placeholder-val="{{false}}">
<div class="gate">
<div class="gcard" role="alert">
<span class="gic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 3.9L2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path><path d="M12 9v4M12 17h.01"></path></svg></span>
<h1 class="disp">No se puede abrir ProConta con estos datos</h1>
<p>La base de datos tiene una estructura anterior a la que necesita esta versión de ProConta. Para evitar errores, la aplicación se ha detenido antes de iniciar sesión. <b>No se ha modificado ningún dato.</b></p>
<p>Un administrador debe actualizar la base de datos con la herramienta de mantenimiento, o instalar la versión de ProConta que corresponde a estos datos.</p>
<button class="{{gate.discCls}}" type="button" aria-expanded="{{gate.details}}" onClick="{{gate.toggle}}" title="Muestra u oculta los datos técnicos para el administrador"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>Detalle técnico</button>
<sc-if value="{{gate.details}}" hint-placeholder-val="{{false}}"><pre class="tech">{{gate.tech}}</pre></sc-if>
<div class="gfoot">
<span class="gnote">{{gate.note}}</span>
<button class="btn" type="button" onClick="{{gate.exit}}" title="Cierra ProConta sin modificar ningún dato">Salir</button>
<button class="btn dark" type="button" disabled="{{gate.checking}}" onClick="{{gate.retry}}" title="Vuelve a comprobar la base de datos, por ejemplo después de que un administrador la actualice"><sc-if value="{{gate.checking}}" hint-placeholder-val="{{false}}"><span class="spin" style="display: inline-flex"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.2-8.6"></path></svg></span></sc-if>Reintentar</button>
</div>
</div>
</div>
</sc-if>

<sc-if value="{{gate.login}}" hint-placeholder-val="{{false}}">
<div class="gate navy">
<div class="gcard sm">
<div class="brand" style="color: #14213A"><span class="logo disp" aria-hidden="true">P</span><span class="disp">ProConta</span></div>
<h1 class="disp">{{lg.title}}</h1>
<p style="font-size: 13px">{{lg.lead}}</p>
<div class="f"><label for="lg-op">Operador</label><select id="lg-op" class="in" value="{{lg.op}}" onChange="{{lg.onOp}}" title="Operador con el que inicias sesión"><sc-for list="{{lg.ops}}" as="o" hint-placeholder-count="3"><option value="{{o.v}}">{{o.t}}</option></sc-for></select></div>
<div class="f"><label for="lg-pw">Contraseña</label><input id="lg-pw" class="in" type="password" value="{{lg.pw}}" onChange="{{lg.onPw}}" autocomplete="off" title="Contraseña del operador elegido"><span class="fhint">Maqueta: cualquier contraseña es válida.</span></div>
<div class="f"><label for="lg-soc">Sociedad</label><select id="lg-soc" class="in" value="{{lg.soc}}" onChange="{{lg.onSoc}}" title="Sociedad con la que trabajarás; solo aparecen las autorizadas para este operador"><sc-for list="{{lg.socs}}" as="o" hint-placeholder-count="3"><option value="{{o.v}}">{{o.t}}</option></sc-for></select><span class="fhint">Solo las sociedades autorizadas para este operador.</span></div>
<div class="f"><label for="lg-ej">Ejercicio</label><select id="lg-ej" class="in" value="{{lg.ej}}" onChange="{{lg.onEj}}" title="Ejercicio contable con el que trabajarás"><sc-for list="{{lg.ejs}}" as="o" hint-placeholder-count="3"><option value="{{o.v}}">{{o.t}}</option></sc-for></select></div>
<div class="gfoot">
<sc-if value="{{lg.canCancel}}" hint-placeholder-val="{{false}}"><button class="btn" type="button" onClick="{{lg.cancel}}" title="Cancela el inicio de sesión">Cancelar</button></sc-if>
<button class="btn pri" type="button" onClick="{{lg.enter}}" title="Inicia sesión con el operador, la sociedad y el ejercicio elegidos">Entrar</button>
</div>
</div>
</div>
</sc-if>

<sc-if value="{{gate.closed}}" hint-placeholder-val="{{false}}">
<div class="gate navy">
<div class="gcard sm">
<h1 class="disp">ProConta se ha cerrado</h1>
<p>Simulación de salida de la aplicación. En Windows la ventana desaparecería.</p>
<div class="gfoot"><button class="btn pri" type="button" onClick="{{gate.reopen}}" title="Vuelve a abrir ProConta">Abrir de nuevo</button></div>
</div>
</div>
</sc-if>

<sc-if value="{{m.tbus}}" hint-placeholder-val="{{false}}">
<div class="mod">
<div class="mtb">
<sc-if value="{{m.showTitle}}" hint-placeholder-val="{{false}}"><h1 class="mt disp">Terceros</h1></sc-if>
<label class="rs" style="width: {{m.qW}}px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg><input type="search" placeholder="Nombre, apellidos, razón social, NIF, teléfono, email, Id…" value="{{m.q}}" onChange="{{m.onQ}}" aria-label="Buscar terceros en todos sus datos" title="Busca en todos los datos del tercero; con varias palabras deben aparecer todas"></label>
<div class="fill"></div>
<span class="tr-help tr-nw">{{m.openInfo}}</span>
<button class="btn" type="button" disabled="{{m.noSel}}" onClick="{{m.openSel}}" title="Abre el registro seleccionado en su propia pestaña">Abrir ficha</button>
<sc-if value="{{m.newMenu}}" hint-placeholder-val="{{false}}"><button class="tr-clear" type="button" aria-label="Cerrar menú" onClick="{{m.closeNew}}" style="z-index: 20"></button></sc-if>
<span style="position: relative; z-index: 21; display: inline-flex">

<sc-if value="{{m.newMenu}}" hint-placeholder-val="{{false}}">
<div class="tr-menu" role="menu" style="right: 0; top: 40px; width: 200px"><sc-for list="{{m.newOpts}}" as="o" hint-placeholder-count="4"><button class="tr-mi" type="button" role="menuitem" onClick="{{o.run}}" title="Crea un tercero nuevo: {{o.t}}"><span class="tr-dot" style="background: {{o.c}}"></span>{{o.t}}</button></sc-for></div>
</sc-if>
</span>
</div>
<div class="tr-bfil">
<div class="seg" role="group" aria-label="Tipo de tercero"><sc-for list="{{m.tipos}}" as="t" hint-placeholder-count="4"><button class="{{t.cls}}" type="button" aria-pressed="{{t.on}}" onClick="{{t.pick}}" title="Muestra solo: {{t.t}}">{{t.t}} <span class="ct">{{t.n}}</span></button></sc-for></div>
<span class="tr-bsep" aria-hidden="true"></span>
<div style="display: flex; gap: 5px; align-items: center" role="group" aria-label="Roles"><sc-for list="{{m.funs}}" as="c" hint-placeholder-count="3"><button class="{{c.cls}}" type="button" aria-pressed="{{c.on}}" onClick="{{c.pick}}" title="Filtra por el rol {{c.t}}; se pueden combinar varios"><span class="{{c.dot}}"></span>{{c.t}} <span class="tr-ct tn">{{c.n}}</span></button></sc-for></div>
<sc-if value="{{m.funNote}}" hint-placeholder-val="{{false}}"><span class="tr-help tr-nw">con todas las marcadas</span></sc-if>
<span class="tr-bsep" aria-hidden="true"></span>
<select class="tr-sel" aria-label="Perfil" value="{{m.perf}}" onChange="{{m.onPerf}}" style="width: 190px" title="Muestra solo los terceros con este perfil"><sc-for list="{{m.perfOpts}}" as="o" hint-placeholder-count="3"><option value="{{o.v}}">{{o.t}}</option></sc-for></select>
<div class="fill"></div>
<sc-if value="{{m.hasF}}" hint-placeholder-val="{{false}}"><button class="tr-lnk" type="button" onClick="{{m.clearF}}" title="Vacía la búsqueda y quita todos los filtros">Quitar búsqueda y filtros</button></sc-if>
</div>
<div class="tr-bwrap scroll" data-sk="{{m.sk}}" onScroll="{{m.onScroll}}">
<div class="{{m.gridCls}} tr-bh"><span></span><span>Tercero</span><span>Tipo</span><span>NIF</span><span>IdTercero</span><span>Roles</span><span>Población</span><span>Teléfono</span><sc-if value="{{m.wide}}" hint-placeholder-val="{{true}}"><span>Email</span></sc-if><span>Coincide en</span></div>
<sc-if value="{{m.empty}}" hint-placeholder-val="{{false}}">
<div style="padding: 24px"><div class="tr-empty"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#9AA0AC" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path><path d="M8.5 11h5"></path></svg><b>{{m.emptyT}}</b><span style="max-width: 560px">{{m.emptyM}}</span><button class="btn sm" type="button" onClick="{{m.clearF}}" title="Vacía la búsqueda y quita todos los filtros">Quitar búsqueda y filtros</button></div></div>
</sc-if>
<sc-for list="{{m.rows}}" as="r" hint-placeholder-count="8">
<button class="{{r.cls}}" type="button" onClick="{{r.pick}}" onDoubleClick="{{r.dbl}}" onKeyDown="{{r.key}}" title="Doble clic o Intro: abrir la ficha en su pestaña">
<span class="{{m.gridCls}}">
<span class="{{r.avC}}" aria-hidden="true">{{r.ini}}</span>
<span style="display: flex; flex-direction: column; min-width: 0"><span class="tr-wrap" style="font-weight: 600; font-size: 13px">{{r.name}}<sc-if value="{{r.dirty}}" hint-placeholder-val="{{false}}"><span class="tdot sm" title="La ficha abierta tiene cambios sin guardar"></span></sc-if></span><span class="tr-cell tr-muted" style="font-size: 11.5px">{{r.sub}}<sc-if value="{{r.open}}" hint-placeholder-val="{{false}}"><span class="tr-opn">Ficha abierta</span></sc-if></span></span>
<span class="tr-cell tr-muted" style="font-size: 12px">{{r.tipo}}</span>
<span class="tr-cell tr-mono" style="font-size: 12px">{{r.nif}}<sc-if value="{{r.dup}}" hint-placeholder-val="{{false}}"><span class="tr-dupi" title="Comparte NIF con otro tercero" style="margin-left: 5px; vertical-align: -2px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"></rect><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path></svg></span></sc-if></span>
<span class="tr-cell tr-mono tr-muted" style="font-size: 12px">{{r.id}}</span>
<span class="tr-fbs"><sc-if value="{{r.c}}" hint-placeholder-val="{{true}}"><span class="tr-fb tr-fb-c" title="Cliente">Cli</span></sc-if><sc-if value="{{r.p}}" hint-placeholder-val="{{false}}"><span class="tr-fb tr-fb-p" title="Proveedor">Prov</span></sc-if><sc-if value="{{r.k}}" hint-placeholder-val="{{false}}"><span class="tr-fb tr-fb-k" title="Contacto">Cont</span></sc-if></span>
<span class="tr-cell" style="font-size: 12.5px">{{r.pob}}</span>
<span class="tr-cell tn" style="font-size: 12.5px">{{r.tel}}</span>
<sc-if value="{{m.wide}}" hint-placeholder-val="{{true}}"><span class="tr-cell" style="font-size: 12.5px">{{r.email}}</span></sc-if>
<span style="display: flex; flex-direction: column; min-width: 0"><sc-if value="{{r.hasHit}}" hint-placeholder-val="{{false}}"><span class="tr-cell" style="font-size: 10.5px; font-weight: 600; letter-spacing: .05em; text-transform: none; color: #8A4410">{{r.hit}}</span><span class="tr-cell" style="font-size: 12px">{{r.hitV}}</span></sc-if></span>
</span>
</button>
</sc-for>
</div>
<div class="mfoot"><span><b>{{m.count}}</b></span><span class="fill"></span><span>Doble clic o Intro abre la ficha en su pestaña · hasta 5 fichas: al abrir otra se cierra la más antigua sin cambios pendientes</span></div>
</div>
</sc-if>

<sc-if value="{{m.tfic}}" hint-placeholder-val="{{false}}">

<span class="{{m.h.avC}}" aria-hidden="true" style="width: 32px; height: 32px; font-size: 11.5px">{{m.h.ini}}</span>
<div style="display: flex; flex-direction: column; min-width: 0; flex-shrink: 0; max-width: {{m.nameW}}px">
<div style="display: flex; align-items: center; gap: 8px; min-width: 0"><h1 class="disp tr-cell" style="font-size: 16px; font-weight: 600; letter-spacing: -.01em; margin: 0">{{m.h.name}}</h1><span class="{{m.h.typeC}}" style="height: 20px; font-size: 11px; flex-shrink: 0">{{m.h.typeT}}</span></div>
<span class="tr-wrap tr-mono tr-muted" style="font-size: 11.5px">{{m.h.meta}}</span>
</div>
<sc-if value="{{m.h.dup}}" hint-placeholder-val="{{false}}"><button class="tr-pill tr-p-warn" type="button" style="border: 0; cursor: pointer; height: 22px; flex-shrink: 0" onClick="{{m.h.goDup}}" title="Hay otros terceros con el mismo NIF; pulsa para verlos">{{m.h.dupN}}</button></sc-if>
<sc-if value="{{m.h.isNew}}" hint-placeholder-val="{{false}}"><span class="tr-pill tr-p-new" style="height: 22px; flex-shrink: 0">Nuevo, sin guardar</span></sc-if>
<span class="tr-bsep" aria-hidden="true" style="margin: 0 4px"></span>
<div class="tr-rbs" role="group" aria-label="Roles del tercero"><sc-for list="{{m.roleBadges}}" as="f" hint-placeholder-count="2"><button class="{{f.cls}}" type="button" onClick="{{f.go}}" title="{{f.tip}}"><span>{{f.t}}</span><span class="tr-mono tr-rb-id">{{f.id}}</span></button></sc-for><sc-if value="{{m.noRoles}}" hint-placeholder-val="{{false}}"><button class="tr-rb tr-rb-none" type="button" onClick="{{m.goRoles}}" title="Ir a Roles para activar alguno">Sin roles</button></sc-if></div>
<div class="fill"></div>

</div>
<div class="stabs" role="tablist" aria-label="Secciones de la ficha"><sc-for list="{{m.tabs}}" as="s" hint-placeholder-count="5"><button class="{{s.cls}}" type="button" role="tab" aria-selected="{{s.on}}" onClick="{{s.pick}}" title="Muestra la sección {{s.t}} de la ficha">{{s.t}}<sc-if value="{{s.hasN}}" hint-placeholder-val="{{false}}"><span class="ct">{{s.n}}</span></sc-if><sc-if value="{{s.dirty}}" hint-placeholder-val="{{false}}"><span class="tdot sm" title="Cambios sin guardar en esta sección"></span></sc-if><sc-if value="{{s.bad}}" hint-placeholder-val="{{false}}"><span class="terr" title="Hay errores en esta sección"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 3.9L2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path><path d="M12 9v4M12 17h.01"></path></svg></span></sc-if></button></sc-for></div>
<div class="tr-fbody scroll" data-sk="{{m.sk}}" onScroll="{{m.onScroll}}">
<div class="tr-fin">

<sc-for list="{{m.errs}}" as="e" hint-placeholder-count="2"><button type="button" onClick="{{e.go}}" title="Lleva al campo con el error para corregirlo">{{e.where}} · {{e.msg}}</button></sc-for>
</div>
</sc-if>

<sc-if value="{{m.tabIs.ident}}" hint-placeholder-val="{{true}}">

<label class="tr-fld tr-w-nom"><span class="tr-lbl">Segundo apellido</span><input class="tr-in" value="{{m.F.ap2.v}}" onChange="{{m.F.ap2.set}}" maxlength="40"></label>

</div>

</div>

</sc-for>

</sc-if>

<div class="tr-shead" style="margin-top: 4px"><h3>Domicilios</h3><span class="tr-hint">Principal y adicionales, con su finalidad.</span><div style="flex-grow: 1"></div><button class="tr-btn tr-sm" type="button" onClick="{{m.addDom}}" title="Añade otro domicilio con su finalidad (fiscal, envío, almacén…)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Añadir domicilio</button></div>
<sc-if value="{{m.domErr.has}}" hint-placeholder-val="{{false}}"><span class="tr-emsg">{{m.domErr.msg}}</span></sc-if>

<div class="{{d.boxC}}">

<sc-if value="{{d.isPrin}}" hint-placeholder-val="{{true}}"><span class="tr-pill" style="background: #F4A259; color: #14213A; font-weight: 600">Principal</span></sc-if>
<sc-if value="{{d.notPrin}}" hint-placeholder-val="{{false}}"><button class="tr-lnk" type="button" onClick="{{d.makePrin}}" title="Convierte este domicilio en el principal del tercero">Marcar como principal</button></sc-if>

<span class="tr-help">Activo</span>

<button class="tr-icb tr-del" type="button" aria-label="Eliminar domicilio" onClick="{{d.remove}}" title="Elimina este domicilio al guardar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg></button>

<sc-if value="{{d.isES}}" hint-placeholder-val="{{true}}">

<label class="tr-fld"><span class="tr-lbl">Población</span><select class="{{d.pob.cls}}" data-fk="{{d.fkPob}}" value="{{d.pob.v}}" onChange="{{d.setPob}}" title="{{d.pob.tip}}"><sc-for list="{{d.pobOpts}}" as="o" hint-placeholder-count="3"><option value="{{o.v}}">{{o.t}}</option></sc-for></select></label>

<label class="tr-fld"><span class="tr-lbl">Población</span><input class="{{d.pob.cls}}" data-fk="{{d.fkPob}}" value="{{d.pob.v}}" onChange="{{d.pob.set}}" maxlength="50" title="{{d.pob.tip}}"></label>
</sc-if>
<label class="tr-fld"><span class="tr-lbl">Vía y número</span><input class="{{d.via.cls}}" data-fk="{{d.fkVia}}" value="{{d.via.v}}" onChange="{{d.via.set}}" maxlength="100" title="{{d.via.tip}}"></label>
</div>
</div>
</sc-for>
<div class="tr-note">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><circle cx="12" cy="12" r="9"></circle><path d="M12 8h.01M11 12h1v4h1"></path></svg>
<span>{{m.emitNote}}</span>
</div>
</sc-if>

<sc-if value="{{m.tabIs.contacto}}" hint-placeholder-val="{{false}}">

<sc-if value="{{m.emailsEmpty}}" hint-placeholder-val="{{false}}"><div class="tr-empty"><b>Sin emails</b><span>Añade una dirección para enviar facturas o comunicaciones administrativas.</span></div></sc-if>

<div style="display: flex; flex-direction: column">

<div class="tr-gt tr-gtr tr-g-em">

<div class="tr-cbx"><button class="{{e.actCls}}" type="button" role="switch" aria-checked="{{e.act}}" aria-label="Email activo" onClick="{{e.toggleAct}}" title="Activa o desactiva este email; uno inactivo no recibe envíos"><i></i></button></div>

</div>
</sc-for>
</div>
</sc-if>
<div class="tr-box" style="gap: 2px; padding: 10px 14px; background: #FBFAF7">
<span class="tr-sec" style="margin-bottom: 4px">Destinatarios efectivos</span>
<div class="{{m.rcFac.cls}}"><span class="tr-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M8 12.5l2.5 2.5L16 9.5"></path></svg></span><span style="font-weight: 500">Envío de facturas</span><span class="tr-tx">{{m.rcFac.txt}}</span></div>
<div class="{{m.rcAdm.cls}}"><span class="tr-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M8 12.5l2.5 2.5L16 9.5"></path></svg></span><span style="font-weight: 500">Comunic. administrativas</span><span class="tr-tx">{{m.rcAdm.txt}}</span></div>
</div>

<div class="tr-shead" style="margin-top: 6px"><h3>Teléfonos</h3><div style="flex-grow: 1"></div><button class="tr-btn tr-sm" type="button" onClick="{{m.addPhone}}" title="Añade otro número de teléfono"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Añadir teléfono</button></div>

<div style="display: flex; flex-direction: column">

<div class="tr-gt tr-gtr tr-g-ph">
<input class="tr-in" value="{{p.etq.v}}" onChange="{{p.etq.set}}" aria-label="Etiqueta" placeholder="Centralita" maxlength="30" title="{{p.etq.tip}}">
<div class="tr-fld"><input class="{{p.num.cls}}" value="{{p.num.v}}" onChange="{{p.num.set}}" aria-label="Número" placeholder="+34 900 000 000" maxlength="20" title="{{p.num.tip}}"></div>
<div class="tr-cbx"><button class="{{p.actCls}}" type="button" role="switch" aria-checked="{{p.act}}" aria-label="Teléfono activo" onClick="{{p.toggleAct}}" title="Activa o desactiva este teléfono; uno inactivo se conserva pero no se muestra como contacto"><i></i></button></div>

</div>
</sc-for>
</div>
</sc-if>

<div class="tr-shead" style="margin-top: 6px"><h3>{{m.rel.title}}</h3><span class="tr-hint">{{m.rel.sub}}</span><div style="flex-grow: 1"></div>
<sc-if value="{{m.rel.hasHist}}" hint-placeholder-val="{{false}}"><button class="tr-lnk" type="button" onClick="{{m.rel.toggleHist}}" title="Muestra u oculta las relaciones que ya no están vigentes">{{m.rel.histLbl}}</button></sc-if></div>

<div class="tr-gt tr-gtr tr-g-rel">
<span style="display: flex; align-items: center; gap: 9px; min-width: 0"><span class="{{x.avC}}" aria-hidden="true">{{x.ini}}</span><span style="display: flex; flex-direction: column; min-width: 0"><span style="font-weight: 600; font-size: 12.5px; line-height: 1.3">{{x.name}}</span></span></span>
<select class="tr-in" value="{{x.rol.v}}" onChange="{{x.rol.set}}" aria-label="Rol" title="{{x.rol.tip}}"><sc-for list="{{m.rolOpts}}" as="o" hint-placeholder-count="3"><option value="{{o.v}}">{{o.t}}</option></sc-for></select>

<span style="display: flex; gap: 2px"><button class="tr-icb" type="button" aria-label="Abrir ficha" title="Abrir ficha" onClick="{{x.open}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9"></path><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"></path></svg></button><button class="tr-icb tr-del" type="button" aria-label="Eliminar relación" onClick="{{x.remove}}" title="Quita esta persona de contacto al guardar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg></button></span>
</div>
</sc-for>

<div style="display: flex; gap: 10px; align-items: flex-end; padding: 12px; border-radius: 12px; background: #FBFAF7; border: 1px solid #F1EEE7">

<label class="tr-fld" style="width: 186px"><span class="tr-lbl">Rol</span><select class="tr-in" value="{{m.rel.nr.rol}}" onChange="{{m.rel.nr.setRol}}" title="Papel de la persona en este tercero"><sc-for list="{{m.rolOpts}}" as="o" hint-placeholder-count="3"><option value="{{o.v}}">{{o.t}}</option></sc-for></select></label>
<label class="tr-fld" style="width: 140px"><span class="tr-lbl">Desde</span><input class="tr-in" type="date" value="{{m.rel.nr.desde}}" onChange="{{m.rel.nr.setDesde}}" title="Fecha desde la que la relación es vigente"></label>
<button class="tr-btn" type="button" onClick="{{m.rel.nr.add}}" disabled="{{m.rel.nr.cant}}" title="Vincula la persona elegida con su rol y fecha">Vincular</button>
</div>
<div class="tr-note">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><circle cx="12" cy="12" r="9"></circle><path d="M12 8h.01M11 12h1v4h1"></path></svg>
<span>Un buzón genérico como «Administración» es una etiqueta de email de la organización: no hace falta crear una persona ficticia para él.</span>
</div>
</sc-if>

/* ProConta · contenedor principal (maqueta). Datos ficticios. */
function pad(n) { return (n < 10 ? '0' : '') + n; }
function pad4(n) { return String(n).padStart(4, '0'); }
function r2(x) { return Math.round((x || 0) * 100) / 100; }
function num(v) { v = Number(v || 0); var neg = v < -0.004, s = Math.abs(v).toFixed(2).split('.'); return (neg ? '−' : '') + s[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ',' + s[1]; }
