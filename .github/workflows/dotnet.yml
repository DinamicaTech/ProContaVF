name: Compilar y probar
# Compila la solución .NET (WPF, x64) y pasa las pruebas automáticas en cada pull request y cada día.
on:
  pull_request:
    paths: ['src/**', 'tests/**', '*.slnx', 'Directory.Build.props', '.github/workflows/dotnet.yml']
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', '*.slnx', 'Directory.Build.props', '.github/workflows/dotnet.yml']
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compilar
        run: dotnet build ProContaVF.slnx -c Release -p:Platform=x64
      - name: Pruebas
        run: dotnet test ProContaVF.slnx -c Release -p:Platform=x64 --no-build --logger "trx;LogFileName=pruebas.trx"
      - name: Resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pruebas
          path: '**/TestResults/*.trx'
